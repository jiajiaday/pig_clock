<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FDF6EC" id="metaTheme" />
  <title>不理不理左衛門時鐘</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" href="clock-pigs/jf-openhuninn-2.0.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* 1. 真正的瀨戶字體（SetoFont，含數字 0-9、標點與日文/基本漢字） */
    @font-face {
      font-family: "SetoFontReal";
      src:
        local("SetoFont"),
        local("SetoFont-SP"),
        local("瀬戸フォント"),
        url("clock-pigs/SetoFont.woff2") format("woff2"),
        url("clock-pigs/SetoFont.ttf") format("truetype"),
        url("https://cdn.leafscape.be/setofont/setofont_web.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* 2. 內海字體（基於瀨戶字體的繁體中文補字版，補齊「衛、豬」等常用字） */
    @font-face {
      font-family: "NaikaiSetoExt";
      src: url("https://cdn.jsdelivr.net/gh/max32002/naikaifont@1.89/webfont/NaikaiFont-Regular-Lite.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* 3. 本機粉圓體離線備援 */
    @font-face {
      font-family: "LocalRoundFallback";
      src: url("clock-pigs/jf-openhuninn-2.0.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #FDF6EC;
      --ink: #3B2318;
      --pill-bg: #FFFAF3;
      --pill-border: #3B2318;
      --modal-bg: #FDF6EC;
      --card-bg: #FFFFFF;
      --accent: #F4B89C;
      --font-round: "SetoFontReal", "NaikaiSetoExt", "SetoFont", "LocalRoundFallback", "jf open 粉圓 2.0", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body.night {
      --bg: #050505;
      --ink: #F5EDE4;
      --pill-bg: rgba(28, 28, 32, 0.94);
      --pill-border: rgba(245, 237, 228, 0.82);
      --modal-bg: #18181B;
      --card-bg: #242429;
      --accent: #D98A6C;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-round);
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s ease, color 0.25s ease;
      touch-action: none;
    }

    /* 維持瀨戶手寫字體的自然筆觸並稍微加厚辨識度 */
    #titleTrigger,
    .date-pill,
    .pill-btn,
    #btnShowBar,
    .modal-head h2,
    .section-title,
    .seg-btn,
    .chip,
    .size-btn,
    #modalPreview {
      font-family: var(--font-round);
      -webkit-text-stroke: 0.22px currentColor;
      paint-order: stroke fill;
    }

    #stageRoot {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    body.force-landscape #stageRoot {
      width: 100vh;
      height: 100vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;
    }

    #clockCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.16s ease-out;
    }

    #clockCanvas.ready {
      opacity: 1;
    }

    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 12px;
      pointer-events: none;
    }

    .top-bar-inner {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      max-width: 96vw;
      pointer-events: none;
    }

    /* 手繪不規則外框：頂部標題框 */
    #titleTrigger {
      position: relative;
      pointer-events: auto;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 95vw;
      padding: 7px 17px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.5px 2px 2.8px 2.2px;
      border-radius: 26px 11px 24px 13px / 13px 25px 11px 23px;
      background: var(--pill-bg);
      color: var(--ink);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.24;
      letter-spacing: 0.04em;
      cursor: pointer;
      transform: rotate(-0.9deg);
      box-shadow: 3px 4px 0 var(--pill-border);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    #titleTrigger::before {
      content: "";
      position: absolute;
      inset: -3px -2px -2px -3px;
      border: 1.4px solid var(--pill-border);
      border-radius: 13px 25px 12px 24px / 24px 12px 25px 13px;
      opacity: 0.45;
      transform: rotate(1.1deg);
      pointer-events: none;
    }

    #titleTrigger:hover {
      transform: rotate(-0.3deg) translateY(-1px);
      box-shadow: 3.5px 5px 0 var(--pill-border);
    }

    #titleTrigger:active {
      transform: rotate(0deg) translate(2px, 2.5px) scale(0.97);
      box-shadow: 1px 1.5px 0 var(--pill-border);
    }

    /* 手繪不規則外框：日期／星期小標籤 */
    .date-pill {
      position: relative;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 13px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.2px 1.8px 2.4px 2px;
      border-radius: 12px 23px 13px 21px / 21px 12px 22px 13px;
      background: var(--pill-bg);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      transform: rotate(1.15deg);
      box-shadow: 2.5px 3.2px 0 var(--pill-border);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    .date-pill::before {
      content: "";
      position: absolute;
      inset: -2.5px -2px -2px -2.5px;
      border: 1.2px solid var(--pill-border);
      border-radius: 22px 11px 20px 12px / 11px 21px 12px 20px;
      opacity: 0.42;
      transform: rotate(-1.1deg);
      pointer-events: none;
    }

    .date-pill:active {
      transform: rotate(0deg) translate(1.5px, 2px) scale(0.97);
      box-shadow: 1px 1px 0 var(--pill-border);
    }

    #titleIcon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #titleIconImg {
      display: none;
      width: 32px;
      height: 32px;
      object-fit: contain;
      vertical-align: middle;
    }

    .ctrl-btn-icon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ctrl-btn-img {
      display: inline-block;
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
    }

    .edit-badge {
      font-size: 0.6em;
      opacity: 0.65;
      margin-left: 2px;
      -webkit-text-stroke: 0;
    }

    #bottomBar {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
      pointer-events: none;
    }

    .toolbar-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      max-width: 98vw;
    }

    /* 手繪不規則雙層描邊按鈕 */
    .pill-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 12px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.3px 1.8px 2.5px 2px;
      border-radius: 21px 9px 19px 11px / 10px 20px 9px 19px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-size: 14.5px;
      line-height: 1.24;
      letter-spacing: 0.04em;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2.5px 3.2px 0 var(--pill-border);
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.12s ease;
    }

    .pill-btn::before {
      content: "";
      position: absolute;
      inset: -2.5px -2px -2px -2.5px;
      border: 1.25px solid var(--pill-border);
      border-radius: 10px 21px 11px 19px / 19px 10px 20px 11px;
      opacity: 0.42;
      transform: rotate(0.95deg);
      pointer-events: none;
    }

    .toolbar-row .pill-btn:nth-child(1) {
      border-radius: 22px 9px 20px 11px / 10px 21px 9px 19px;
      transform: rotate(-0.9deg);
    }

    .toolbar-row .pill-btn:nth-child(2) {
      border-radius: 10px 22px 11px 20px / 20px 10px 22px 11px;
      transform: rotate(0.85deg);
    }

    .toolbar-row .pill-btn:nth-child(3) {
      border-radius: 19px 12px 23px 9px / 11px 19px 10px 22px;
      transform: rotate(-0.65deg);
    }

    .toolbar-row .pill-btn:nth-child(4) {
      border-radius: 11px 20px 9px 22px / 21px 11px 19px 10px;
      transform: rotate(0.95deg);
    }

    .toolbar-row .pill-btn:nth-child(5) {
      border-radius: 23px 10px 18px 12px / 9px 22px 11px 18px;
      transform: rotate(-0.8deg);
    }

    .toolbar-row .pill-btn:nth-child(6) {
      border-radius: 9px 21px 12px 20px / 19px 9px 21px 12px;
      transform: rotate(0.75deg);
    }

    .pill-btn:hover {
      transform: rotate(0deg) translateY(-1px);
      box-shadow: 3px 4.2px 0 var(--pill-border);
    }

    .pill-btn:active {
      transform: rotate(0deg) translate(1.8px, 2.2px) scale(0.96);
      box-shadow: 0.8px 1px 0 var(--pill-border);
    }

    .pill-btn.primary {
      background-color: var(--accent);
      color: #2B1810;
    }

    .hidden {
      display: none !important;
    }

    /* 手繪不規則外框：「顯示選項」懸浮鈕 */
    #btnShowBar {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.3px 1.8px 2.5px 2px;
      border-radius: 21px 9px 19px 11px / 10px 20px 9px 19px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.24;
      letter-spacing: 0.04em;
      font-weight: 700;
      opacity: 0.95;
      cursor: pointer;
      transform: rotate(-1deg);
      box-shadow: 2.5px 3.2px 0 var(--pill-border), 0 4px 10px rgba(0, 0, 0, 0.16);
      transition: opacity 0.2s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btnShowBar::before {
      content: "";
      position: absolute;
      inset: -2.5px -2px -2px -2.5px;
      border: 1.25px solid var(--pill-border);
      border-radius: 10px 21px 11px 19px / 19px 10px 20px 11px;
      opacity: 0.44;
      transform: rotate(1deg);
      pointer-events: none;
    }

    #btnShowBar:active {
      opacity: 1;
      transform: rotate(0deg) translate(1.5px, 2px) scale(0.96);
      box-shadow: 1px 1px 0 var(--pill-border);
    }

    #titleModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.54);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #titleModal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background-color: var(--modal-bg);
      color: var(--ink);
      font-family: var(--font-round);
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.5px 2px 2.8px 2.2px;
      border-radius: 26px 14px 28px 16px / 15px 26px 14px 25px;
      padding: 16px;
      box-shadow: 4px 5px 0 var(--pill-border), 0 14px 36px rgba(0, 0, 0, 0.3);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      position: relative;
      width: 33px;
      height: 33px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2px 1.6px 2.2px 1.8px;
      border-radius: 14px 8px 15px 9px / 9px 15px 8px 14px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-weight: 700;
      cursor: pointer;
      transform: rotate(1.4deg);
      box-shadow: 1.8px 2.2px 0 var(--pill-border);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .close-btn:active {
      transform: rotate(0deg) translate(1px, 1.5px);
      box-shadow: 0.5px 1px 0 var(--pill-border);
    }

    .section-card {
      margin-bottom: 13px;
      padding: 11px 12px;
      border-radius: 18px 11px 19px 12px / 12px 18px 11px 17px;
      background: rgba(128, 128, 128, 0.06);
      border: 1.4px solid rgba(128, 128, 128, 0.28);
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-panel {
      background: var(--card-bg);
      border: 1.8px dashed rgba(128, 128, 128, 0.48);
      border-radius: 20px 11px 21px 12px / 12px 20px 11px 19px;
      padding: 10px;
      margin-bottom: 11px;
      text-align: center;
    }

    .preview-tag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.65;
      margin-bottom: 4px;
    }

    #modalPreview {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      min-height: 36px;
    }

    #previewImg {
      display: inline-block;
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    #previewDatePill {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      font-size: 13px;
      font-weight: 700;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.8px 1.4px 2px 1.5px;
      border-radius: 10px 18px 11px 17px / 17px 10px 18px 11px;
      background: var(--pill-bg);
      box-shadow: 1.6px 2px 0 var(--pill-border);
      margin-left: 4px;
    }

    .preview-btns-bar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(128, 128, 128, 0.28);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 700;
    }

    .preview-mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.8px 1.4px 2px 1.5px;
      border-radius: 16px 8px 15px 9px / 9px 15px 8px 16px;
      background: var(--pill-bg);
      box-shadow: 1.8px 2.2px 0 var(--pill-border);
    }

    .preview-mini-img {
      display: inline-block;
      width: 19px;
      height: 19px;
      object-fit: contain;
    }

    .field-group {
      margin-bottom: 11px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.16);
    }

    .field-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .seg-btn {
      position: relative;
      padding: 8px 10px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.1px 1.7px 2.3px 1.9px;
      border-radius: 19px 9px 18px 10px / 10px 18px 9px 19px;
      background: var(--card-bg);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2.8px 0 var(--pill-border);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.1s ease;
    }

    .seg-btn:nth-child(1) {
      transform: rotate(-0.75deg);
    }

    .seg-btn:nth-child(2) {
      border-radius: 9px 19px 10px 18px / 18px 10px 19px 9px;
      transform: rotate(0.75deg);
    }

    .seg-btn:active {
      transform: rotate(0deg) translate(1.2px, 1.8px);
      box-shadow: 0.6px 1px 0 var(--pill-border);
    }

    .seg-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .text-box {
      width: 100%;
      padding: 8px 12px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2px 1.7px 2.2px 1.8px;
      border-radius: 16px 9px 17px 10px / 10px 16px 9px 15px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-size: 14px;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 7px;
    }

    .chip {
      position: relative;
      padding: 5px 11px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.9px 1.5px 2.1px 1.7px;
      border-radius: 16px 8px 15px 9px / 9px 16px 8px 15px;
      background: var(--card-bg);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1.8px 2.3px 0 var(--pill-border);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.1s ease;
    }

    .chip:nth-child(even) {
      border-radius: 8px 16px 9px 15px / 15px 8px 16px 9px;
    }

    .chip:active {
      transform: translate(1.2px, 1.5px);
      box-shadow: 0.5px 1px 0 var(--pill-border);
    }

    .chip.active {
      background: var(--accent);
      color: #2B1810;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .size-btn {
      padding: 6px 2px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.8px 1.5px 2px 1.6px;
      border-radius: 14px 8px 13px 9px / 9px 14px 8px 13px;
      background: var(--card-bg);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1.4px 2px 0 var(--pill-border);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.1s ease;
    }

    .size-btn:nth-child(even) {
      border-radius: 8px 14px 9px 13px / 13px 8px 14px 9px;
    }

    .size-btn:active {
      transform: translate(1px, 1.2px);
      box-shadow: 0.5px 0.5px 0 var(--pill-border);
    }

    .size-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #D97757;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .sticker-item {

                      if (y < minY) minY = y;
                      if (y > maxY) maxY = y;
                    }
                  }
                }
              }
              tc.putImageData(imgData, 0, 0);

              if (maxX >= minX && maxY >= minY) {
                cropX = minX;
                cropY = minY;
                cropW = maxX - minX + 1;
                cropH = maxY - minY + 1;
              }
            }

          var off = document.createElement('canvas');
          off.width = outSize;
          off.height = outSize;
          var c = off.getContext('2d');
          var pad = Math.max(3, Math.round(outSize * 0.04));
          var scale = Math.min((outSize - pad * 2) / cropW, (outSize - pad * 2) / cropH);
          var dw = cropW * scale;
          var dh = cropH * scale;
          c.drawImage(tmp, cropX, cropY, cropW, cropH, (outSize - dw) / 2, (outSize - dh) / 2, dw, dh);
          off._isDarkBg = isDarkBg;

          callback(off);
        } catch (err) {

      /* Chaikin 手寫弧線平滑化（保留標記為尖角的轉折點） */
      function smoothSetoPolyline(pts, iterations) {
        var cur = pts.slice();
        for (var it = 0; it < iterations; it++) {
          if (cur.length < 3) break;
          var next = [cur[0]];
          for (var i = 0; i < cur.length - 1; i++) {
            var p0 = cur[i];
            var p1 = cur[i + 1];
            if (p0[2] === 1 || p1[2] === 1) {
              next.push(p1);
            } else {
              next.push([p0[0] * 0.75 + p1[0] * 0.25, p0[1] * 0.75 + p1[1] * 0.25, 0]);
              next.push([p0[0] * 0.25 + p1[0] * 0.75, p0[1] * 0.25 + p1[1] * 0.75, 0]);
            }
          }
          next.push(cur[cur.length - 1]);
          cur = next;
        }
        return cur;
      }

      function samplePolyline(pts, count, smoothIter) {
        var workPts = smoothIter ? smoothSetoPolyline(pts, smoothIter) : pts;
        var segLengths = [];
        var totalLen = 0;
        for (var i = 0; i < workPts.length - 1; i++) {
          var dx = workPts[i + 1][0] - workPts[i][0];
          var dy = workPts[i + 1][1] - workPts[i][1];
          var len = Math.sqrt(dx * dx + dy * dy);
          segLengths.push(len);
          totalLen += len;
        }
        var out = [];
        if (totalLen <= 0 || count <= 1) {
          out.push({ x: workPts[0][0], y: workPts[0][1] });
          return out;
        }
        for (var k = 0; k < count; k++) {
          var targetDist = (k / (count - 1)) * totalLen;
          var acc = 0;
          var placed = false;
          for (var s = 0; s < segLengths.length; s++) {
            var sl = segLengths[s];
            if (acc + sl >= targetDist || s === segLengths.length - 1) {
              var t = sl > 0 ? Math.min(1, Math.max(0, (targetDist - acc) / sl)) : 0;
              out.push({
                x: workPts[s][0] + (workPts[s + 1][0] - workPts[s][0]) * t,
                y: workPts[s][1] + (workPts[s + 1][1] - workPts[s][1]) * t
              });
              placed = true;
              break;
            }
            acc += sl;
          }
          if (!placed) {
            var last = workPts[workPts.length - 1];
            out.push({ x: last[0], y: last[1] });
          }
        }
        return out;
      }

            size: sz,
            vx: fromLeft ? 125 : -125,
            phase: Math.random() * Math.PI * 2,
            facing: fromLeft ? 1 : -1,
            pauseTimer: 0,
            hasPausedAtMid: false
          });
        }
      }

      function getSafeBounds() {
        var topBarEl = document.getElementById('topBar');
        var bottomBarEl = document.getElementById('bottomBar');
        var topBottom = 14;
        if (currentSettings && currentSettings.visible && topBarEl) {
          topBottom = 64;
          var tr = topBarEl.getBoundingClientRect();
          if (tr && tr.bottom > 20) topBottom = Math.min(tr.bottom, H * 0.25);
        }
        var bottomTop = H - 14;
        if (!state.barHidden && bottomBarEl) {
          var br = bottomBarEl.getBoundingClientRect();
          if (br && br.top > 120) bottomTop = Math.max(br.top, H * 0.72);
        }
        return {
          topBottom: topBottom,
          bottomTop: bottomTop
        };
      }

      function triggerHeartDuetShow() {
        if (!state.gathered) return;
        state.heartShowTimer = 6.5;
        state.waveActive = false;

        var bounds = getSafeBounds();
        var cx = W * 0.5;
        var cy = (bounds.topBottom + bounds.bottomTop) * 0.5 + 4;
        var availW = W - 44;
        var availH = Math.max(160, bounds.bottomTop - bounds.topBottom - 26);

        var heartScale = Math.min(availW / 34, availH / 31);
        state.heartCenter = { x: cx, y: cy };
        state.heartScale = heartScale;

        var duetGap = Math.max(24, Math.min(48, heartScale * 3.4));
        var duetScale = Math.max(0.42, Math.min(0.68, heartScale * 0.048));
        var rimScale = Math.max(0.20, Math.min(0.32, heartScale * 0.024));

        var rimPigs = [];
        for (var i = 0; i < pigs.length; i++) {
          pigs[i].eggTimer = 0;
          if (!pigs[i].isWeirdo) pigs[i].overrideSprite = null;

          if (pigs[i].role === 'colon') {
            var side = pigs[i].colonIndex === 0 ? -1 : 1;
            pigs[i].tx = cx + side * duetGap;
            pigs[i].ty = cy + heartScale * 1.4;
            pigs[i].heartBaseX = pigs[i].tx;
            pigs[i].heartBaseY = pigs[i].ty;
            pigs[i].scale = duetScale;
            pigs[i].baseAlpha = 1;
            pigs[i].flipX = side === -1 ? 1 : -1;
          } else {
            rimPigs.push(pigs[i]);
          }
        }

        var rawPts = [];
        var STEPS = 720;
        for (var s = 0; s <= STEPS; s++) {
          var t = (s / STEPS) * Math.PI * 2;
          var hx = 16 * Math.pow(Math.sin(t), 3);
          var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          rawPts.push([hx, hy]);
        }
        var heartSamples = samplePolyline(rawPts, rimPigs.length + 1, 0);

        rimPigs.sort(function (a, b) {
          return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
        });

        var sampleObjs = [];
        for (var k = 0; k < rimPigs.length; k++) {
          var sx = cx + heartSamples[k].x * heartScale;
          var sy = cy + heartSamples[k].y * heartScale;
          sampleObjs.push({
            x: sx,
            y: sy,
            ang: Math.atan2(sy - cy, sx - cx)
          });
        }
        sampleObjs.sort(function (a, b) { return a.ang - b.ang; });

        for (var m = 0; m < rimPigs.length; m++) {
          rimPigs[m].tx = sampleObjs[m].x;
          rimPigs[m].ty = sampleObjs[m].y;
          rimPigs[m].heartBaseX = sampleObjs[m].x;
          rimPigs[m].heartBaseY = sampleObjs[m].y;
          rimPigs[m].scale = rimScale;
          rimPigs[m].baseAlpha = 1;
        }
      }

      function computeClockTargets() {
        if (state.heartShowTimer > 0) return;

        var now = new Date();
        var curMin = now.getMinutes();
        var curHour = now.getHours();
        if (curMin === 0 && now.getSeconds() === 0 && curHour !== state.lastHourTriggered) {
          state.lastHourTriggered = curHour;
          triggerGuestParade();
        }
        state.lastMinute = curMin;

        var hh = String(curHour).padStart(2, '0');
        var mm = String(curMin).padStart(2, '0');
        var digits = [hh[0], hh[1], mm[0], mm[1]];

        var isExtraLarge = currentSettings ? currentSettings.extraLarge : true;
        var isLandscape = W > H;

        var bounds = getSafeBounds();
        var topBottom = bounds.topBottom;
        var bottomTop = bounds.bottomTop;

        var safeTop = topBottom + 6;
        var safeBottom = Math.max(safeTop + 170, bottomTop - 6);
        var safeH = safeBottom - safeTop;

        // 上下兩排與時鐘上下緣的緊湊距離，同時預留秒數小氣泡高度
        var outerRowMargin = 38;
        var rowToClockGap = Math.max(32, Math.min(44, safeH * 0.075));

        var digitZoneTop = safeTop + outerRowMargin + rowToClockGap * 0.55;
        var digitZoneBot = safeBottom - outerRowMargin - rowToClockGap * 0.55;
        var digitZoneH = Math.max(96, digitZoneBot - digitZoneTop);

        var clockW = W * (isExtraLarge ? (isLandscape ? 0.84 : 0.91) : (isLandscape ? 0.72 : 0.79));
        var colonW = clockW * 0.095;
        var digitGap = clockW * 0.045;
        var digitW = (clockW - colonW - digitGap * 2) / 4;
        var ratioCap = isLandscape ? 1.38 : 1.92;
        var digitH = Math.min(digitZoneH * (isExtraLarge ? 0.94 : 0.78), digitW * ratioCap);

        var startX = (W - clockW) / 2;
        var centerY = (digitZoneTop + digitZoneBot) / 2;
        var topY = centerY - digitH / 2;
        var bottomY = topY + digitH;

        // 讓上下兩排貼近時鐘的 topY 與 bottomY，並確保不會撞到頂部標題與底部按鈕
        var topRowY = Math.max(safeTop + outerRowMargin, topY - rowToClockGap);
        var botRowY = Math.min(safeBottom - outerRowMargin, bottomY + rowToClockGap);

        state.clockBox = {
          left: startX - 18,
          right: startX + clockW + 18,
          top: topY - 18,
          bottom: bottomY + 18
        };

        var xOffsets = [
          startX,
          startX + digitW + digitGap,
          startX + digitW * 2 + digitGap + colonW,
          startX + digitW * 3 + digitGap * 2 + colonW
        ];

        var targets = [];
        var ptsPerDigit = 20;

        for (var d = 0; d < 4; d++) {
          var poly = SETO_DIGIT_POLYLINES[digits[d]] || SETO_DIGIT_POLYLINES['0'];
          var samples = samplePolyline(poly, ptsPerDigit, 2);
          for (var s = 0; s < samples.length; s++) {
            targets.push({
              x: xOffsets[d] + samples[s].x * digitW,
              y: topY + samples[s].y * digitH,
              role: 'digit',
              colonIndex: -1
            });
          }
        }

        var colonX = startX + digitW * 2 + digitGap + colonW * 0.5;
        targets.push({ x: colonX, y: topY + digitH * 0.34, role: 'colon', colonIndex: 0 });
        targets.push({ x: colonX, y: topY + digitH * 0.68, role: 'colon', colonIndex: 1 });

        for (var i = 0; i < pigs.length; i++) {
          pigs[i].role = 'roamer';
          pigs[i].colonIndex = -1;
          pigs[i].slotIndex = -1;
          pigs[i].baseAlpha = 1;
        }

        var used = new Array(pigs.length);
        var pigScale = Math.max(0.21, Math.min(0.32, (digitW / 96) * 0.45));

        for (var t = 0; t < targets.length; t++) {
          var bestIdx = -1;
          var bestDist = Infinity;
          for (var p = 0; p < pigs.length; p++) {
            if (used[p]) continue;
            var dx = pigs[p].x - targets[t].x;
            var dy = pigs[p].y - targets[t].y;
            var dist = dx * dx + dy * dy;
            if (dist < bestDist) {
              bestDist = dist;
              bestIdx = p;
            }
          }
          if (bestIdx !== -1) {
            used[bestIdx] = true;
            pigs[bestIdx].role = targets[t].role;
            pigs[bestIdx].colonIndex = targets[t].colonIndex;
            pigs[bestIdx].tx = targets[t].x;
            pigs[bestIdx].ty = targets[t].y;
            pigs[bestIdx].scale = pigScale;
            pigs[bestIdx].baseAlpha = 1;
          }
        }

        // 未排到時間的 60 隻小豬：分成上下兩排各 30 隻（00~29 秒在上方，30~59 秒在下方）
        var roamers = [];
        for (var r = 0; r < pigs.length; r++) {
          if (pigs[r].role === 'roamer') {
            roamers.push(pigs[r]);
          }
        }

        roamers.sort(function (a, b) { return a.y - b.y; });
        var halfCount = Math.floor(roamers.length / 2);
        var topRoamers = roamers.slice(0, halfCount);
        var botRoamers = roamers.slice(halfCount);

        var isAM = curHour < 12;
        var topRowScale = pigScale * (isAM ? 0.90 : 0.64);
        var botRowScale = pigScale * (isAM ? 0.64 : 0.90);
        var topRowAlpha = isAM ? 1.0 : 0.58;
        var botRowAlpha = isAM ? 0.58 : 1.0;

        // 水平範圍也與時鐘左右邊界對齊，整體像包圍時鐘的相框
        var rowLeft = Math.max(20, startX - 6);
        var rowRight = Math.min(W - 20, startX + clockW + 6);
        var rowSpan = Math.max(40, rowRight - rowLeft);

        function alignPigRow(list, rowY, rScale, rAlpha, baseSlot) {
          if (list.length === 0) return;
          list.sort(function (a, b) { return a.x - b.x; });
          for (var k = 0; k < list.length; k++) {
            list[k].slotIndex = baseSlot + k;
            list[k].tx = list.length === 1 ? (W * 0.5) : (rowLeft + (k / (list.length - 1)) * rowSpan);
            list[k].ty = rowY;
            list[k].scale = rScale;
            list[k].baseAlpha = rAlpha;
            list[k].vx = 0;
            list[k].vy = 0;
          }
        }

        alignPigRow(topRoamers, topRowY, topRowScale, topRowAlpha, 0);
        alignPigRow(botRoamers, botRowY, botRowScale, botRowAlpha, halfCount);
      }

      function applyWeirdoMix(enable) {
        var wPool = getWeirdoPool();
        for (var i = 0; i < pigs.length; i++) {
          pigs[i].isWeirdo = false;
          if (pigs[i].eggTimer <= 0) pigs[i].overrideSprite = null;
          if (enable && wPool.length > 0 && i % 6 === 0) {
            pigs[i].isWeirdo = true;
            pigs[i].overrideSprite = wPool[(i / 6) % wPool.length];
            pigs[i].scale = 0.56;
            pigs[i].baseAlpha = 1;
            var ang = Math.random() * Math.PI * 2;
            var spd = 55 + Math.random() * 45;
            pigs[i].vx = Math.cos(ang) * spd;
            pigs[i].vy = Math.sin(ang) * spd;
          }
        }
      }

      function setGathered(val, snapImmediate) {
        state.gathered = !!val;
        state.heartShowTimer = 0;
        var btn = document.getElementById('btnToggleGather');
        if (btn) {
          btn.textContent = state.gathered ? '自己玩 / 幾點了（時鐘)' : '自己玩 / 幾點了（玩耍中)';
        }
        if (state.gathered) {
          applyWeirdoMix(false);
          computeClockTargets();
          if (snapImmediate) {
            snapClockPigsToTargets();
          }
        } else {
          state.waveActive = false;
          applyWeirdoMix(true);
          for (var i = 0; i < pigs.length; i++) {
            pigs[i].role = 'roamer';
            pigs[i].slotIndex = -1;
            pigs[i].baseAlpha = 1;
            if (!pigs[i].isWeirdo) pigs[i].scale = 0.44;
            var angle = Math.random() * Math.PI * 2;
            var spd = 45 + Math.random() * 55;
            pigs[i].vx = Math.cos(angle) * spd;
            pigs[i].vy = Math.sin(angle) * spd;
          }
        }
      }

      function triggerPigEgg(pig, cycleNext) {
        var nextAction = cycleNext ? ((pig.eggAction + 1) % 4) : Math.floor(Math.random() * 4);
        pig.eggAction = nextAction;
        pig.eggTimer = 3.6;
        pig.clickFlip *= -1;
        pig.overrideSprite = null;

        if (nextAction === 0) {
          pig.vy = -150;
        } else if (nextAction === 2) {
          var pool = getClickEggPool();
          if (pool.length > 0) {
            pig.overrideSprite = pool[Math.floor(Math.random() * pool.length)];
          }
        } else if (nextAction === 3) {
          pig.wiggleFreq = 16;
        }
      }

      function findPigAt(px, py) {
        for (var c = 0; c < pigs.length; c++) {
          if (pigs[c].role === 'colon') {
            var cRadius = Math.max(30, 96 * pigs[c].scale * 0.95);
            if (Math.hypot(px - pigs[c].x, py - pigs[c].y) <= cRadius) {
              return pigs[c];
            }
          }
        }
        for (var i = pigs.length - 1; i >= 0; i--) {
          var p = pigs[i];
          var hitRadius = Math.max(24, 96 * p.scale * 0.65);
          if (Math.hypot(px - p.x, py - p.y) <= hitRadius) {
            return p;
          }
        }
        return null;
      }

      function toStageCoords(clientX, clientY) {
        var vw = window.innerWidth || document.documentElement.clientWidth || 320;
        var vh = window.innerHeight || document.documentElement.clientHeight || 480;
        if (currentSettings && currentSettings.forceLandscape) {
          return {
            x: clientY,
            y: vw - clientX
          };
        }
        return {
          x: clientX,
          y: clientY
        };
      }

      function handlePointerDown(clientX, clientY) {
        var pt = toStageCoords(clientX, clientY);
        var px = pt.x;
        var py = pt.y;
        pointerDownPos = { x: px, y: py };
        pointerMoved = false;

        for (var vIdx = paradeVisitors.length - 1; vIdx >= 0; vIdx--) {
          var vis = paradeVisitors[vIdx];
          if (Math.hypot(px - vis.x, py - vis.y) <= vis.size * 0.85) {
            vis.vx = -vis.vx;
            vis.facing *= -1;
            vis.pauseTimer = 1.2;
            return;
          }
        }

        if (!state.gathered) {
          return;
        }

        var hit = findPigAt(px, py);
        if (hit) {
          if (hit.role === 'colon') {
            triggerHeartDuetShow();
            return;
          }
          if (state.heartShowTimer <= 0) {
            draggingPig = hit;
            hit.eggTimer = Math.max(hit.eggTimer, 3.6);
          }
        }
      }

      function handlePointerMove(clientX, clientY) {
        if (!draggingPig || !state.gathered || state.heartShowTimer > 0) return;
        var pt = toStageCoords(clientX, clientY);
        var px = pt.x;
        var py = pt.y;
        if (Math.hypot(px - pointerDownPos.x, py - pointerDownPos.y) > 6) {
          pointerMoved = true;
        }
        if (pointerMoved) {
          draggingPig.x = Math.min(Math.max(px, 24), W - 24);
          draggingPig.y = Math.min(Math.max(py, 56), H - 36);
          draggingPig.vx = 0;
          draggingPig.vy = 0;
        }
      }

      function handlePointerUp(clientX, clientY) {
        var pt = toStageCoords(clientX, clientY);
        var isTap = Math.hypot(pt.x - pointerDownPos.x, pt.y - pointerDownPos.y) <= 10;

        if (!state.gathered) {
          if (isTap) {
            setGathered(true);
          }
          return;
        }

        if (draggingPig) {
          var targetPig = draggingPig;
          draggingPig = null;
          if (!pointerMoved) {
            triggerPigEgg(targetPig, targetPig.eggTimer > 0.2);
          }
          return;
        }

        if (isTap) {
          var hit = findPigAt(pt.x, pt.y);
          if (hit) {
            if (hit.role === 'colon') {
              triggerHeartDuetShow();
            } else if (state.heartShowTimer <= 0) {
              triggerPigEgg(hit, hit.eggTimer > 0.2);
            }
          } else if (state.heartShowTimer <= 0) {
            setGathered(false);
          }
        }
      }

      function updateDateBadgeText() {
        var label = formatTodayBadge();
        var badgeEl = document.getElementById('dateBadge');
        var prevEl = document.getElementById('previewDatePill');
        if (badgeEl && badgeEl.textContent !== label) badgeEl.textContent = label;
        if (prevEl && prevEl.textContent !== label) prevEl.textContent = label;
      }

      var lastTime = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        if (!lastTime) lastTime = now;
        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var sec = now / 1000;

        var wallNow = new Date();
        var curHour = wallNow.getHours();
        var curMin = wallNow.getMinutes();
        var curSec = wallNow.getSeconds();
        var secFrac = curSec + wallNow.getMilliseconds() / 1000;

        if (state.heartShowTimer > 0) {
          state.heartShowTimer -= dt;
          if (state.heartShowTimer <= 0) {
            state.heartShowTimer = 0;
            if (state.gathered) computeClockTargets();
          }
        }

        if (state.gathered && state.heartShowTimer <= 0 && curMin !== state.lastMinute) {
          updateDateBadgeText();
          computeClockTargets();
        }

        var chimeKey = curHour + ':' + curMin;
        if (state.gathered && state.heartShowTimer <= 0 && curSec === 0 && state.lastChimeKey !== chimeKey) {
          state.lastChimeKey = chimeKey;
          if (curMin === 0) {
            state.waveActive = true;
            state.waveStartTime = now;
            state.waveCycles = 99;
            state.waveContinuousEnd = now + 6500;
          } else {
            var cycles = curMin <= 15 ? 1 : (curMin <= 30 ? 2 : (curMin <= 45 ? 3 : 4));
            state.waveActive = true;
            state.waveStartTime = now;
            state.waveCycles = cycles;
            state.waveContinuousEnd = 0;
          }
        }

        var waveElapsed = 0;
        var PASS_DUR = 1.62;
        if (state.waveActive) {
          waveElapsed = (now - state.waveStartTime) / 1000;
          if (state.waveContinuousEnd > 0) {
            if (now > state.waveContinuousEnd) state.waveActive = false;
          } else if (waveElapsed > state.waveCycles * PASS_DUR + 0.35) {
            state.waveActive = false;
          }
        }

        var colonBeat = 0.5 + 0.5 * Math.cos(secFrac * Math.PI * 2);
        var colonPulseScale = 0.88 + 0.30 * colonBeat;
        var colonPulseAlpha = 0.35 + 0.65 * colonBeat;

        var heartBeat = 1 + 0.055 * Math.sin(sec * 6.2);

        ctx.fillStyle = state.nightMode ? '#050505' : '#FDF6EC';
        ctx.fillRect(0, 0, W, H);

        if (!state.nightMode) {
          ctx.fillStyle = 'rgba(59, 35, 24, 0.05)';
          for (var gx = 16; gx < W; gx += 28) {
            for (var gy = 16; gy < H; gy += 28) {
              ctx.fillRect(gx, gy, 1.5, 1.5);
            }
          }
        }

        var box = state.clockBox;
        var minTopY = (currentSettings && currentSettings.visible) ? 64 : 26;
        var pool = getCurrentRoamerPool();
        var activeSecPig = null;

        for (var i = 0; i < pigs.length; i++) {
          var p = pigs[i];
          p.wigglePhase += dt * p.wiggleFreq;

          var isFocusedEgg = p.eggTimer > 0 && state.heartShowTimer <= 0;
          if (isFocusedEgg) {
            p.eggTimer -= dt;
            if (p.eggTimer <= 0) {
              p.eggTimer = 0;
              p.wiggleFreq = 3.6 + (i % 5) * 0.45;
              if (!p.isWeirdo) p.overrideSprite = null;
            }
          }

          if (state.gathered && state.heartShowTimer > 0) {
            if (p.role === 'colon') {
              var sideDir = p.colonIndex === 0 ? -1 : 1;
              var duetSway = Math.sin(sec * 5.2) * 7;
              p.tx = p.heartBaseX + duetSway;
              p.ty = p.heartBaseY - Math.abs(Math.sin(sec * 7.5 + p.colonIndex * 1.4)) * 10;
              p.flipX = sideDir === -1 ? 1 : -1;
            } else {
              var relX = p.heartBaseX - state.heartCenter.x;
              var relY = p.heartBaseY - state.heartCenter.y;
              p.tx = state.heartCenter.x + relX * heartBeat;
              p.ty = state.heartCenter.y + relY * heartBeat;
            }
          }

          if (p === draggingPig) {
            // 拖曳中
          } else if (isFocusedEgg && p.eggAction === 1) {
            p.y += Math.sin(sec * 8 + p.id) * 0.4;
          } else if (state.gathered && !isFocusedEgg) {
            var dx = p.tx - p.x;
            var dy = p.ty - p.y;
            if (Math.abs(dx) > 0.35 || Math.abs(dy) > 0.35) {
              p.x += dx * Math.min(1, dt * 8.2);
              p.y += dy * Math.min(1, dt * 8.2);
              if (state.heartShowTimer <= 0 && Math.abs(dx) > 1.5) {
                p.flipX = dx >= 0 ? 1 : -1;
              }
            } else {
              p.x = p.tx;
              p.y = p.ty;
            }
          } else {
            p.poseTimer -= dt;
            if (p.poseTimer <= 0) {
              if (!p.isWeirdo && !isFocusedEgg) {
                p.pose = Math.floor(Math.random() * pool.length);
              }
              p.poseTimer = 2 + Math.random() * 4;
              var ang = Math.random() * Math.PI * 2;
              var speed = p.isWeirdo ? (55 + Math.random() * 45) : (35 + Math.random() * 55);
              p.vx = Math.cos(ang) * speed;
              p.vy = Math.sin(ang) * speed;
            }

            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (Math.abs(p.vx) > 2) p.flipX = p.vx >= 0 ? 1 : -1;

            var margin = 24;
            if (p.x < margin) { p.x = margin; p.vx = Math.abs(p.vx); }
            if (p.x > W - margin) { p.x = W - margin; p.vx = -Math.abs(p.vx); }
            if (p.y < minTopY) { p.y = minTopY; p.vy = Math.abs(p.vy); }
            if (p.y > H - 36) { p.y = H - 36; p.vy = -Math.abs(p.vy); }

            if (state.gathered && !isFocusedEgg && p.x > box.left && p.x < box.right && p.y > box.top && p.y < box.bottom) {
              var dLeft = p.x - box.left;
              var dRight = box.right - p.x;
              var dTop = p.y - box.top;
              var dBot = box.bottom - p.y;
              var minD = Math.min(dLeft, dRight, dTop, dBot);
              if (minD === dLeft) { p.x = box.left; p.vx = -Math.abs(p.vx); }
              else if (minD === dRight) { p.x = box.right; p.vx = Math.abs(p.vx); }
              else if (minD === dTop) { p.y = box.top; p.vy = -Math.abs(p.vy); }
              else { p.y = box.bottom; p.vy = Math.abs(p.vy); }
            }
          }

          var sprite = p.overrideSprite || pool[p.pose % pool.length] || fallbackSprites[0];
          if (!sprite) continue;

          var isActiveSec = state.gathered && state.heartShowTimer <= 0 && p.role === 'roamer' && p.slotIndex === curSec;
          if (isActiveSec) activeSecPig = p;

          var targetScale = p.scale;
          if (isActiveSec) {
            targetScale = Math.max(p.scale * 1.48, 0.34);
          }

          p.currentScale += (targetScale - p.currentScale) * Math.min(1, dt * 10);
          var drawScale = p.currentScale * (isFocusedEgg ? 1.45 : 1);
          var drawAlpha = (state.gathered && state.heartShowTimer <= 0) ? (isActiveSec ? 1 : p.baseAlpha) : 1;

          if (state.gathered && state.heartShowTimer <= 0 && p.role === 'colon') {
            drawScale *= colonPulseScale;
            drawAlpha = colonPulseAlpha;
          }

          var waveJump = 0;
          if (state.waveActive && state.gathered && state.heartShowTimer <= 0 && p.role === 'roamer' && p.slotIndex >= 0) {
            var maxC = state.waveContinuousEnd > 0 ? Math.ceil((waveElapsed + 2) / PASS_DUR) : state.waveCycles;
            for (var wc = 0; wc < maxC; wc++) {
              var localT = waveElapsed - wc * PASS_DUR - p.slotIndex * 0.022;
              if (localT >= 0 && localT <= 0.32) {
                waveJump = -Math.sin((localT / 0.32) * Math.PI) * 19;
                break;
              }
            }
          }

          var secPopOffset = 0;
          if (isActiveSec) {
            var secBounce = Math.sin(Math.min(1, (secFrac % 1) * 3.5) * Math.PI) * 4;
            secPopOffset = (p.slotIndex < 30 ? -1 : 1) * (5 + secBounce);
          }

          var jumpOffset = waveJump + secPopOffset;
          if (isFocusedEgg && p.eggAction === 0) {
            jumpOffset -= Math.abs(Math.sin(sec * 9 + p.id)) * 18;
          }

          var bobY = Math.sin(p.wigglePhase * 0.7) * (isFocusedEgg ? 4 : 1.7) + jumpOffset;
          var wiggleAngle = Math.sin(p.wigglePhase) * (isFocusedEgg ? 0.25 : 0.08);
          if (state.gathered && state.heartShowTimer > 0 && p.role === 'colon') {
            var sideTilt = p.colonIndex === 0 ? 1 : -1;
            wiggleAngle = Math.sin(sec * 7.5) * 0.24 * sideTilt;
          }

          ctx.save();
          ctx.globalAlpha = drawAlpha;

          if (state.gathered && state.heartShowTimer <= 0 && p.role === 'colon') {
            var ringRadius = Math.max(13, 96 * drawScale * 0.62);
            if (state.nightMode) {
              ctx.shadowColor = 'rgba(255, 240, 210, 0.85)';
              ctx.shadowBlur = 10;
            }
            drawHandDrawnCircle(ctx, p.x, p.y + bobY, ringRadius, state.nightMode);
            ctx.shadowBlur = 0;
          }

          ctx.translate(p.x, p.y + bobY);
          ctx.rotate(wiggleAngle);
          ctx.scale(p.flipX * p.clickFlip * drawScale, drawScale);

          if (sprite._isDarkBg) {
            ctx.fillStyle = 'rgba(20, 18, 22, 0.85)';
            drawRoundRect(ctx, -50, -50, 100, 100, 14);
            ctx.fill();
          }

          if (isActiveSec) {
            ctx.shadowColor = state.nightMode ? 'rgba(255, 224, 150, 0.95)' : 'rgba(244, 155, 110, 0.88)';
            ctx.shadowBlur = 13;
          } else if (state.nightMode) {
            ctx.shadowColor = 'rgba(255, 245, 225, 0.62)';
            ctx.shadowBlur = 9;
          }

          ctx.drawImage(sprite, -48, -48, 96, 96);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        if (state.gathered && state.heartShowTimer > 0) {
          var pulseMiniHeart = 10 + Math.sin(sec * 9) * 2.2;
          drawMiniHeart(
            ctx,
            state.heartCenter.x + Math.sin(sec * 5.2) * 5,
            state.heartCenter.y - state.heartScale * 1.6 + Math.cos(sec * 7.5) * 3,
            pulseMiniHeart,
            '#F26B83'
          );
        }

        // 在「目前秒數」那一隻小豬的上方（上排）或下方（下排）繪製瀨戶字體秒數氣泡標籤
        if (activeSecPig && state.gathered && state.heartShowTimer <= 0) {
          var isTopHalf = activeSecPig.slotIndex < 30;
          var pigHalfH = 48 * activeSecPig.currentScale;
          var labelOffset = pigHalfH + 12;
          var bx = Math.min(Math.max(activeSecPig.x, 22), W - 22);
          var by = isTopHalf ? (activeSecPig.y - labelOffset - 2) : (activeSecPig.y + labelOffset + 2);
          var secLabel = String(curSec).padStart(2, '0');

          ctx.save();
          ctx.font = '700 13px "SetoFontReal", "NaikaiSetoExt", "SetoFont", "LocalRoundFallback", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          var pillW = 26;
          var pillH = 18;
          ctx.fillStyle = state.nightMode ? 'rgba(34, 30, 28, 0.94)' : '#FFF9F0';
          ctx.strokeStyle = state.nightMode ? '#F5EDE4' : '#3B2318';
          ctx.lineWidth = 1.6;
          drawRoundRect(ctx, bx - pillW / 2, by - pillH / 2, pillW, pillH, 7);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = state.nightMode ? '#FFD89C' : '#3B2318';
          ctx.fillText(secLabel, bx, by + 0.5);
          ctx.restore();
        }

        for (var v = paradeVisitors.length - 1; v >= 0; v--) {
          var vis = paradeVisitors[v];
          if (vis.pauseTimer > 0) {
            vis.pauseTimer -= dt;
          } else {
            vis.x += vis.vx * dt;
            var midX = W * 0.5;
            if (!vis.hasPausedAtMid && ((vis.vx > 0 && vis.x >= midX - 20 && vis.x <= midX + 20) || (vis.vx < 0 && vis.x <= midX + 20 && vis.x >= midX - 20))) {
              vis.hasPausedAtMid = true;
              vis.pauseTimer = 1.1;
            }
          }

          vis.y = vis.baseY + Math.sin(sec * 4.2 + vis.phase) * 14;
          var vAng = Math.sin(sec * 6.5 + vis.phase) * 0.16;
          var vScale = vis.size / 96;

          ctx.save();
          ctx.translate(vis.x, vis.y);
          ctx.rotate(vAng);
          ctx.scale(vis.facing * vScale, vScale);
          if (vis.sprite._isDarkBg) {
            ctx.fillStyle = 'rgba(20, 18, 22, 0.85)';
            drawRoundRect(ctx, -50, -50, 100, 100, 14);
            ctx.fill();
          }
          ctx.drawImage(vis.sprite, -48, -48, 96, 96);
          ctx.restore();

          if (vis.x < -vis.size * 2.5 || vis.x > W + vis.size * 2.5) {
            paradeVisitors.splice(v, 1);
          }
        }
      }

      function resize() {
        var vw = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 320);
        var vh = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 480);
        if (currentSettings && currentSettings.forceLandscape) {
          W = Math.max(vh, 320);
          H = Math.max(vw, 320);
        } else {
          W = vw;
          H = vh;
        }
        DPR = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        for (var i = 0; i < pigs.length; i++) {
          pigs[i].x = Math.min(Math.max(pigs[i].x, 24), W - 24);
          pigs[i].y = Math.min(Math.max(pigs[i].y, 26), H - 36);
        }

        if (state.gathered && pigs.length > 0) {
          if (state.heartShowTimer > 0) {
            triggerHeartDuetShow();
          } else {
            computeClockTargets();
          }
        }
      }

      function processMultiImageUpload(files, onDone) {
        if (!files || !files.length) return;
        var loadedSprites = [];
        var loadedUrls = [];
        var pending = Math.min(files.length, 16);

        for (var i = 0; i < pending; i++) {
          (function (file) {
            var reader = new FileReader();
            reader.onload = function (ev) {
              var img = new Image();
              img.onload = function () {
                removeBackgroundAndTrim(img, 180, function (spr) {
                  if (spr) {
                    loadedSprites.push(spr);
                    try {
                      loadedUrls.push(spr.toDataURL('image/png'));
                    } catch (e) {}
                  }
                  pending--;
                  if (pending <= 0) onDone(loadedSprites, loadedUrls);
                });
              };
              img.onerror = function () {
                pending--;
                if (pending <= 0) onDone(loadedSprites, loadedUrls);
              };
              img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          })(files[i]);
        }
      }

          e.stopPropagation();
          var btn = this;
          if (!('wakeLock' in navigator) || !navigator.wakeLock) return;
          if (state.wakeLock) {
            try { state.wakeLock.release(); } catch (err) {}
            state.wakeLock = null;
            btn.textContent = '螢幕常亮';
            btn.classList.remove('primary');
          } else {
            navigator.wakeLock.request('screen').then(function (sentinel) {
              state.wakeLock = sentinel;
              btn.textContent = '螢幕常亮 (開啟中)';
              btn.classList.add('primary');
              sentinel.addEventListener('release', function () {
                state.wakeLock = null;
                btn.textContent = '螢幕常亮';
                btn.classList.remove('primary');
              });
            }).catch(function () {});
          }
        });

        document.getElementById('btnToggleNight').addEventListener('click', function (e) {
          e.stopPropagation();
          state.nightMode = !state.nightMode;
          document.body.classList.toggle('night', state.nightMode);
          this.textContent = state.nightMode ? '日間模式' : '夜間模式';
          var meta = document.getElementById('metaTheme');
          if (meta) meta.setAttribute('content', state.nightMode ? '#050505' : '#FDF6EC');
        });

        document.getElementById('btnOpenSettings').addEventListener('click', function (e) {
          e.stopPropagation();
          openTitleModal();
        });

        var bottomBarEl = document.getElementById('bottomBar');
        var btnShowBar = document.getElementById('btnShowBar');

        document.getElementById('btnHideBar').addEventListener('click', function (e) {
          e.stopPropagation();
          state.barHidden = true;
          bottomBarEl.classList.add('hidden');
          btnShowBar.classList.remove('hidden');
          if (state.gathered && state.heartShowTimer <= 0) computeClockTargets();
        });

        btnShowBar.addEventListener('click', function (e) {
          e.stopPropagation();
          state.barHidden = false;
          btnShowBar.classList.add('hidden');
          bottomBarEl.classList.remove('hidden');
          if (state.gathered && state.heartShowTimer <= 0) computeClockTargets();
        });

        document.getElementById('btnOrientAuto').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.forceLandscape = false;
          updateModalPreview();
        });

        document.getElementById('btnOrientForceLandscape').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.forceLandscape = true;
          updateModalPreview();
        });

        document.getElementById('btnSizeLarge').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.extraLarge = false;
          updateModalPreview();
        });

        document.getElementById('btnSizeExtraLarge').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.extraLarge = true;
          updateModalPreview();
        });

        var fileRoamerInput = document.getElementById('fileRoamerInput');
        document.getElementById('btnPickRoamerImgs').addEventListener('click', function () {
          fileRoamerInput.value = '';
          fileRoamerInput.click();
        });

        fileRoamerInput.addEventListener('change', function () {
          processMultiImageUpload(this.files, function (sprites, urls) {
            if (sprites.length > 0) {
              customRoamerSprites = sprites;
              customRoamerUrls = urls;
              usingCustomRoamer = true;
              refreshCustomSourceUI();
            }
          });
        });

        document.getElementById('btnResetRoamerImgs').addEventListener('click', function () {
          usingCustomRoamer = false;
          customRoamerSprites = [];
          customRoamerUrls = [];
          refreshCustomSourceUI();
        });

        var fileGuestInput = document.getElementById('fileGuestInput');
        document.getElementById('btnPickGuestImgs').addEventListener('click', function () {
          fileGuestInput.value = '';
          fileGuestInput.click();
        });

        fileGuestInput.addEventListener('change', function () {
          processMultiImageUpload(this.files, function (sprites, urls) {
            if (sprites.length > 0) {
              customGuestSprites = sprites;
              customGuestUrls = urls;
              usingCustomGuest = true;
              if (!state.gathered) applyWeirdoMix(true);
              refreshCustomSourceUI();
            }
          });
        });

        document.getElementById('btnResetGuestImgs').addEventListener('click', function () {
          usingCustomGuest = false;
          customGuestSprites = [];
          customGuestUrls = [];
          if (!state.gathered) applyWeirdoMix(true);
          refreshCustomSourceUI();
        });

        var modalEl = document.getElementById('titleModal');
        var modalBoxEl = modalEl.querySelector('.modal-box');
        modalBoxEl.addEventListener('click', function (e) {
          e.stopPropagation();
        });

        document.getElementById('btnCloseModal').addEventListener('click', closeTitleModal);
        document.getElementById('btnCancelModal').addEventListener('click', closeTitleModal);
        modalEl.addEventListener('click', function (e) {
          if (e.target === modalEl) closeTitleModal();
        });

        document.getElementById('btnTitleVisibleOn').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.visible = true;
          updateModalPreview();
        });

        document.getElementById('btnTitleVisibleOff').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.visible = false;
          updateModalPreview();
        });

        document.getElementById('btnDateVisibleOn').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.showDateBadge = true;
          updateModalPreview();
        });

        document.getElementById('btnDateVisibleOff').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.showDateBadge = false;
          updateModalPreview();
        });

        document.getElementById('inputTitle').addEventListener('input', function () {
          if (!draftSettings) return;
          draftSettings.text = this.value;
          updateModalPreview();
        });

        document.getElementById('btnClearTitle').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.text = '';
          document.getElementById('inputTitle').value = '';
          updateModalPreview();
        });

        var presetTitles = document.querySelectorAll('.preset-title');
        for (var i = 0; i < presetTitles.length; i++) {
          presetTitles[i].addEventListener('click', function () {
            if (!draftSettings) return;
            var val = this.getAttribute('data-val') || '';
            draftSettings.text = val;
            document.getElementById('inputTitle').value = val;
            updateModalPreview();
          });
        }

        var sizeBtns = document.querySelectorAll('.size-btn');
        for (var sb = 0; sb < sizeBtns.length; sb++) {
          sizeBtns[sb].addEventListener('click', function () {
            if (!draftSettings) return;
            var sz = parseInt(this.getAttribute('data-size'), 10);
            draftSettings.fontSize = Math.min(44, Math.max(16, isNaN(sz) ? 26 : sz));
            updateModalPreview();
          });
        }

        document.getElementById('inputFontSize').addEventListener('input', function () {
          if (!draftSettings) return;
          var sz = parseInt(this.value, 10);
          draftSettings.fontSize = Math.min(44, Math.max(16, isNaN(sz) ? 26 : sz));
          updateModalPreview();
        });

        document.getElementById('btnNoIcon').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.iconType = 'none';
          draftSettings.iconImage = '';
          document.getElementById('inputCustomIcon').value = '';
          updateModalPreview();
        });

        document.getElementById('titleStickerGrid').addEventListener('click', function (e) {
          var target = e.target;
          while (target && target !== this && !target.classList.contains('sticker-item')) {
            target = target.parentNode;
          }
          if (!target || !target.classList.contains('sticker-item') || !draftSettings) return;
          var rawIdx = parseInt(target.getAttribute('data-preset-idx'), 10);
          var idx = isNaN(rawIdx) ? 0 : rawIdx;
          draftSettings.iconType = 'preset';
          draftSettings.presetIndex = idx;
          draftSettings.iconImage = originalCutoutDataURLs[idx] || encodeURI(PIG_FILE_PATHS[idx]);
          document.getElementById('inputCustomIcon').value = '';
          updateModalPreview();
        });

        document.getElementById('inputCustomIcon').addEventListener('input', function () {
          if (!draftSettings) return;
          var val = this.value.trim();
          if (!val) {
            draftSettings.iconType = 'preset';
            draftSettings.iconImage = originalCutoutDataURLs[draftSettings.presetIndex] || encodeURI(PIG_FILE_PATHS[draftSettings.presetIndex]);
          } else {
            draftSettings.iconType = 'emoji';
            draftSettings.iconEmoji = val;
            draftSettings.iconImage = '';
          }
          updateModalPreview();
        });

        var fileIconInput = document.getElementById('fileIconInput');
        document.getElementById('btnTriggerIconUpload').addEventListener('click', function () {
          fileIconInput.value = '';
          fileIconInput.click();
        });

        fileIconInput.addEventListener('change', function () {
          var file = this.files && this.files[0];
          if (!file || !draftSettings) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              removeBackgroundAndTrim(img, 96, function (spr) {
                if (spr && draftSettings) {
                  draftSettings.iconType = 'image';
                  draftSettings.iconImage = spr.toDataURL('image/png');
                  updateModalPreview();
                }
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('btnClearTitleIconImg').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.iconType = 'preset';
          draftSettings.presetIndex = 0;
          draftSettings.iconImage = originalCutoutDataURLs[0] || encodeURI(PIG_FILE_PATHS[0]);
          document.getElementById('inputCustomIcon').value = '';
          updateModalPreview();
        });

        document.getElementById('hideIconGroup').addEventListener('click', function (e) {
          var target = e.target;
          while (target && target !== this && !target.classList.contains('hide-icon-opt')) {
            target = target.parentNode;
          }
          if (!target || !target.classList.contains('hide-icon-opt') || !draftSettings) return;
          var rawIdx = parseInt(target.getAttribute('data-preset-idx'), 10);
          var idx = isNaN(rawIdx) ? 6 : rawIdx;
          draftSettings.hideBtnIconType = 'preset';
          draftSettings.hideBtnPresetIndex = idx;
          draftSettings.hideBtnImageData = originalCutoutDataURLs[idx] || encodeURI(PIG_FILE_PATHS[idx]);
          var inp = document.getElementById('inputHideBtnIcon');
          if (inp) inp.value = '';
          updateModalPreview();
        });

        document.getElementById('inputHideBtnIcon').addEventListener('input', function () {
          if (!draftSettings) return;
          var val = this.value.trim();
          if (!val) {
            draftSettings.hideBtnIconType = 'preset';
            draftSettings.hideBtnImageData = originalCutoutDataURLs[draftSettings.hideBtnPresetIndex] || encodeURI(PIG_FILE_PATHS[draftSettings.hideBtnPresetIndex]);
          } else {
            draftSettings.hideBtnIconType = 'emoji';
            draftSettings.hideBtnIcon = val;
          }
          updateModalPreview();
        });

        var fileHideIconInput = document.getElementById('fileHideIconInput');
        document.getElementById('btnUploadHideIcon').addEventListener('click', function () {
          fileHideIconInput.value = '';
          fileHideIconInput.click();
        });

        fileHideIconInput.addEventListener('change', function () {
          var file = this.files && this.files[0];
          if (!file || !draftSettings) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              removeBackgroundAndTrim(img, 64, function (spr) {
                if (spr && draftSettings) {
                  draftSettings.hideBtnIconType = 'image';
                  draftSettings.hideBtnImageData = spr.toDataURL('image/png');
                  updateModalPreview();
                }
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('btnClearHideIconImg').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.hideBtnIconType = 'preset';
          draftSettings.hideBtnPresetIndex = 6;
          draftSettings.hideBtnImageData = originalCutoutDataURLs[6] || encodeURI(PIG_FILE_PATHS[6]);
          updateModalPreview();
        });

        document.getElementById('showIconGroup').addEventListener('click', function (e) {
          var target = e.target;
          while (target && target !== this && !target.classList.contains('show-icon-opt')) {
            target = target.parentNode;
          }
          if (!target || !target.classList.contains('show-icon-opt') || !draftSettings) return;
          var rawIdx = parseInt(target.getAttribute('data-preset-idx'), 10);
          var idx = isNaN(rawIdx) ? 4 : rawIdx;
          draftSettings.showBtnIconType = 'preset';
          draftSettings.showBtnPresetIndex = idx;
          draftSettings.showBtnImageData = originalCutoutDataURLs[idx] || encodeURI(PIG_FILE_PATHS[idx]);
          var inp = document.getElementById('inputShowBtnIcon');
          if (inp) inp.value = '';
          updateModalPreview();
        });

        document.getElementById('inputShowBtnIcon').addEventListener('input', function () {
          if (!draftSettings) return;
          var val = this.value.trim();
          if (!val) {
            draftSettings.showBtnIconType = 'preset';
            draftSettings.showBtnImageData = originalCutoutDataURLs[draftSettings.showBtnPresetIndex] || encodeURI(PIG_FILE_PATHS[draftSettings.showBtnPresetIndex]);
          } else {
            draftSettings.showBtnIconType = 'emoji';
            draftSettings.showBtnIcon = val;
          }
          updateModalPreview();
        });

        var fileShowIconInput = document.getElementById('fileShowIconInput');
        document.getElementById('btnUploadShowIcon').addEventListener('click', function () {
          fileShowIconInput.value = '';
          fileShowIconInput.click();
        });

        fileShowIconInput.addEventListener('change', function () {
          var file = this.files && this.files[0];
          if (!file || !draftSettings) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              removeBackgroundAndTrim(img, 64, function (spr) {
                if (spr && draftSettings) {
                  draftSettings.showBtnIconType = 'image';
                  draftSettings.showBtnImageData = spr.toDataURL('image/png');
                  updateModalPreview();
                }
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('btnClearShowIconImg').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.showBtnIconType = 'preset';
          draftSettings.showBtnPresetIndex = 4;
          draftSettings.showBtnImageData = originalCutoutDataURLs[4] || encodeURI(PIG_FILE_PATHS[4]);
          updateModalPreview();
        });

        document.getElementById('btnResetDefaults').addEventListener('click', function () {
          draftSettings = getDefaultSettings();
          document.getElementById('inputTitle').value = draftSettings.text;
          document.getElementById('inputCustomIcon').value = '';
          var hInp = document.getElementById('inputHideBtnIcon');
          var sInp = document.getElementById('inputShowBtnIcon');
          if (hInp) hInp.value = '';
          if (sInp) sInp.value = '';
          updateModalPreview();
        });

        document.getElementById('btnApplyModal').addEventListener('click', function () {
          if (draftSettings) {
            if ((draftSettings.iconType === 'image' || draftSettings.iconType === 'preset') && !draftSettings.iconImage) {
              draftSettings.iconType = 'preset';
              draftSettings.presetIndex = 0;
              draftSettings.iconImage = originalCutoutDataURLs[0] || encodeURI(PIG_FILE_PATHS[0]);
            }
            if ((draftSettings.hideBtnIconType === 'image' || draftSettings.hideBtnIconType === 'preset') && !draftSettings.hideBtnImageData) {
              draftSettings.hideBtnIconType = 'preset';
              draftSettings.hideBtnPresetIndex = 6;
              draftSettings.hideBtnImageData = originalCutoutDataURLs[6] || encodeURI(PIG_FILE_PATHS[6]);
            }
            if ((draftSettings.showBtnIconType === 'image' || draftSettings.showBtnIconType === 'preset') && !draftSettings.showBtnImageData) {
              draftSettings.showBtnIconType = 'preset';
              draftSettings.showBtnPresetIndex = 4;
              draftSettings.showBtnImageData = originalCutoutDataURLs[4] || encodeURI(PIG_FILE_PATHS[4]);
            }
            currentSettings = cloneSettings(draftSettings);
            saveSettings();
            applySettingsToScreen();
          }
          closeTitleModal();
        });

        window.addEventListener('resize', resize);
        if (typeof ResizeObserver !== 'undefined') {
          try {
            var ro = new ResizeObserver(resize);
            ro.observe(document.body);
          } catch (e) {}
        }
      }

      function bootstrap() {
        loadSettings();
        populatePresetPickers();
        applySettingsToScreen();
        buildFallbackSprites();
        initPigs();
        bindUI();
        resize();
        setGathered(true, true);
        requestAnimationFrame(animate);
        loadOriginalPigIcons();
        loadClockAndEasterAssets();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
