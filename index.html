<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FDF6EC" id="metaTheme" />
  <title>不理不理左衛門時鐘</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #FDF6EC;
      --ink: #3B2318;
      --pill-bg: #FFFAF3;
      --pill-border: #3B2318;
      --modal-bg: #FDF6EC;
      --card-bg: #FFFFFF;
      --accent: #F4B89C;
      --font-round: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Hiragino Maru Gothic ProN", sans-serif;
    }

    body.night {
      --bg: #050505;
      --ink: #F5EDE4;
      --pill-bg: rgba(28, 28, 32, 0.92);
      --pill-border: rgba(245, 237, 228, 0.72);
      --modal-bg: #18181B;
      --card-bg: #242429;
      --accent: #D98A6C;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-round);
      transition: background-color 0.25s ease, color 0.25s ease;
      touch-action: manipulation;
    }

    #clockCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* 頂部可自訂標題列 */
    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 12px;
      pointer-events: none;
    }

    #titleTrigger {
      pointer-events: auto;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 95vw;
      padding: 6px 14px;
      border: 1.8px solid var(--pill-border);
      border-radius: 16px;
      background: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-size: 26px;
      font-weight: 900;
      line-height: 1.2;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--pill-border);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    #titleTrigger:active {
      transform: scale(0.96);
    }

    #titleIcon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #titleIconImg {
      display: inline-block;
      width: 32px;
      height: 32px;
      object-fit: contain;
      vertical-align: middle;
    }

    .ctrl-btn-icon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ctrl-btn-img {
      display: inline-block;
      width: 21px;
      height: 21px;
      object-fit: contain;
      vertical-align: middle;
    }

    .edit-badge {
      font-size: 0.6em;
      opacity: 0.6;
      margin-left: 2px;
    }

    /* 底部控制工具列 */
    #bottomBar {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
      pointer-events: none;
    }

    .toolbar-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      max-width: 98vw;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      border: 1.8px solid var(--pill-border);
      border-radius: 12px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-size: 14.5px;
      line-height: 1.2;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--pill-border);
      white-space: nowrap;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .pill-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .pill-btn.primary {
      background-color: var(--accent);
      color: #2B1810;
    }

    .hint-line {
      margin-top: 6px;
      font-family: var(--font-round);
      font-size: 13px;
      font-weight: 800;
      opacity: 0.78;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* 隱藏選項後的右下角恢復按鈕 */
    #btnShowBar {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      border: 1.8px solid var(--pill-border);
      border-radius: 12px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-size: 14px;
      line-height: 1.2;
      font-weight: 900;
      opacity: 0.9;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    #btnShowBar:active {
      opacity: 1;
      transform: scale(0.96);
    }

    /* 輕量提示氣泡 */
    #toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      padding: 6px 14px;
      border-radius: 12px;
      background: rgba(35, 24, 18, 0.92);
      color: #FFFDF9;
      font-family: var(--font-round);
      font-size: 13px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 標題與圖示設定彈窗 */
    #titleModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.54);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #titleModal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 440px;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background-color: var(--modal-bg);
      color: var(--ink);
      border: 2px solid var(--pill-border);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 17px;
      font-weight: 900;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      border: 1.5px solid var(--pill-border);
      background: var(--card-bg);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }

    .preview-panel {
      background: var(--card-bg);
      border: 1.5px dashed rgba(128, 128, 128, 0.42);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .preview-tag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.62;
      margin-bottom: 4px;
    }

    #modalPreview {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-round);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      min-height: 36px;
    }

    #previewImg {
      display: inline-block;
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    .preview-btns-bar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(128, 128, 128, 0.28);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 800;
    }

    .preview-mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 10px;
      border: 1px solid rgba(128, 128, 128, 0.35);
    }

    .preview-mini-img {
      display: inline-block;
      width: 19px;
      height: 19px;
      object-fit: contain;
    }

    .field-group {
      margin-bottom: 13px;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.18);
    }

    .field-group:last-of-type {
      border-bottom: none;
      margin-bottom: 6px;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .seg-btn {
      padding: 8px 10px;
      border: 1.6px solid var(--pill-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .text-box {
      width: 100%;
      padding: 8px 12px;
      border: 1.6px solid var(--pill-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      padding: 5px 10px;
      border: 1.4px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #2B1810;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .size-btn {
      padding: 6px 2px;
      border: 1.4px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #D97757;
    }

    /* 16 款預選小豬頭像網格 */
    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .sticker-item {
      aspect-ratio: 1;
      border: 1.5px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      background: #FFFDF9;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 3px;
      touch-action: manipulation;
    }

    .sticker-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .sticker-item.active {
      border-color: var(--pill-border);
      background: var(--accent);
      box-shadow: 0 1px 0 var(--pill-border);
    }

    .icon-pick-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .mini-icon-btn {
      width: 38px;
      height: 38px;
      border: 1.5px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      background: #FFFDF9;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 3px;
    }

    .mini-icon-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .mini-icon-btn.active {
      border-color: var(--pill-border);
      background: var(--accent);
      box-shadow: 0 1px 0 var(--pill-border);
    }

    .mini-icon-input {
      width: 68px;
      padding: 6px 8px;
      border: 1.5px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .btn-icon-upload-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1.2px dashed rgba(128, 128, 128, 0.35);
      font-size: 12px;
      font-weight: 700;
    }

    .btn-icon-upload-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .btn-icon-thumb {
      display: none;
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 5px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      background: #FFFFFF;
    }

    .btn-icon-actions {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <!-- 主互動小豬時鐘畫布 -->
  <canvas id="clockCanvas"></canvas>

  <!-- 頂部可自訂標題列 -->
  <header id="topBar">
    <button id="titleTrigger" type="button" title="點擊修改標題、顯示狀態與後方小圖示">
      <span id="titleText">不理不理左衛門時鐘</span>
      <span id="titleIcon">🐷</span>
      <img id="titleIconImg" alt="標題小圖示" />
      <span class="edit-badge">✎</span>
    </button>
  </header>

  <!-- 輕量操作提示氣泡 -->
  <div id="toast"></div>

  <!-- 底部控制工具列 -->
  <footer id="bottomBar">
    <div class="toolbar-row">
      <button id="btnToggleGather" type="button" class="pill-btn">散開 / 集合</button>
      <button id="btnToggleSize" type="button" class="pill-btn">時間：特大</button>
      <button id="btnToggleNight" type="button" class="pill-btn">夜間模式</button>
      <button id="btnWakeLock" type="button" class="pill-btn">螢幕常亮</button>
      <button id="btnCustomSticker" type="button" class="pill-btn">自訂小豬貼圖</button>
      <button id="btnResetSticker" type="button" class="pill-btn hidden">恢復預設小豬</button>
      <button id="btnOpenSettings" type="button" class="pill-btn">✎ 標題與圖示</button>
      <button id="btnHideBar" type="button" class="pill-btn">
        <span id="hideBtnIcon" class="ctrl-btn-icon">🙈</span>
        <img id="hideBtnImg" class="ctrl-btn-img" alt="隱藏選項圖示" />
        <span>隱藏選項</span>
      </button>
    </div>
    <div class="hint-line">點擊螢幕即可讓小豬散開或集合報時！</div>
    <input id="fileStickerInput" type="file" accept="image/*" multiple class="hidden" />
  </footer>

  <!-- 隱藏選項後的右下角恢復按鈕 -->
  <button id="btnShowBar" type="button" class="hidden" title="顯示底部控制列">
    <span id="showBtnIcon" class="ctrl-btn-icon">👁️</span>
    <img id="showBtnImg" class="ctrl-btn-img" alt="顯示選項圖示" />
    <span>顯示選項</span>
  </button>

  <!-- 標題與圖示自訂設定彈窗 -->
  <div id="titleModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>✎ 標題與按鈕圖示設定</h2>
        <button id="btnCloseModal" type="button" class="close-btn">✕</button>
      </div>

      <!-- 即時預覽區 -->
      <div class="preview-panel">
        <span class="preview-tag">頂部標題與按鈕即時預覽</span>
        <div id="modalPreview">
          <span id="previewText">不理不理左衛門時鐘</span>
          <span id="previewIcon">🐷</span>
          <img id="previewImg" alt="預覽圖示" />
        </div>
        <div class="preview-btns-bar">
          <span class="preview-mini-pill">
            <span id="prevHideEmoji">🙈</span>
            <img id="prevHideImg" class="preview-mini-img" alt="" />
            <span>隱藏選項</span>
          </span>
          <span class="preview-mini-pill">
            <span id="prevShowEmoji">👁️</span>
            <img id="prevShowImg" class="preview-mini-img" alt="" />
            <span>顯示選項</span>
          </span>
        </div>
      </div>

      <!-- 1. 頂部標題顯示狀態 -->
      <div class="field-group">
        <div class="field-label-row">
          <span>1. 頂部標題顯示狀態</span>
        </div>
        <div class="segmented-row">
          <button type="button" id="btnTitleVisibleOn" class="seg-btn active">顯示標題</button>
          <button type="button" id="btnTitleVisibleOff" class="seg-btn">隱藏標題</button>
        </div>
      </div>

      <!-- 2. 標題文字內容 -->
      <div class="field-group">
        <div class="field-label-row">
          <label for="inputTitle">2. 標題文字內容</label>
          <button id="btnClearTitle" type="button" class="chip">清空文字</button>
        </div>
        <input id="inputTitle" type="text" maxlength="24" class="text-box" placeholder="輸入標題文字（可留空只顯示圖示）" />
        <div class="chip-wrap">
          <button type="button" class="chip preset-title" data-val="不理不理左衛門時鐘">不理不理左衛門時鐘</button>
          <button type="button" class="chip preset-title" data-val="豬豬時鐘">豬豬時鐘</button>
          <button type="button" class="chip preset-title" data-val="午休時間">午休時間</button>
          <button type="button" class="chip preset-title" data-val="起床囉！">起床囉！</button>
        </div>
      </div>

      <!-- 3. 標題字型大小 -->
      <div class="field-group">
        <div class="field-label-row">
          <label for="inputFontSize">3. 標題字型大小</label>
          <span id="fontSizeBadge" class="chip">26px</span>
        </div>
        <div class="size-row">
          <button type="button" class="size-btn" data-size="18">小 18px</button>
          <button type="button" class="size-btn" data-size="22">適中 22px</button>
          <button type="button" class="size-btn" data-size="26">標準 26px</button>
          <button type="button" class="size-btn" data-size="32">大 32px</button>
          <button type="button" class="size-btn" data-size="40">特大 40px</button>
        </div>
        <div class="slider-row">
          <span style="font-size:12px;font-weight:900;opacity:0.65;">A</span>
          <input id="inputFontSize" type="range" min="16" max="44" step="1" value="26" />
          <span style="font-size:18px;font-weight:900;">A</span>
        </div>
      </div>

      <!-- 4. 標題後方小圖示（16款不理不理左衛門預選頭像） -->
      <div class="field-group">
        <div class="field-label-row">
          <span>4. 標題後方小圖示（點選預選頭像）</span>
          <button id="btnNoIcon" type="button" class="chip">無圖示 (隱藏)</button>
        </div>
        <div class="sticker-grid" id="titleStickerGrid"></div>
        <input id="inputCustomIcon" type="text" maxlength="8" class="text-box" placeholder="或直接輸入任何文字 / Emoji 符號..." />
        <div class="btn-icon-upload-bar">
          <div class="btn-icon-upload-left">
            <img id="titleIconThumb" class="btn-icon-thumb" alt="標題小圖示縮圖" />
            <span id="titleIconImgStatus">也可從手機相簿選擇小圖片（自動去背）</span>
          </div>
          <div class="btn-icon-actions">
            <button id="btnTriggerIconUpload" type="button" class="chip">📁 上傳圖片</button>
            <button id="btnClearTitleIconImg" type="button" class="chip hidden">改回預設</button>
            <input id="fileIconInput" type="file" accept="image/*" class="hidden" />
          </div>
        </div>
      </div>

  <script>
    (function () {
      'use strict';

      var CANVAS_FONT = 'sans-serif';

      // =========================================================================
      // 1. 安全儲存存取與輔助繪圖
      // =========================================================================
      var memStore = {};
      function safeGet(key, fallback) {
        try {
          var v = window.localStorage.getItem(key);
          if (v !== null) return v;
        } catch (e) {}
        return Object.prototype.hasOwnProperty.call(memStore, key) ? memStore[key] : fallback;
      }

      function safeSet(key, val) {
        memStore[key] = val;
        try {
          window.localStorage.setItem(key, val);
        } catch (e) {}
      }

      function drawRoundRect(c, x, y, w, h, r) {
        var radius = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + radius, y);
        c.arcTo(x + w, y, x + w, y + h, radius);
        c.arcTo(x + w, y + h, x, y + h, radius);
        c.arcTo(x, y + h, x, y, radius);
        c.arcTo(x, y, x + w, y, radius);
        c.closePath();
      }

      // =========================================================================
      // 2. 預先產生 16 款不理不理左衛門預選頭像與符號（去背 PNG DataURL）
      // =========================================================================
      var PRESET_ICONS = [];
      var PRESET_NAMES = [
        '呆萌臉', '張嘴笑', '愛心眼', '閉眼大喊',
        '水汪汪', '抱大愛心', '睡帽打盹', '愛心眨眼',
        '吐舌頭', '推眼鏡', '頭頂閃亮', '墨鏡白帽',
        '毛帽圍巾', '小豬太陽', '粉紅音符', '蝴蝶結褲'
      ];
      // 隱藏選項預選索引：6(睡帽打盹), 3(閉眼大喊), 8(吐舌頭), 11(墨鏡白帽), 13(小豬太陽), 15(蝴蝶結褲)
      var HIDE_PRESET_INDICES = [6, 3, 8, 11, 13, 15];
      // 顯示選項預選索引：4(水汪汪), 10(頭頂閃亮), 9(推眼鏡), 0(呆萌臉), 5(抱大愛心), 14(粉紅音符)
      var SHOW_PRESET_INDICES = [4, 10, 9, 0, 5, 14];

      function drawFaceBase(c, cx, cy, scale, opts) {
        opts = opts || {};
        c.save();
        c.translate(cx, cy);
        c.scale(scale, scale);

        var skin = opts.skin || '#F6C198';
        var snout = opts.snout || '#F17A7E';
        var ink = '#331A12';

        c.lineCap = 'round';
        c.lineJoin = 'round';

        if (!opts.noEars) {
          c.fillStyle = ink;
          c.beginPath();
          c.moveTo(-18, -14);
          c.quadraticCurveTo(-30, -24, -33, -13);
          c.quadraticCurveTo(-29, -8, -21, -9);
          c.closePath();
          c.fill();

          c.beginPath();
          c.moveTo(18, -14);
          c.quadraticCurveTo(30, -24, 33, -13);
          c.quadraticCurveTo(29, -8, 21, -9);
          c.closePath();
          c.fill();
        }

        // 臉輪廓
        c.fillStyle = skin;
        c.strokeStyle = ink;
        c.lineWidth = 3.2;
        c.beginPath();
        c.ellipse(0, 2, 26, 22, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // 腮紅
        if (opts.blush) {
          c.fillStyle = 'rgba(244, 114, 128, 0.48)';
          c.beginPath();
          c.ellipse(-16, 7, 5.5, 3.2, 0, 0, Math.PI * 2);
          c.ellipse(16, 7, 5.5, 3.2, 0, 0, Math.PI * 2);
          c.fill();
          if (opts.blushLines) {
            c.strokeStyle = '#EF6C75';
            c.lineWidth = 1.5;
            c.beginPath();
            c.moveTo(-19, 6); c.lineTo(-16, 9);
            c.moveTo(-15, 6); c.lineTo(-12, 9);
            c.moveTo(12, 6); c.lineTo(15, 9);
            c.moveTo(16, 6); c.lineTo(19, 9);
            c.stroke();
          }
        }

        // 眼睛
        var eyeMode = opts.eyes || 'round';
        if (eyeMode === 'round') {
          c.fillStyle = '#FFFFFF';
          c.strokeStyle = ink;
          c.lineWidth = 2.2;
          c.beginPath();
          c.arc(-14, -2, 5.5, 0, Math.PI * 2);
          c.arc(14, -2, 5.5, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = ink;
          c.beginPath();
          c.arc(-14, -2, 3.6, 0, Math.PI * 2);
          c.arc(14, -2, 3.6, 0, Math.PI * 2);
          c.fill();
        } else if (eyeMode === 'sparkle') {
          c.fillStyle = '#FFFFFF';
          c.strokeStyle = ink;
          c.lineWidth = 2.2;
          c.beginPath();
          c.arc(-14, -2, 6, 0, Math.PI * 2);
          c.arc(14, -2, 6, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = ink;
          c.beginPath();
          c.arc(-14, -2, 4.1, 0, Math.PI * 2);
          c.arc(14, -2, 4.1, 0, Math.PI * 2);
          c.fill();

          c.fillStyle = '#FFFFFF';
          c.beginPath();
          c.arc(-15.5, -3.6, 1.7, 0, Math.PI * 2);
          c.arc(-12.5, -0.8, 0.9, 0, Math.PI * 2);
          c.arc(12.5, -3.6, 1.7, 0, Math.PI * 2);
          c.arc(15.5, -0.8, 0.9, 0, Math.PI * 2);
          c.fill();
        } else if (eyeMode === 'heart') {
          c.fillStyle = '#DC2626';
          var hxList = [-14, 14];
          for (var hi = 0; hi < hxList.length; hi++) {
            var hx = hxList[hi];
            c.beginPath();
            c.moveTo(hx, 3.5);
            c.bezierCurveTo(hx - 8, -2, hx - 7, -9, hx, -5);
            c.bezierCurveTo(hx + 7, -9, hx + 8, -2, hx, 3.5);
            c.fill();
          }
        } else if (eyeMode === 'squeeze') {
          c.strokeStyle = ink;
          c.lineWidth = 2.8;
          c.beginPath();
          c.moveTo(-18, -5); c.lineTo(-12, -2); c.lineTo(-18, 1);
          c.moveTo(18, -5); c.lineTo(12, -2); c.lineTo(18, 1);
          c.moveTo(-12, -10); c.lineTo(-8, -7);
          c.stroke();
        } else if (eyeMode === 'sleep') {
          c.strokeStyle = ink;
          c.lineWidth = 2.8;
          c.beginPath();
          c.moveTo(-18, -2); c.quadraticCurveTo(-14, 0, -10, -2);
          c.moveTo(10, -2); c.quadraticCurveTo(14, 0, 18, -2);
          c.stroke();
        } else if (eyeMode === 'winkLeft') {
          c.fillStyle = '#FFFFFF';
          c.strokeStyle = ink;
          c.lineWidth = 2.2;
          c.beginPath();
          c.arc(-14, -2, 5.5, 0, Math.PI * 2);
          c.fill();
          c.stroke();
          c.fillStyle = ink;
          c.beginPath();
          c.arc(-14, -2, 3.6, 0, Math.PI * 2);
          c.fill();

          c.strokeStyle = ink;
          c.lineWidth = 2.8;
          c.beginPath();
          c.moveTo(17, -5); c.lineTo(11, -2); c.lineTo(17, 1);
          c.stroke();
        } else if (eyeMode === 'winkBoth') {
          c.strokeStyle = ink;
          c.lineWidth = 2.8;
          c.beginPath();
          c.moveTo(-17, -5); c.lineTo(-11, -2); c.lineTo(-17, 1);
          c.moveTo(17, -5); c.lineTo(11, -2); c.lineTo(17, 1);
          c.stroke();
        }

        // 豬鼻子
        c.fillStyle = snout;
        c.strokeStyle = ink;
        c.lineWidth = 2.6;
        c.beginPath();
        c.moveTo(-9, 1);
        c.bezierCurveTo(-13, 1, -14, 10, -7, 10);
        c.quadraticCurveTo(0, 8, 7, 10);
        c.bezierCurveTo(14, 10, 13, 1, 9, 1);
        c.quadraticCurveTo(0, -2, -9, 1);
        c.closePath();
        c.fill();
        c.stroke();

        // 鼻孔
        c.fillStyle = ink;
        c.beginPath();
        c.arc(-4.2, 5.2, 1.8, 0, Math.PI * 2);
        c.arc(4.2, 5.2, 1.8, 0, Math.PI * 2);
        c.fill();

        // 嘴巴
        var mouth = opts.mouth || 'none';
        if (mouth === 'open') {
          c.fillStyle = ink;
          c.beginPath();
          c.moveTo(-3.5, 10);
          c.quadraticCurveTo(0, 20, 3.5, 10);
          c.closePath();
          c.fill();
        } else if (mouth === 'smallOpen') {
          c.fillStyle = ink;
          c.beginPath();
          c.moveTo(-2.5, 10);
          c.quadraticCurveTo(0, 16, 2.5, 10);
          c.closePath();
          c.fill();
        } else if (mouth === 'shout') {
          c.fillStyle = ink;
          c.beginPath();
          c.moveTo(-3, 10);
          c.lineTo(-1.5, 25);
          c.lineTo(1.5, 25);
          c.lineTo(3, 10);
          c.closePath();
          c.fill();
        } else if (mouth === 'tongue') {
          c.fillStyle = '#F47280';
          c.strokeStyle = ink;
          c.lineWidth = 2;
          c.beginPath();
          c.arc(4.5, 12.5, 3.4, 0, Math.PI);
          c.fill();
          c.stroke();
        }

        c.restore();
      }

      function createPresetIconDataURL(idx) {
        var off = document.createElement('canvas');
        off.width = 96;
        off.height = 96;
        var c = off.getContext('2d');
        var ink = '#331A12';

        if (idx === 0) {
          // 1. 基本呆萌臉
          drawFaceBase(c, 48, 50, 1.25, { eyes: 'round', mouth: 'none' });
        } else if (idx === 1) {
          // 2. 張嘴開心臉
          drawFaceBase(c, 48, 50, 1.25, { eyes: 'round', mouth: 'open' });
        } else if (idx === 2) {
          // 3. 愛心眼臉
          drawFaceBase(c, 48, 50, 1.25, { eyes: 'heart', mouth: 'open', blush: true, blushLines: true });
        } else if (idx === 3) {
          // 4. 閉眼大喊臉
          drawFaceBase(c, 48, 48, 1.22, { eyes: 'squeeze', mouth: 'shout', blush: true, blushLines: true });
        } else if (idx === 4) {
          // 5. 水汪汪大眼臉
          drawFaceBase(c, 48, 50, 1.25, { eyes: 'sparkle', mouth: 'smallOpen', blush: true });
        } else if (idx === 5) {
          // 6. 抱大愛心小豬
          drawFaceBase(c, 48, 37, 0.96, { eyes: 'sparkle', mouth: 'open', blush: true });
          c.fillStyle = '#F47280';
          c.strokeStyle = '#E15B69';
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(48, 86);
          c.bezierCurveTo(10, 66, 12, 42, 48, 55);
          c.bezierCurveTo(84, 42, 86, 66, 48, 86);
          c.fill();
          c.stroke();
          // 雙手扶在愛心上
          c.fillStyle = '#F6C198';
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(32, 50, 7, 4, 0.3, 0, Math.PI * 2);
          c.ellipse(64, 50, 7, 4, -0.3, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        } else if (idx === 6) {
          // 7. 戴紫睡帽打瞌睡
          drawFaceBase(c, 50, 56, 1.15, { eyes: 'sleep', mouth: 'none' });
          // 睡帽
          c.fillStyle = '#A78BFA';
          c.strokeStyle = ink;
          c.lineWidth = 2.8;
          c.beginPath();
          c.moveTo(24, 38);
          c.quadraticCurveTo(44, 10, 72, 32);
          c.lineTo(68, 40);
          c.closePath();
          c.fill();
          c.stroke();
          // 白帽沿與球球
          c.fillStyle = '#FFFFFF';
          drawRoundRect(c, 22, 33, 50, 8, 4);
          c.fill();
          c.stroke();
          c.beginPath();
          c.arc(17, 47, 7, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        } else if (idx === 7) {
          // 8. 愛心眨眼豬
          c.save();
          c.translate(52, 52);
          c.rotate(-0.18);
          drawFaceBase(c, 0, 0, 1.05, { eyes: 'winkLeft', mouth: 'open', blush: true });
          c.restore();
          // 左上小愛心
          c.fillStyle = '#F46A6E';
          c.beginPath();
          c.moveTo(22, 30);
          c.bezierCurveTo(10, 20, 12, 10, 22, 16);
          c.bezierCurveTo(32, 10, 34, 20, 22, 30);
          c.fill();
        } else if (idx === 8) {
          // 9. 吐舌頭裝傻豬
          drawFaceBase(c, 54, 54, 1.1, { eyes: 'winkBoth', mouth: 'tongue' });
          // 粉紅星星
          c.fillStyle = '#EC4899';
          c.beginPath();
          for (var st = 0; st < 5; st++) {
            var a1 = (st * 72 - 90) * Math.PI / 180;
            var a2 = (st * 72 - 54) * Math.PI / 180;
            var rx1 = 22 + Math.cos(a1) * 9;
            var ry1 = 30 + Math.sin(a1) * 9;
            var rx2 = 22 + Math.cos(a2) * 4;
            var ry2 = 30 + Math.sin(a2) * 4;
            if (st === 0) c.moveTo(rx1, ry1);
            else c.lineTo(rx1, ry1);
            c.lineTo(rx2, ry2);
          }
          c.closePath();
          c.fill();
        } else if (idx === 9) {
          // 10. 推眼鏡認真豬
          drawFaceBase(c, 48, 46, 1.12, { eyes: 'round', mouth: 'open' });
          // 方框眼鏡
          c.fillStyle = 'rgba(191, 219, 254, 0.78)';
          c.strokeStyle = ink;
          c.lineWidth = 2.6;
          c.fillRect(21, 35, 22, 15);
          c.strokeRect(21, 35, 22, 15);
          c.fillRect(53, 35, 22, 15);
          c.strokeRect(53, 35, 22, 15);
          c.beginPath();
          c.moveTo(43, 41); c.lineTo(53, 41);
          c.moveTo(31, 27); c.lineTo(42, 33);
          c.moveTo(65, 27); c.lineTo(54, 33);
          c.stroke();
          // 白紙與小領帶
          c.fillStyle = '#FFFFFF';
          c.fillRect(28, 68, 40, 20);
          c.strokeRect(28, 68, 40, 20);
        } else if (idx === 10) {
          // 11. 頭頂閃亮大眼豬
          drawFaceBase(c, 48, 56, 1.18, { eyes: 'sparkle', mouth: 'open', blush: true });
          c.fillStyle = '#FACC15';
          var stars = [[26, 20, 6], [38, 14, 4.5], [64, 15, 6.5], [74, 24, 4]];
          for (var si = 0; si < stars.length; si++) {
            var sx = stars[si][0], sy = stars[si][1], sr = stars[si][2];
            c.beginPath();
            c.moveTo(sx, sy - sr);
            c.quadraticCurveTo(sx, sy, sx + sr, sy);
            c.quadraticCurveTo(sx, sy, sx, sy + sr);
            c.quadraticCurveTo(sx, sy, sx - sr, sy);
            c.quadraticCurveTo(sx, sy, sx, sy - sr);
            c.fill();
          }
        } else if (idx === 11) {
          // 12. 墨鏡白紳士帽豬
          drawFaceBase(c, 48, 56, 1.12, { eyes: 'round', mouth: 'open' });
          // 墨鏡
          c.fillStyle = '#29150E';
          drawRoundRect(c, 24, 46, 20, 15, 5);
          c.fill();
          drawRoundRect(c, 52, 46, 20, 15, 5);
          c.fill();
          c.strokeStyle = '#FFFFFF';
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(31, 49); c.lineTo(35, 54); c.lineTo(32, 58);
          c.moveTo(59, 49); c.lineTo(63, 54); c.lineTo(60, 58);
          c.stroke();
          // 白紳士帽
          c.fillStyle = '#FFFFFF';
          c.strokeStyle = ink;
          c.lineWidth = 2.6;
          c.beginPath();
          c.moveTo(27, 36);
          c.lineTo(35, 16);
          c.lineTo(48, 21);
          c.lineTo(61, 16);
          c.lineTo(69, 36);
          c.closePath();
          c.fill();
          c.stroke();
          c.fillStyle = '#6366F1';
          c.fillRect(28, 30, 40, 6);
          c.fillStyle = '#FFFFFF';
          c.beginPath();
          c.ellipse(48, 38, 34, 7, 0.08, 0, Math.PI * 2);
          c.fill();
          c.stroke();
        } else if (idx === 12) {
          // 13. 紅毛帽圍巾豬
          drawFaceBase(c, 48, 48, 1.12, { eyes: 'round', mouth: 'none' });
          // 紅毛帽
          c.fillStyle = '#DC2626';
          c.strokeStyle = ink;
          c.lineWidth = 2.6;
          c.beginPath();
          c.arc(48, 35, 25, Math.PI, 0);
          c.closePath();
          c.fill();
          c.stroke();
          c.fillStyle = '#FFFFFF';
          c.beginPath();
          c.arc(54, 10, 6, 0, Math.PI * 2);
          c.fill();
          c.stroke();
          // 紅圍巾
          c.fillStyle = '#DC2626';
          drawRoundRect(c, 28, 69, 40, 10, 4);
          c.fill();
          c.stroke();
          c.fillRect(54, 76, 11, 14);
          c.strokeRect(54, 76, 11, 14);
        } else if (idx === 13) {
          // 14. 小豬太陽
          c.fillStyle = '#F59E0B';
          c.strokeStyle = ink;
          c.lineWidth = 2.2;
          for (var ray = 0; ray < 8; ray++) {
            c.save();
            c.translate(48, 48);
            c.rotate((ray * 45) * Math.PI / 180);
            c.fillStyle = ray % 2 === 0 ? '#F59E0B' : '#EA580C';
            c.beginPath();
            c.moveTo(-7, -23);
            c.lineTo(0, -42);
            c.lineTo(7, -23);
            c.closePath();
            c.fill();
            c.stroke();
            c.restore();
          }
          drawFaceBase(c, 48, 48, 0.92, { skin: '#F59E0B', noEars: true, eyes: 'round', mouth: 'none' });
        } else if (idx === 14) {
          // 15. 粉紅音符
          c.fillStyle = '#F472B6';
          c.strokeStyle = '#EC4899';
          c.lineWidth = 3;
          c.beginPath();
          c.ellipse(38, 72, 13, 9, -0.35, 0, Math.PI * 2);
          c.fill();
          c.lineWidth = 7;
          c.lineCap = 'round';
          c.lineJoin = 'round';
          c.beginPath();
          c.moveTo(48, 70);
          c.lineTo(48, 20);
          c.quadraticCurveTo(68, 24, 66, 44);
          c.stroke();
        } else {
          // 16. 蝴蝶結白色小內褲
          c.fillStyle = '#FFFFFF';
          c.strokeStyle = ink;
          c.lineWidth = 3.5;
          c.lineJoin = 'round';
          c.beginPath();
          c.moveTo(16, 32);
          c.quadraticCurveTo(48, 38, 80, 32);
          c.quadraticCurveTo(82, 68, 48, 68);
          c.quadraticCurveTo(14, 68, 16, 32);
          c.closePath();
          c.fill();
          c.stroke();
          // 中央深色小蝴蝶結
          c.fillStyle = ink;
          c.beginPath();
          c.moveTo(48, 47);
          c.lineTo(39, 41);
          c.lineTo(39, 53);
          c.closePath();
          c.moveTo(48, 47);
          c.lineTo(57, 41);
          c.lineTo(57, 53);
          c.closePath();
          c.fill();
        }

        return off.toDataURL('image/png');
      }

      function buildPresetIcons() {
        PRESET_ICONS = [];
        for (var i = 0; i < 16; i++) {
          PRESET_ICONS.push(createPresetIconDataURL(i));
        }
      }

      // =========================================================================
      // 3. 應用程式狀態與預設值（直接使用可愛小豬圖片圖示）
      // =========================================================================
      var STORAGE_KEY = 'buriburi_pig_clock_settings_v5';
      var TOTAL_PIGS = 105;

          off.height = outSize;
          var c = off.getContext('2d');
          var pad = Math.max(4, Math.round(outSize * 0.06));
          var scale = Math.min((outSize - pad * 2) / cropW, (outSize - pad * 2) / cropH);
          var dw = cropW * scale;
          var dh = cropH * scale;
          c.drawImage(tmp, cropX, cropY, cropW, cropH, (outSize - dw) / 2, (outSize - dh) / 2, dw, dh);

          callback(off);
        } catch (err) {
          callback(null);
        }
      }

      // =========================================================================
      // 5. 高辨識度寬幅數位時鐘向量路徑 (0-9)
      // =========================================================================
      var DIGIT_POLYLINES = {
        '0': [
          [0.32, 0.05], [0.68, 0.05], [0.86, 0.22], [0.88, 0.50],
          [0.86, 0.78], [0.68, 0.95], [0.32, 0.95], [0.14, 0.78],
          [0.12, 0.50], [0.14, 0.22], [0.32, 0.05]
        ],
        '1': [
          [0.30, 0.20], [0.54, 0.05], [0.54, 0.95], [0.28, 0.95], [0.80, 0.95]
        ],
        '2': [
          [0.16, 0.22], [0.32, 0.06], [0.70, 0.06], [0.86, 0.22],
          [0.84, 0.42], [0.14, 0.94], [0.88, 0.94]
        ],
        '3': [
          [0.18, 0.10], [0.72, 0.06], [0.86, 0.24], [0.72, 0.46],
          [0.44, 0.48], [0.74, 0.52], [0.86, 0.74], [0.72, 0.94], [0.18, 0.90]
        ],
        '4': [
          [0.72, 0.95], [0.72, 0.05], [0.12, 0.66], [0.90, 0.66]
        ],
        '5': [
          [0.84, 0.06], [0.20, 0.06], [0.18, 0.44], [0.70, 0.44],
          [0.86, 0.64], [0.72, 0.94], [0.16, 0.90]
        ],
        '6': [
          [0.76, 0.08], [0.34, 0.08], [0.14, 0.44], [0.14, 0.76],
          [0.36, 0.94], [0.72, 0.94], [0.86, 0.72], [0.70, 0.50], [0.18, 0.50]
        ],
        '7': [
          [0.14, 0.06], [0.88, 0.06], [0.40, 0.95]
        ],
        '8': [
          [0.48, 0.48], [0.22, 0.40], [0.18, 0.20], [0.36, 0.05],
          [0.64, 0.05], [0.82, 0.20], [0.78, 0.40], [0.52, 0.48],
          [0.82, 0.58], [0.86, 0.78], [0.66, 0.95], [0.34, 0.95],
          [0.14, 0.78], [0.18, 0.58], [0.48, 0.48]
        ],
        '9': [
          [0.82, 0.48], [0.28, 0.48], [0.14, 0.28], [0.28, 0.06],
          [0.66, 0.06], [0.86, 0.28], [0.84, 0.68], [0.62, 0.94], [0.22, 0.94]
        ]
      };

      function samplePolyline(pts, count) {
        var segLengths = [];
        var totalLen = 0;
        for (var i = 0; i < pts.length - 1; i++) {
          var dx = pts[i + 1][0] - pts[i][0];
          var dy = pts[i + 1][1] - pts[i][1];
          var len = Math.sqrt(dx * dx + dy * dy);
          segLengths.push(len);
          totalLen += len;
        }
        var out = [];
        if (totalLen <= 0 || count <= 1) {
          out.push({ x: pts[0][0], y: pts[0][1] });
          return out;
        }
        for (var k = 0; k < count; k++) {
          var targetDist = (k / (count - 1)) * totalLen;
          var acc = 0;
          var placed = false;
          for (var s = 0; s < segLengths.length; s++) {
            var sl = segLengths[s];
            if (acc + sl >= targetDist || s === segLengths.length - 1) {
              var t = sl > 0 ? Math.min(1, Math.max(0, (targetDist - acc) / sl)) : 0;
              out.push({
                x: pts[s][0] + (pts[s + 1][0] - pts[s][0]) * t,
                y: pts[s][1] + (pts[s + 1][1] - pts[s][1]) * t
              });
              placed = true;
              break;
            }
            acc += sl;
          }
          if (!placed) {
            var last = pts[pts.length - 1];
            out.push({ x: last[0], y: last[1] });
          }
        }
        return out;
      }

      // =========================================================================
      // 6. 105 隻小豬角色群體生成與時鐘排隊演算法
      // =========================================================================
      function initPigs() {
        pigs = [];
        for (var i = 0; i < TOTAL_PIGS; i++) {
          pigs.push({
            x: Math.random() * (W - 60) + 30,
            y: Math.random() * (H - 140) + 80,
            vx: (Math.random() - 0.5) * 70,
            vy: (Math.random() - 0.5) * 70,
            pose: i % DEFAULT_POSE_COUNT,
            poseTimer: 1 + Math.random() * 4,
            wigglePhase: Math.random() * Math.PI * 2,
            flipX: Math.random() > 0.5 ? 1 : -1,
            role: 'roamer',
            tx: 0,
            ty: 0,
            scale: 0.42
          });
        }
      }

      function computeClockTargets() {
        var now = new Date();
        state.lastMinute = now.getMinutes();
        var hh = String(now.getHours()).padStart(2, '0');
        var mm = String(now.getMinutes()).padStart(2, '0');
        var digits = [hh[0], hh[1], mm[0], mm[1]];

        var topBarEl = document.getElementById('topBar');
        var bottomBarEl = document.getElementById('bottomBar');
        var topBottom = 18;
        if (currentSettings && currentSettings.visible && topBarEl) {
          topBottom = 68;
          var tr = topBarEl.getBoundingClientRect();
          if (tr && tr.bottom > 20) topBottom = tr.bottom;
        }
        var bottomTop = H - 18;
        if (!state.barHidden && bottomBarEl) {
          var br = bottomBarEl.getBoundingClientRect();
          if (br && br.top > 120) bottomTop = br.top;
        }

        var safeTop = topBottom + 14;
        var safeBottom = Math.max(safeTop + 140, bottomTop - 14);
        var safeH = safeBottom - safeTop;

        var clockW = W * (state.extraLarge ? 0.91 : 0.79);
        var colonW = clockW * 0.095;
        var digitGap = clockW * 0.045;
        var digitW = (clockW - colonW - digitGap * 2) / 4;
        var digitH = Math.min(safeH * (state.extraLarge ? 0.85 : 0.68), digitW * 1.92);

        var startX = (W - clockW) / 2;
        var centerY = (safeTop + safeBottom) / 2;
        var topY = centerY - digitH / 2;

        state.clockBox = {
          left: startX - 18,
          right: startX + clockW + 18,
          top: topY - 18,
          bottom: topY + digitH + 18
        };

        var xOffsets = [
          startX,
          startX + digitW + digitGap,
          startX + digitW * 2 + digitGap + colonW,
          startX + digitW * 3 + digitGap * 2 + colonW
        ];

        var targets = [];
        var ptsPerDigit = 20;

        for (var d = 0; d < 4; d++) {
          var poly = DIGIT_POLYLINES[digits[d]] || DIGIT_POLYLINES['0'];
          var samples = samplePolyline(poly, ptsPerDigit);
          for (var s = 0; s < samples.length; s++) {
            targets.push({
              x: xOffsets[d] + samples[s].x * digitW,
              y: topY + samples[s].y * digitH,
              role: 'digit'
            });
          }
        }

        var colonX = startX + digitW * 2 + digitGap + colonW * 0.5;
        targets.push({ x: colonX, y: topY + digitH * 0.34, role: 'colon' });
        targets.push({ x: colonX, y: topY + digitH * 0.68, role: 'colon' });

        for (var i = 0; i < pigs.length; i++) {
          pigs[i].role = 'roamer';
        }

        var used = new Array(pigs.length);
        var pigScale = Math.max(0.30, Math.min(0.46, (digitW / 96) * 0.62));

        for (var t = 0; t < targets.length; t++) {
          var bestIdx = -1;
          var bestDist = Infinity;
          for (var p = 0; p < pigs.length; p++) {
            if (used[p]) continue;
            var dx = pigs[p].x - targets[t].x;
            var dy = pigs[p].y - targets[t].y;
            var dist = dx * dx + dy * dy;
            if (dist < bestDist) {
              bestDist = dist;
              bestIdx = p;
            }
          }
          if (bestIdx !== -1) {
            used[bestIdx] = true;
            pigs[bestIdx].role = targets[t].role;
            pigs[bestIdx].tx = targets[t].x;
            pigs[bestIdx].ty = targets[t].y;
            pigs[bestIdx].scale = targets[t].role === 'colon' ? pigScale * 1.12 : pigScale;
          }
        }

        for (var r = 0; r < pigs.length; r++) {
          if (pigs[r].role === 'roamer') {
            pigs[r].scale = 0.42;
            pigs[r].vx = (Math.random() - 0.5) * 75;
            pigs[r].vy = (Math.random() - 0.5) * 75;
          }
        }
      }

      function setGathered(val) {
        state.gathered = !!val;
        var btn = document.getElementById('btnToggleGather');
        if (btn) {
          btn.textContent = state.gathered ? '散開 / 集合 (已集合)' : '散開 / 集合 (自由中)';
        }
        if (state.gathered) {
          computeClockTargets();
        } else {
          for (var i = 0; i < pigs.length; i++) {
            pigs[i].role = 'roamer';
            pigs[i].scale = 0.44;
            var angle = Math.random() * Math.PI * 2;
            var spd = 45 + Math.random() * 55;
            pigs[i].vx = Math.cos(angle) * spd;
            pigs[i].vy = Math.sin(angle) * spd;
          }
        }
      }

      // =========================================================================
      // 7. 主動畫迴圈
      // =========================================================================
      var lastTime = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        if (!lastTime) lastTime = now;
        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var sec = now / 1000;

        var curMin = new Date().getMinutes();
        if (state.gathered && curMin !== state.lastMinute) {
          computeClockTargets();
        }

        ctx.fillStyle = state.nightMode ? '#050505' : '#FDF6EC';
        ctx.fillRect(0, 0, W, H);

        if (!state.nightMode) {
          ctx.fillStyle = 'rgba(59, 35, 24, 0.05)';
          for (var gx = 16; gx < W; gx += 28) {
            for (var gy = 16; gy < H; gy += 28) {
              ctx.fillRect(gx, gy, 1.5, 1.5);
            }
          }
        }

        var box = state.clockBox;
        var minTopY = (currentSettings && currentSettings.visible) ? 64 : 26;

        for (var i = 0; i < pigs.length; i++) {
          var p = pigs[i];
          p.wigglePhase += dt * 4.5;

          if (state.gathered && (p.role === 'digit' || p.role === 'colon')) {
            var dx = p.tx - p.x;
            var dy = p.ty - p.y;
            p.x += dx * Math.min(1, dt * 7.5);
            p.y += dy * Math.min(1, dt * 7.5);
            if (Math.abs(dx) > 1.5) {
              p.flipX = dx >= 0 ? 1 : -1;
            }
          } else {
            p.poseTimer -= dt;
            if (p.poseTimer <= 0) {
              p.pose = Math.floor(Math.random() * activeSprites.length);
              p.poseTimer = 2 + Math.random() * 4;
              var ang = Math.random() * Math.PI * 2;
              var speed = 35 + Math.random() * 55;
              p.vx = Math.cos(ang) * speed;
              p.vy = Math.sin(ang) * speed;
            }

            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (Math.abs(p.vx) > 2) p.flipX = p.vx >= 0 ? 1 : -1;

            var margin = 24;
            if (p.x < margin) { p.x = margin; p.vx = Math.abs(p.vx); }
            if (p.x > W - margin) { p.x = W - margin; p.vx = -Math.abs(p.vx); }
            if (p.y < minTopY) { p.y = minTopY; p.vy = Math.abs(p.vy); }
            if (p.y > H - 36) { p.y = H - 36; p.vy = -Math.abs(p.vy); }

            if (state.gathered && p.x > box.left && p.x < box.right && p.y > box.top && p.y < box.bottom) {
              var dLeft = p.x - box.left;
              var dRight = box.right - p.x;
              var dTop = p.y - box.top;
              var dBot = box.bottom - p.y;
              var minD = Math.min(dLeft, dRight, dTop, dBot);
              if (minD === dLeft) { p.x = box.left; p.vx = -Math.abs(p.vx); }
              else if (minD === dRight) { p.x = box.right; p.vx = Math.abs(p.vx); }
              else if (minD === dTop) { p.y = box.top; p.vy = -Math.abs(p.vy); }
              else { p.y = box.bottom; p.vy = Math.abs(p.vy); }
            }
          }

          var sprite = activeSprites[p.pose % activeSprites.length] || defaultSprites[0];
          if (!sprite) continue;

          var drawScale = p.scale;
          if (state.gathered && p.role === 'colon') {
            drawScale *= (1 + 0.16 * Math.sin(sec * Math.PI * 2));
          }
          var wiggleAngle = Math.sin(p.wigglePhase) * 0.06;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(wiggleAngle);
          ctx.scale(p.flipX * drawScale, drawScale);

          if (state.nightMode) {
            ctx.shadowColor = 'rgba(255, 245, 225, 0.62)';
            ctx.shadowBlur = 9;
          }

          ctx.drawImage(sprite, -48, -48, 96, 96);
          ctx.shadowBlur = 0;
          ctx.restore();
        }
      }

          if (parsed && typeof parsed === 'object') {
            currentSettings = cloneSettings(parsed);

        );

        var showOpts = document.querySelectorAll('.show-icon-opt');
        for (var s1 = 0; s1 < showOpts.length; s1++) {
          var sIdx = Number(showOpts[s1].getAttribute('data-preset-idx'));
          showOpts[s1].classList.toggle('active', d.showBtnIconType === 'preset' && d.showBtnPresetIndex === sIdx);
        }
        syncModalUploadBar(
          document.getElementById('showBtnThumb'),
          document.getElementById('showBtnImgStatus'),
          document.getElementById('btnClearShowIconImg'),
          d.showBtnIconType === 'image',
          d.showBtnImageData,
          '已內建 6 款不理不理小圖示'
        );
        syncButtonIconDisplay(
          document.getElementById('prevShowEmoji'),
          document.getElementById('prevShowImg'),
          d.showBtnIconType,
          d.showBtnIcon,
          d.showBtnImageData
        );
      }

      function openTitleModal() {
        draftSettings = cloneSettings(currentSettings);

        var inputTitle = document.getElementById('inputTitle');
        var inputCustomIcon = document.getElementById('inputCustomIcon');
        var inputHideBtnIcon = document.getElementById('inputHideBtnIcon');
        var inputShowBtnIcon = document.getElementById('inputShowBtnIcon');

        if (inputTitle) inputTitle.value = draftSettings.text;
        if (inputCustomIcon) {
          inputCustomIcon.value = draftSettings.iconType === 'emoji' ? draftSettings.iconEmoji : '';
        }
        if (inputHideBtnIcon) {
          inputHideBtnIcon.value = draftSettings.hideBtnIconType === 'emoji' ? draftSettings.hideBtnIcon : '';
        }
        if (inputShowBtnIcon) {
          inputShowBtnIcon.value = draftSettings.showBtnIconType === 'emoji' ? draftSettings.showBtnIcon : '';
        }

        updateModalPreview();
        var modal = document.getElementById('titleModal');
        if (modal) modal.classList.add('open');
      }

      function closeTitleModal() {
        var modal = document.getElementById('titleModal');
        if (modal) modal.classList.remove('open');
      }

      // =========================================================================
      // 9. 響應式畫布尺寸重設
      // =========================================================================
      function resize() {
        W = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 320);
        H = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 480);
        DPR = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        for (var i = 0; i < pigs.length; i++) {
          pigs[i].x = Math.min(Math.max(pigs[i].x, 24), W - 24);
          pigs[i].y = Math.min(Math.max(pigs[i].y, 26), H - 36);
        }

        if (state.gathered && pigs.length > 0) {
          computeClockTargets();
        }
      }

      // =========================================================================
      // 10. 完整 UI 事件綁定與啟動流程
      // =========================================================================
      function bindUI() {
        canvas.addEventListener('click', function () {
          setGathered(!state.gathered);
        });

        document.getElementById('titleTrigger').addEventListener('click', function (e) {
          e.stopPropagation();
          openTitleModal();
        });

        document.getElementById('btnToggleGather').addEventListener('click', function (e) {
          e.stopPropagation();
          setGathered(!state.gathered);
        });

        document.getElementById('btnToggleSize').addEventListener('click', function (e) {
          e.stopPropagation();
          state.extraLarge = !state.extraLarge;
          this.textContent = state.extraLarge ? '時間：特大' : '時間：大';
          if (state.gathered) computeClockTargets();
          showToast(state.extraLarge ? '時鐘尺寸：特大' : '時鐘尺寸：大');
        });

        document.getElementById('btnToggleNight').addEventListener('click', function (e) {
          e.stopPropagation();
          state.nightMode = !state.nightMode;
          document.body.classList.toggle('night', state.nightMode);
          this.textContent = state.nightMode ? '日間模式' : '夜間模式';
          var meta = document.getElementById('metaTheme');
          if (meta) meta.setAttribute('content', state.nightMode ? '#050505' : '#FDF6EC');
          showToast(state.nightMode ? '已切換為 OLED 純黑夜間模式' : '已切換為日間暖紙模式');
        });

        document.getElementById('btnWakeLock').addEventListener('click', function (e) {
          e.stopPropagation();
          var btn = this;
          if (!('wakeLock' in navigator) || !navigator.wakeLock) {
            showToast('此瀏覽器不支援自動螢幕常亮，請調長手機休眠時間');
            return;
          }
          if (state.wakeLock) {
            try { state.wakeLock.release(); } catch (err) {}
            state.wakeLock = null;
            btn.textContent = '螢幕常亮';
            btn.classList.remove('primary');
            showToast('已關閉螢幕常亮');
          } else {
            navigator.wakeLock.request('screen').then(function (sentinel) {
              state.wakeLock = sentinel;
              btn.textContent = '螢幕常亮 (開啟中)';
              btn.classList.add('primary');
              showToast('已開啟螢幕常亮！');
              sentinel.addEventListener('release', function () {
                state.wakeLock = null;
                btn.textContent = '螢幕常亮';
                btn.classList.remove('primary');
              });
            }).catch(function () {
              showToast('無法啟用螢幕常亮（可能處於省電模式或嵌入視窗）');
            });
          }
        });

        var fileStickerInput = document.getElementById('fileStickerInput');
        var btnResetSticker = document.getElementById('btnResetSticker');

        document.getElementById('btnCustomSticker').addEventListener('click', function (e) {
          e.stopPropagation();
          fileStickerInput.value = '';
          fileStickerInput.click();
        });

        fileStickerInput.addEventListener('change', function () {
          var files = this.files;
          if (!files || !files.length) return;
          var loadedSprites = [];
          var pending = Math.min(files.length, 16);

          for (var i = 0; i < pending; i++) {
            (function (file) {
              var reader = new FileReader();
              reader.onload = function (ev) {
                var img = new Image();
                img.onload = function () {
                  processImageStripWhite(img, 96, function (spr) {
                    if (spr) loadedSprites.push(spr);
                    pending--;
                    if (pending <= 0 && loadedSprites.length > 0) {
                      activeSprites = loadedSprites;
                      usingCustomStickers = true;
                      btnResetSticker.classList.remove('hidden');
                      showToast('已套用 ' + loadedSprites.length + ' 張自訂貼圖！');
                    }
                  });
                };
                img.onerror = function () { pending--; };
                img.src = ev.target.result;
              };
              reader.readAsDataURL(file);
            })(files[i]);
          }
        });

        btnResetSticker.addEventListener('click', function (e) {
          e.stopPropagation();
          usingCustomStickers = false;
          activeSprites = defaultSprites.slice();
          btnResetSticker.classList.add('hidden');
          showToast('已恢復預設 ' + DEFAULT_POSE_COUNT + ' 款不理不理左衛門小豬！');
        });

        document.getElementById('btnOpenSettings').addEventListener('click', function (e) {
          e.stopPropagation();
          openTitleModal();
        });

        var bottomBarEl = document.getElementById('bottomBar');
        var btnShowBar = document.getElementById('btnShowBar');

        document.getElementById('btnHideBar').addEventListener('click', function (e) {
          e.stopPropagation();
          state.barHidden = true;
          bottomBarEl.classList.add('hidden');
          btnShowBar.classList.remove('hidden');
          if (state.gathered) computeClockTargets();
          showToast('已隱藏底部選項，點右下角可恢復');
        });

        btnShowBar.addEventListener('click', function (e) {
          e.stopPropagation();
          state.barHidden = false;
          btnShowBar.classList.add('hidden');
          bottomBarEl.classList.remove('hidden');
          if (state.gathered) computeClockTargets();
        });

        var modalEl = document.getElementById('titleModal');
        var modalBoxEl = modalEl.querySelector('.modal-box');
        modalBoxEl.addEventListener('click', function (e) {
          e.stopPropagation();
        });

        document.getElementById('btnCloseModal').addEventListener('click', closeTitleModal);
        document.getElementById('btnCancelModal').addEventListener('click', closeTitleModal);
        modalEl.addEventListener('click', function (e) {
          if (e.target === modalEl) closeTitleModal();
        });

        document.getElementById('btnTitleVisibleOn').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.visible = true;
          updateModalPreview();
        });

        document.getElementById('btnTitleVisibleOff').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.visible = false;
          updateModalPreview();
        });

        document.getElementById('inputTitle').addEventListener('input', function () {
          if (!draftSettings) return;
          draftSettings.text = this.value;
          updateModalPreview();
        });

        document.getElementById('btnClearTitle').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.text = '';
          document.getElementById('inputTitle').value = '';
          updateModalPreview();
        });

        var presetTitles = document.querySelectorAll('.preset-title');
        for (var i = 0; i < presetTitles.length; i++) {
          presetTitles[i].addEventListener('click', function () {
            if (!draftSettings) return;
            var val = this.getAttribute('data-val') || '';
            draftSettings.text = val;
            document.getElementById('inputTitle').value = val;
            updateModalPreview();
          });
        }

        var sizeBtns = document.querySelectorAll('.size-btn');
        for (var sb = 0; sb < sizeBtns.length; sb++) {
          sizeBtns[sb].addEventListener('click', function () {
            if (!draftSettings) return;
            var sz = Number(this.getAttribute('data-size')) || 26;
            draftSettings.fontSize = Math.min(44, Math.max(16, sz));
            updateModalPreview();
          });
        }

        document.getElementById('inputFontSize').addEventListener('input', function () {
          if (!draftSettings) return;
          var sz = Number(this.value) || 26;
          draftSettings.fontSize = Math.min(44, Math.max(16, sz));
          updateModalPreview();
        });

        document.getElementById('btnNoIcon').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.iconType = 'none';
          draftSettings.iconImage = '';
          document.getElementById('inputCustomIcon').value = '';
          updateModalPreview();
        });

        // 點選 16 款預選標題小豬頭像
        document.getElementById('titleStickerGrid').addEventListener('click', function (e) {
          var target = e.target;
          while (target && target !== this && !target.classList.contains('sticker-item')) {
            target = target.parentNode;
          }
          if (!target || !target.classList.contains('sticker-item') || !draftSettings) return;
          var idx = Number(target.getAttribute('data-preset-idx')) || 0;
          draftSettings.iconType = 'preset';
          draftSettings.presetIndex = idx;
          draftSettings.iconImage = PRESET_ICONS[idx] || '';
          document.getElementById('inputCustomIcon').value = '';
          updateModalPreview();
        });

        document.getElementById('inputCustomIcon').addEventListener('input', function () {
          if (!draftSettings) return;
          var val = this.value.trim();
          if (!val) {
            draftSettings.iconType = 'preset';
            draftSettings.iconImage = PRESET_ICONS[draftSettings.presetIndex] || '';
          } else {
            draftSettings.iconType = 'emoji';
            draftSettings.iconEmoji = val;
            draftSettings.iconImage = '';
          }
          updateModalPreview();
        });

        var fileIconInput = document.getElementById('fileIconInput');
        document.getElementById('btnTriggerIconUpload').addEventListener('click', function () {
          fileIconInput.value = '';
          fileIconInput.click();
        });

        fileIconInput.addEventListener('change', function () {
          var file = this.files && this.files[0];
          if (!file || !draftSettings) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              processImageStripWhite(img, 96, function (spr) {
                if (spr && draftSettings) {
                  draftSettings.iconType = 'image';
                  draftSettings.iconImage = spr.toDataURL('image/png');
                  updateModalPreview();
                  showToast('已載入標題小圖片（按確認套用生效）');
                }
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('btnClearTitleIconImg').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.iconType = 'preset';
          draftSettings.presetIndex = 0;
          draftSettings.iconImage = PRESET_ICONS[0] || '';
          document.getElementById('inputCustomIcon').value = '';
          updateModalPreview();
        });

        // 隱藏選項按鈕圖示選擇
        document.getElementById('hideIconGroup').addEventListener('click', function (e) {
          var target = e.target;
          while (target && target !== this && !target.classList.contains('hide-icon-opt')) {
            target = target.parentNode;
          }
          if (!target || !target.classList.contains('hide-icon-opt') || !draftSettings) return;
          var idx = Number(target.getAttribute('data-preset-idx')) || 6;
          draftSettings.hideBtnIconType = 'preset';
          draftSettings.hideBtnPresetIndex = idx;
          draftSettings.hideBtnImageData = PRESET_ICONS[idx] || '';
          var inp = document.getElementById('inputHideBtnIcon');
          if (inp) inp.value = '';
          updateModalPreview();
        });

        document.getElementById('inputHideBtnIcon').addEventListener('input', function () {
          if (!draftSettings) return;
          var val = this.value.trim();
          if (!val) {
            draftSettings.hideBtnIconType = 'preset';
            draftSettings.hideBtnImageData = PRESET_ICONS[draftSettings.hideBtnPresetIndex] || '';
          } else {
            draftSettings.hideBtnIconType = 'emoji';
            draftSettings.hideBtnIcon = val;
          }
          updateModalPreview();
        });

        var fileHideIconInput = document.getElementById('fileHideIconInput');
        document.getElementById('btnUploadHideIcon').addEventListener('click', function () {
          fileHideIconInput.value = '';
          fileHideIconInput.click();
        });

        fileHideIconInput.addEventListener('change', function () {
          var file = this.files && this.files[0];
          if (!file || !draftSettings) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              processImageStripWhite(img, 64, function (spr) {
                if (spr && draftSettings) {
                  draftSettings.hideBtnIconType = 'image';
                  draftSettings.hideBtnImageData = spr.toDataURL('image/png');
                  updateModalPreview();
                }
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('btnClearHideIconImg').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.hideBtnIconType = 'preset';
          draftSettings.hideBtnPresetIndex = 6;
          draftSettings.hideBtnImageData = PRESET_ICONS[6] || '';
          updateModalPreview();
        });

        // 顯示選項按鈕圖示選擇
        document.getElementById('showIconGroup').addEventListener('click', function (e) {
          var target = e.target;
          while (target && target !== this && !target.classList.contains('show-icon-opt')) {
            target = target.parentNode;
          }
          if (!target || !target.classList.contains('show-icon-opt') || !draftSettings) return;
          var idx = Number(target.getAttribute('data-preset-idx')) || 4;
          draftSettings.showBtnIconType = 'preset';
          draftSettings.showBtnPresetIndex = idx;
          draftSettings.showBtnImageData = PRESET_ICONS[idx] || '';
          var inp = document.getElementById('inputShowBtnIcon');
          if (inp) inp.value = '';
          updateModalPreview();
        });

        document.getElementById('inputShowBtnIcon').addEventListener('input', function () {
          if (!draftSettings) return;
          var val = this.value.trim();
          if (!val) {
            draftSettings.showBtnIconType = 'preset';
            draftSettings.showBtnImageData = PRESET_ICONS[draftSettings.showBtnPresetIndex] || '';
          } else {
            draftSettings.showBtnIconType = 'emoji';
            draftSettings.showBtnIcon = val;
          }
          updateModalPreview();
        });

        var fileShowIconInput = document.getElementById('fileShowIconInput');
        document.getElementById('btnUploadShowIcon').addEventListener('click', function () {
          fileShowIconInput.value = '';
          fileShowIconInput.click();
        });

        fileShowIconInput.addEventListener('change', function () {
          var file = this.files && this.files[0];
          if (!file || !draftSettings) return;
          var reader = new FileReader();
          reader.onload = function (ev) {
            var img = new Image();
            img.onload = function () {
              processImageStripWhite(img, 64, function (spr) {
                if (spr && draftSettings) {
                  draftSettings.showBtnIconType = 'image';
                  draftSettings.showBtnImageData = spr.toDataURL('image/png');
                  updateModalPreview();
                }
              });
            };
            img.src = ev.target.result;
          };
          reader.readAsDataURL(file);
        });

        document.getElementById('btnClearShowIconImg').addEventListener('click', function () {
          if (!draftSettings) return;
          draftSettings.showBtnIconType = 'preset';
          draftSettings.showBtnPresetIndex = 4;
          draftSettings.showBtnImageData = PRESET_ICONS[4] || '';
          updateModalPreview();
        });

        document.getElementById('btnResetDefaults').addEventListener('click', function () {
          draftSettings = getDefaultSettings();
          document.getElementById('inputTitle').value = draftSettings.text;
          document.getElementById('inputCustomIcon').value = '';
          var hInp = document.getElementById('inputHideBtnIcon');
          var sInp = document.getElementById('inputShowBtnIcon');
          if (hInp) hInp.value = '';
          if (sInp) sInp.value = '';
          updateModalPreview();
          showToast('已重設為預設值（按「確認套用」生效）');
        });

        document.getElementById('btnApplyModal').addEventListener('click', function () {
          if (draftSettings) {
            if ((draftSettings.iconType === 'image' || draftSettings.iconType === 'preset') && !draftSettings.iconImage) {
              draftSettings.iconType = 'preset';
              draftSettings.presetIndex = 0;
              draftSettings.iconImage = PRESET_ICONS[0] || '';
            }
            if ((draftSettings.hideBtnIconType === 'image' || draftSettings.hideBtnIconType === 'preset') && !draftSettings.hideBtnImageData) {
              draftSettings.hideBtnIconType = 'preset';
              draftSettings.hideBtnPresetIndex = 6;
              draftSettings.hideBtnImageData = PRESET_ICONS[6] || '';
            }
            if ((draftSettings.showBtnIconType === 'image' || draftSettings.showBtnIconType === 'preset') && !draftSettings.showBtnImageData) {
              draftSettings.showBtnIconType = 'preset';
              draftSettings.showBtnPresetIndex = 4;
              draftSettings.showBtnImageData = PRESET_ICONS[4] || '';
            }
            currentSettings = cloneSettings(draftSettings);
            saveSettings();
            applySettingsToScreen();
            showToast('已套用標題與圖示設定！');
          }
          closeTitleModal();
        });

        window.addEventListener('resize', resize);
        if (typeof ResizeObserver !== 'undefined') {
          try {
            var ro = new ResizeObserver(resize);
            ro.observe(document.body);
          } catch (e) {}
        }
        setTimeout(resize, 150);
      }

      function bootstrap() {
        buildPresetIcons();
        populatePresetPickers();
        loadSettings();
        applySettingsToScreen();
        buildDefaultSprites();
        initPigs();
        bindUI();
        resize();
        setGathered(true);
        requestAnimationFrame(animate);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
