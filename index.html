<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FDF6EC" id="metaTheme" />
  <title>不理不理左衛門時鐘</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Kiwi+Maru:wght@400;500&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FDF6EC;
      --ink: #3B2318;
      --pill-bg: #FFFAF3;
      --pill-border: #3B2318;
      --modal-bg: #FDF6EC;
      --card-bg: #FFFFFF;
      --accent: #F4B89C;
      --font-hand: "Hachi Maru Pop", "Kiwi Maru", "Zen Maru Gothic", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --font-ui: "Zen Maru Gothic", "Kiwi Maru", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body.night {
      --bg: #050505;
      --ink: #F5EDE4;
      --pill-bg: rgba(28, 28, 32, 0.92);
      --pill-border: rgba(245, 237, 228, 0.72);
      --modal-bg: #18181B;
      --card-bg: #242429;
      --accent: #D98A6C;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-ui);
      transition: background-color 0.25s ease, color 0.25s ease;
      touch-action: manipulation;
    }

    #clockCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* 頂部可自訂標題列 */
    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 14px;
      pointer-events: none;
    }

    #titleTrigger {
      pointer-events: auto;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 94vw;
      padding: 6px 14px;
      border: 1.5px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    #titleTrigger:hover {
      background-color: rgba(128, 128, 128, 0.1);
      border-color: rgba(128, 128, 128, 0.25);
    }

    #titleTrigger:active {
      transform: scale(0.96);
    }

    #titleIcon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #titleIconImg {
      display: none;
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
      vertical-align: middle;
    }

    .ctrl-btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ctrl-btn-img {
      display: none;
      width: 16px;
      height: 16px;
      object-fit: contain;
      border-radius: 4px;
    }

    .edit-badge {
      font-size: 0.62em;
      opacity: 0.55;
      margin-left: 2px;
    }

    /* 底部控制工具列 */
    #bottomBar {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      pointer-events: none;
    }

    .toolbar-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px;
      max-width: 96vw;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 13px;
      border: 1.8px solid var(--pill-border);
      border-radius: 18px 14px 20px 15px / 15px 19px 14px 18px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--pill-border);
      white-space: nowrap;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .pill-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .pill-btn.primary {
      background-color: var(--accent);
      color: #2B1810;
    }

    .hint-line {
      margin-top: 7px;
      font-family: var(--font-hand);
      font-size: 12px;
      font-weight: 700;
      opacity: 0.72;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* 隱藏底部工具列後的右下角半透明恢復按鈕 */
    #btnShowBar {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 1.5px solid var(--pill-border);
      border-radius: 999px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 12px;
      font-weight: 800;
      opacity: 0.65;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    #btnShowBar:hover,
    #btnShowBar:active {
      opacity: 0.96;
      transform: scale(0.96);
    }

    /* 輕量提示氣泡 */
    #toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(35, 24, 18, 0.92);
      color: #FFFDF9;
      font-family: var(--font-hand);
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 標題與圖示設定彈窗 */
    #titleModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.54);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #titleModal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background-color: var(--modal-bg);
      color: var(--ink);
      border: 2px solid var(--pill-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--pill-border);
      background: var(--card-bg);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }

    .preview-panel {
      background: var(--card-bg);
      border: 1.5px dashed rgba(128, 128, 128, 0.42);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .preview-tag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.62;
      margin-bottom: 4px;
    }

    #modalPreview {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: var(--font-hand);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      min-height: 34px;
    }

    #previewImg {
      display: none;
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }

    .preview-btns-bar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(128, 128, 128, 0.28);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 800;
    }

    .preview-mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(128, 128, 128, 0.35);
    }

    .preview-mini-img {
      display: none;
      width: 15px;
      height: 15px;
      object-fit: contain;
      border-radius: 3px;
    }

    .field-group {
      margin-bottom: 13px;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.18);
    }

    .field-group:last-of-type {
      border-bottom: none;
      margin-bottom: 6px;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .seg-btn {
      padding: 8px 10px;
      border: 1.6px solid var(--pill-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .text-box {
      width: 100%;
      padding: 8px 12px;
      border: 1.6px solid var(--pill-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      padding: 5px 10px;
      border: 1.4px solid var(--pill-border);
      border-radius: 999px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #2B1810;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .size-btn {
      padding: 6px 2px;
      border: 1.4px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #D97757;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .emoji-item {
      aspect-ratio: 1;
      border: 1.4px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      background: var(--card-bg);
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }

    .emoji-item.active {
      border-color: var(--pill-border);
      background: var(--accent);
    }

    .icon-pick-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .mini-icon-btn {
      width: 34px;
      height: 34px;
      border: 1.4px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      background: var(--card-bg);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .mini-icon-btn.active {
      border-color: var(--pill-border);
      background: var(--accent);
    }

    .mini-icon-input {
      width: 68px;
      padding: 6px 8px;
      border: 1.5px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .btn-icon-upload-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1.2px dashed rgba(128, 128, 128, 0.35);
      font-size: 12px;
      font-weight: 700;
    }

    .btn-icon-upload-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .btn-icon-thumb {
      display: none;
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 5px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      background: #FFFFFF;
    }

    .btn-icon-actions {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <!-- 主互動小豬時鐘畫布 -->
  <canvas id="clockCanvas"></canvas>

  <!-- 頂部可自訂標題列 -->
  <header id="topBar">
    <button id="titleTrigger" type="button" title="點擊修改標題、顯示狀態與後方小圖示">
      <span id="titleText">不理不理左衛門時鐘</span>
      <span id="titleIcon">🐷</span>
      <img id="titleIconImg" alt="標題小圖示" />
      <span class="edit-badge">✎</span>
    </button>
  </header>

  <!-- 輕量操作提示氣泡 -->
  <div id="toast"></div>

  <!-- 底部控制工具列 -->
  <footer id="bottomBar">
    <div class="toolbar-row">
      <button id="btnToggleGather" type="button" class="pill-btn">散開 / 集合</button>
      <button id="btnToggleSize" type="button" class="pill-btn">時間：特大</button>
      <button id="btnToggleNight" type="button" class="pill-btn">夜間模式</button>
      <button id="btnWakeLock" type="button" class="pill-btn">螢幕常亮</button>
      <button id="btnCustomSticker" type="button" class="pill-btn">自訂小豬貼圖</button>
      <button id="btnResetSticker" type="button" class="pill-btn hidden">恢復預設小豬</button>
      <button id="btnOpenSettings" type="button" class="pill-btn">✎ 標題與圖示</button>
      <button id="btnHideBar" type="button" class="pill-btn">
        <span id="hideBtnIcon" class="ctrl-btn-icon">🙈</span>
        <img id="hideBtnImg" class="ctrl-btn-img" alt="隱藏選項圖示" />
        <span>隱藏選項</span>
      </button>
    </div>
    <div class="hint-line">點擊螢幕即可讓小豬散開或集合報時！</div>
    <input id="fileStickerInput" type="file" accept="image/*" multiple class="hidden" />
  </footer>

  <!-- 隱藏選項後的右下角半透明恢復按鈕 -->
  <button id="btnShowBar" type="button" class="hidden" title="顯示底部控制列">
    <span id="showBtnIcon" class="ctrl-btn-icon">👁️</span>
    <img id="showBtnImg" class="ctrl-btn-img" alt="顯示選項圖示" />
    <span>顯示選項</span>
  </button>

  <!-- 標題與圖示自訂設定彈窗 -->
  <div id="titleModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>✎ 標題與按鈕圖示設定</h2>
        <button id="btnCloseModal" type="button" class="close-btn">✕</button>
      </div>

      <!-- 即時預覽區 -->
      <div class="preview-panel">
        <span class="preview-tag">頂部標題與按鈕即時預覽</span>
        <div id="modalPreview">
          <span id="previewText">不理不理左衛門時鐘</span>
          <span id="previewIcon">🐷</span>
          <img id="previewImg" alt="預覽圖示" />
        </div>
        <div class="preview-btns-bar">
          <span class="preview-mini-pill">
            <span id="prevHideEmoji">🙈</span>
            <img id="prevHideImg" class="preview-mini-img" alt="" />
            <span>隱藏選項</span>
          </span>
          <span class="preview-mini-pill">
            <span id="prevShowEmoji">👁️</span>
            <img id="prevShowImg" class="preview-mini-img" alt="" />
            <span>顯示選項</span>
          </span>
        </div>
      </div>

      <!-- 1. 頂部標題顯示狀態 -->
      <div class="field-group">
        <div class="field-label-row">
          <span>1. 頂部標題顯示狀態</span>
        </div>
        <div class="segmented-row">
          <button type="button" id="btnTitleVisibleOn" class="seg-btn active">顯示標題</button>
          <button type="button" id="btnTitleVisibleOff" class="seg-btn">隱藏標題</button>
        </div>
      </div>

      <!-- 2. 標題文字內容 -->
      <div class="field-group">
        <div class="field-label-row">
          <label for="inputTitle">2. 標題文字內容</label>
          <button id="btnClearTitle" type="button" class="chip">清空文字</button>
        </div>
        <input id="inputTitle" type="text" maxlength="24" class="text-box" placeholder="輸入標題文字（可留空只顯示圖示）" />
        <div class="chip-wrap">
          <button type="button" class="chip preset-title" data-val="不理不理左衛門時鐘">不理不理左衛門時鐘</button>
          <button type="button" class="chip preset-title" data-val="豬豬時鐘">豬豬時鐘</button>
          <button type="button" class="chip preset-title" data-val="午休時間">午休時間</button>
          <button type="button" class="chip preset-title" data-val="起床囉！">起床囉！</button>
        </div>
      </div>

      <!-- 3. 標題字型大小 -->
      <div class="field-group">
        <div class="field-label-row">
          <label for="inputFontSize">3. 標題字型大小</label>
          <span id="fontSizeBadge" class="chip">24px</span>
        </div>
        <div class="size-row">
          <button type="button" class="size-btn" data-size="16">小 16px</button>
          <button type="button" class="size-btn" data-size="20">適中 20px</button>
          <button type="button" class="size-btn" data-size="24">標準 24px</button>
          <button type="button" class="size-btn" data-size="30">大 30px</button>
          <button type="button" class="size-btn" data-size="38">特大 38px</button>
        </div>
        <div class="slider-row">
          <span style="font-size:12px;font-weight:900;opacity:0.65;">A</span>
          <input id="inputFontSize" type="range" min="14" max="42" step="1" value="24" />
          <span style="font-size:18px;font-weight:900;">A</span>
        </div>
      </div>

      <!-- 4. 標題後方小圖示 -->
      <div class="field-group">
        <div class="field-label-row">
          <span>4. 標題後方小圖示</span>
          <button id="btnNoIcon" type="button" class="chip">無圖示 (隱藏)</button>
        </div>
        <div class="emoji-grid" id="emojiGrid">
          <button type="button" class="emoji-item" data-emoji="🐷">🐷</button>
          <button type="button" class="emoji-item" data-emoji="🐽">🐽</button>
          <button type="button" class="emoji-item" data-emoji="⏰">⏰</button>
          <button type="button" class="emoji-item" data-emoji="✨">✨</button>
          <button type="button" class="emoji-item" data-emoji="💖">💖</button>
          <button type="button" class="emoji-item" data-emoji="👑">👑</button>
          <button type="button" class="emoji-item" data-emoji="🌟">🌟</button>

  <script>
    (function () {
      'use strict';

      var HAND_FONT = '"Hachi Maru Pop", "Kiwi Maru", "Zen Maru Gothic", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';

      // =========================================================================
      // 1. 安全儲存存取
      // =========================================================================
      var memStore = {};
      function safeGet(key, fallback) {
        try {
          var v = window.localStorage.getItem(key);
          if (v !== null) return v;
        } catch (e) {}
        return Object.prototype.hasOwnProperty.call(memStore, key) ? memStore[key] : fallback;
      }

      function safeSet(key, val) {
        memStore[key] = val;
        try {
          window.localStorage.setItem(key, val);
        } catch (e) {}
      }

      function drawRoundRect(c, x, y, w, h, r) {
        var radius = Math.min(r, w / 2, h / 2);
        c.beginPath();
        c.moveTo(x + radius, y);
        c.arcTo(x + w, y, x + w, y + h, radius);
        c.arcTo(x + w, y + h, x, y + h, radius);
        c.arcTo(x, y + h, x, y, radius);
        c.arcTo(x, y, x + w, y, radius);
        c.closePath();
      }

      // =========================================================================
      // 2. 應用程式狀態與視窗尺寸初始化
      // =========================================================================
      var STORAGE_KEY = 'buriburi_pig_clock_settings_v4';
      var TOTAL_PIGS = 105;
      var DEFAULT_POSE_COUNT = 16;
      var W = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 320);
      var H = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 480);
      var DPR = Math.min(window.devicePixelRatio || 1, 2);

      var DEFAULT_SETTINGS = {
        visible: true,
        text: '不理不理左衛門時鐘',
        fontSize: 24,
        iconType: 'emoji',
        iconEmoji: '🐷',
        iconImage: '',
        hideBtnIcon: '🙈',
        hideBtnIconType: 'emoji',
        hideBtnImageData: '',
        showBtnIcon: '👁️',
        showBtnIconType: 'emoji',
        showBtnImageData: ''
      };

      function cloneSettings(src) {
        return {
          visible: typeof src.visible === 'boolean' ? src.visible : true,
          text: typeof src.text === 'string' ? src.text : DEFAULT_SETTINGS.text,
          fontSize: typeof src.fontSize === 'number' ? Math.min(42, Math.max(14, src.fontSize)) : 24,
          iconType: (src.iconType === 'emoji' || src.iconType === 'image' || src.iconType === 'none') ? src.iconType : 'emoji',
          iconEmoji: typeof src.iconEmoji === 'string' ? src.iconEmoji : (typeof src.emoji === 'string' ? src.emoji : '🐷'),
          iconImage: typeof src.iconImage === 'string' ? src.iconImage : (typeof src.imageData === 'string' ? src.imageData : ''),
          hideBtnIcon: typeof src.hideBtnIcon === 'string' && src.hideBtnIcon.trim() ? src.hideBtnIcon.trim() : '🙈',
          hideBtnIconType: (src.hideBtnIconType === 'image' && src.hideBtnImageData) ? 'image' : 'emoji',
          hideBtnImageData: typeof src.hideBtnImageData === 'string' ? src.hideBtnImageData : '',
          showBtnIcon: typeof src.showBtnIcon === 'string' && src.showBtnIcon.trim() ? src.showBtnIcon.trim() : '👁️',
          showBtnIconType: (src.showBtnIconType === 'image' && src.showBtnImageData) ? 'image' : 'emoji',
          showBtnImageData: typeof src.showBtnImageData === 'string' ? src.showBtnImageData : ''
        };
      }

      var currentSettings = cloneSettings(DEFAULT_SETTINGS);
      var draftSettings = null;

      var state = {
        gathered: true,
        extraLarge: true,
        nightMode: false,
        wakeLock: null,
        barHidden: false,
        lastMinute: -1,
        clockBox: { left: 20, right: 300, top: 120, bottom: 420 }
      };

      var canvas = document.getElementById('clockCanvas');
      var ctx = canvas.getContext('2d');
      var defaultSprites = [];
      var activeSprites = [];
      var usingCustomStickers = false;
      var pigs = [];
      var toastTimer = null;

      function showToast(msg) {
        var el = document.getElementById('toast');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          el.classList.remove('show');
        }, 2200);
      }

      // =========================================================================
      // 3. 預先繪製 16 款不理不理左衛門搞笑姿勢（96x96 離屏畫布）
      // =========================================================================
      function drawKatana(c, x, y, angle) {
        c.save();
        c.translate(x, y);
        c.rotate(angle);
        c.fillStyle = '#E11D48';
        c.strokeStyle = '#3B2318';
        c.lineWidth = 1.8;
        drawRoundRect(c, -12, -2.5, 16, 5, 2);
        c.fill();
        c.stroke();
        c.fillStyle = '#FACC15';
        c.fillRect(3, -4.5, 3, 9);
        c.strokeRect(3, -4.5, 3, 9);
        c.fillStyle = '#FDE047';
        drawRoundRect(c, 6, -2.5, 8, 5, 1.5);
        c.fill();
        c.stroke();
        c.restore();
      }

      function drawPigHead(c, cx, cy, scale, mood) {
        c.save();
        c.translate(cx, cy);
        c.scale(scale, scale);

        var skin = '#F5B496';
        var snoutCol = '#F9CBB5';
        var ink = '#3B2318';

        c.fillStyle = skin;
        c.strokeStyle = ink;
        c.lineWidth = 2.4;
        c.lineJoin = 'round';
        c.lineCap = 'round';

        // 尖尖豬耳朵
        c.beginPath();
        c.moveTo(-17, -10);
        c.lineTo(-22, -26);
        c.lineTo(-7, -17);
        c.closePath();
        c.fill();
        c.stroke();

        c.beginPath();
        c.moveTo(17, -10);
        c.lineTo(22, -26);
        c.lineTo(7, -17);
        c.closePath();
        c.fill();
        c.stroke();

        // 圓滾滾臉型
        c.beginPath();
        c.ellipse(0, 0, 21, 18, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // 招牌粗眉毛
        c.lineWidth = 3.2;
        if (mood === 'sad') {
          c.beginPath();
          c.moveTo(-15, -9);
          c.lineTo(-6, -6);
          c.moveTo(15, -9);
          c.lineTo(6, -6);
          c.stroke();
        } else {
          c.beginPath();
          c.moveTo(-15, -6);
          c.lineTo(-5, -10);
          c.moveTo(15, -6);
          c.lineTo(5, -10);
          c.stroke();
        }

        // 眼睛
        c.fillStyle = ink;
        if (mood === 'sleepy') {
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(-13, -3);
          c.lineTo(-7, -3);
          c.moveTo(7, -3);
          c.lineTo(13, -3);
          c.stroke();
        } else {
          c.beginPath();
          c.arc(-10, -3, 2.1, 0, Math.PI * 2);
          c.arc(10, -3, 2.1, 0, Math.PI * 2);
          c.fill();
        }

        // 大豬鼻子
        c.fillStyle = snoutCol;
        c.strokeStyle = ink;
        c.lineWidth = 2.2;
        c.beginPath();
        c.ellipse(0, 6, 13, 9, 0, 0, Math.PI * 2);
        c.fill();
        c.stroke();

        // 兩個鼻孔
        c.fillStyle = ink;
        c.beginPath();
        c.ellipse(-4.5, 6, 2.2, 3.4, 0, 0, Math.PI * 2);
        c.ellipse(4.5, 6, 2.2, 3.4, 0, 0, Math.PI * 2);
        c.fill();

        c.restore();
      }

      function createPigSprite(pose) {
        var off = document.createElement('canvas');
        off.width = 96;
        off.height = 96;
        var c = off.getContext('2d');
        var skin = '#F5B496';
        var purple = '#7E3AF2';
        var ink = '#3B2318';

        c.lineCap = 'round';
        c.lineJoin = 'round';

        if (pose === 0) {
          // 姿勢 0：站立比 OK 手勢
          c.fillStyle = skin;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(48, 55, 16, 15, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.beginPath();
          c.moveTo(62, 49);
          c.quadraticCurveTo(74, 38, 70, 28);
          c.stroke();
          c.beginPath();
          c.arc(70, 26, 4.5, 0, Math.PI * 2);
          c.fill();
          c.stroke();
          c.beginPath();
          c.moveTo(34, 50);
          c.lineTo(25, 60);
          c.stroke();

          c.fillStyle = purple;
          c.beginPath();
          c.moveTo(33, 60);
          c.lineTo(63, 60);
          c.lineTo(61, 83);
          c.lineTo(51, 83);
          c.lineTo(48, 71);
          c.lineTo(45, 83);
          c.lineTo(35, 83);
          c.closePath();
          c.fill();
          c.stroke();

          drawKatana(c, 33, 62, -0.4);
          drawPigHead(c, 48, 30, 0.92, 'normal');

          c.fillStyle = '#DC2626';
          c.font = '900 13px ' + HAND_FONT;
          c.fillText('ok', 63, 17);

        } else if (pose === 1) {
          // 姿勢 1：趴地單手撐頭發懶
          c.fillStyle = purple;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(68, 66, 19, 8, -0.1, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = skin;
          c.beginPath();
          c.ellipse(44, 65, 18, 10, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.beginPath();
          c.moveTo(26, 68);
          c.lineTo(22, 56);
          c.lineTo(29, 52);
          c.stroke();

          drawKatana(c, 58, 61, 0.15);
          drawPigHead(c, 32, 46, 0.9, 'sleepy');

        } else if (pose === 2) {
          // 姿勢 2：流汗下跪土下座道歉
          c.fillStyle = purple;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(54, 71, 17, 11, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = skin;
          c.beginPath();
          c.ellipse(42, 65, 17, 13, -0.2, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          drawKatana(c, 62, 66, 0.3);
          drawPigHead(c, 32, 56, 0.86, 'sad');

          c.fillStyle = '#38BDF8';
          c.beginPath();
          c.arc(22, 36, 2.5, 0, Math.PI * 2);
          c.arc(46, 34, 2.5, 0, Math.PI * 2);
          c.arc(64, 44, 2.5, 0, Math.PI * 2);
          c.fill();

          c.fillStyle = '#2563EB';
          c.font = '800 11px ' + HAND_FONT;
          c.fillText('すみません', 16, 22);

        } else if (pose === 3) {
          // 姿勢 3：紫褲武術高側踢
          c.fillStyle = skin;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(42, 53, 14, 14, -0.2, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.beginPath();
          c.moveTo(30, 48);
          c.lineTo(20, 39);
          c.moveTo(54, 49);
          c.lineTo(64, 41);
          c.stroke();

          c.fillStyle = purple;
          c.beginPath();
          c.moveTo(30, 60);
          c.lineTo(54, 57);
          c.lineTo(82, 43);
          c.lineTo(85, 52);
          c.lineTo(52, 69);
          c.lineTo(44, 86);
          c.lineTo(34, 86);
          c.closePath();
          c.fill();
          c.stroke();

          drawKatana(c, 31, 61, -0.5);
          drawPigHead(c, 40, 29, 0.9, 'normal');

        } else if (pose === 4) {
          // 姿勢 4：深情捧著鮮紅玫瑰
          c.fillStyle = skin;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(48, 55, 16, 15, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = purple;
          c.beginPath();
          c.moveTo(33, 60);
          c.lineTo(63, 60);
          c.lineTo(61, 83);
          c.lineTo(51, 83);
          c.lineTo(48, 71);
          c.lineTo(45, 83);
          c.lineTo(35, 83);
          c.closePath();
          c.fill();
          c.stroke();

          drawKatana(c, 33, 62, -0.4);
          drawPigHead(c, 48, 30, 0.92, 'normal');

          c.strokeStyle = '#16A34A';
          c.lineWidth = 3;
          c.beginPath();
          c.moveTo(46, 64);
          c.lineTo(60, 46);
          c.stroke();

          c.fillStyle = '#22C55E';
          c.beginPath();
          c.ellipse(57, 56, 5, 2.5, 0.4, 0, Math.PI * 2);
          c.fill();

          c.fillStyle = '#E11D48';
          c.strokeStyle = ink;
          c.lineWidth = 1.8;
          c.beginPath();
          c.arc(61, 44, 7, 0, Math.PI * 2);
          c.fill();
          c.stroke();

        } else if (pose === 5) {
          // 姿勢 5：紫色圓點睡衣睡帽抱枕頭
          c.fillStyle = purple;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(48, 58, 17, 18, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = '#FFFFFF';
          c.beginPath();
          c.arc(42, 54, 2.2, 0, Math.PI * 2);
          c.arc(54, 62, 2.2, 0, Math.PI * 2);
          c.arc(44, 68, 2.2, 0, Math.PI * 2);
          c.fill();

          drawPigHead(c, 48, 33, 0.88, 'sleepy');

          c.fillStyle = purple;
          c.strokeStyle = ink;
          c.lineWidth = 2.2;
          c.beginPath();
          c.moveTo(31, 22);
          c.quadraticCurveTo(48, 4, 68, 18);
          c.lineTo(63, 24);
          c.closePath();
          c.fill();
          c.stroke();
          c.fillStyle = '#FFFFFF';
          c.beginPath();
          c.arc(70, 19, 4, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.fillStyle = '#FFFDF9';
          c.beginPath();
          c.ellipse(72, 62, 11, 14, 0.25, 0, Math.PI * 2);
          c.fill();
          c.stroke();

        } else if (pose === 6) {
          // 姿勢 6：風衣禮帽墨鏡偵探
          c.fillStyle = '#E5E7EB';
          c.strokeStyle = ink;
          c.lineWidth = 2.3;
          c.beginPath();
          c.moveTo(33, 42);
          c.lineTo(27, 79);
          c.lineTo(69, 79);
          c.lineTo(63, 42);
          c.closePath();
          c.fill();
          c.stroke();

          c.fillStyle = purple;
          c.fillRect(36, 79, 8, 6);
          c.fillRect(52, 79, 8, 6);

          drawPigHead(c, 48, 31, 0.88, 'normal');

          c.fillStyle = '#111827';
          c.fillRect(34, 26, 12, 6);
          c.fillRect(50, 26, 12, 6);
          c.strokeStyle = '#111827';
          c.lineWidth = 2;
          c.beginPath();
          c.moveTo(46, 28);
          c.lineTo(50, 28);
          c.stroke();

          c.fillStyle = '#6B7280';
          c.strokeStyle = ink;
          c.lineWidth = 2.2;
          c.beginPath();
          c.ellipse(48, 20, 25, 5, 0, 0, Math.PI * 2);
          c.fill();
          c.stroke();
          c.beginPath();
          c.arc(48, 18, 14, Math.PI, 0);
          c.fill();
          c.stroke();

        } else if (pose === 7) {
          // 姿勢 7：開心跳躍撒粉紅愛心
          c.fillStyle = skin;
          c.strokeStyle = ink;
          c.lineWidth = 2.4;
          c.beginPath();
          c.ellipse(46, 53, 15, 14, -0.1, 0, Math.PI * 2);
          c.fill();
          c.stroke();

          c.beginPath();
          c.moveTo(32, 47);
          c.lineTo(22, 37);
          c.moveTo(60, 48);
          c.lineTo(70, 39);
          c.stroke();

          c.fillStyle = purple;
          c.beginPath();
          c.moveTo(32, 58);
          c.lineTo(60, 58);
          c.lineTo(65, 81);
          c.lineTo(54, 82);
          c.lineTo(46, 70);
          c.lineTo(36, 82);
          c.lineTo(27, 78);
          c.closePath();
          c.fill();
          c.stroke();

          drawKatana(c, 32, 59, -0.45);
          drawPigHead(c, 45, 29, 0.9, 'normal');

          c.fillStyle = '#EC4899';
          c.beginPath();
          c.arc(73, 21, 3.5, 0, Math.PI * 2);
          c.arc(78, 21, 3.5, 0, Math.PI * 2);
          c.moveTo(70, 23);
          c.lineTo(75.5, 30);
          c.lineTo(81, 23);
          c.fill();

          c.beginPath();
          c.arc(20, 22, 2.5, 0, Math.PI * 2);
          c.arc(24, 22, 2.5, 0, Math.PI * 2);
