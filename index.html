<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手繪小幫手陣型秀時鐘</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=SetoFont&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-paper: #fbf7ef;
      --bg-dot: #e8decb;
      --ink: #24201e;
      --accent-red: #c85a5b;
      --accent-warm: #e6a15c;
      --card-bg: rgba(255, 252, 246, 0.86);
      --hand-font: "SetoFont", "Zen Maru Gothic", "DFKai-SB", cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-paper);
      background-image:
        radial-gradient(var(--bg-dot) 1.35px, transparent 1.35px),
        radial-gradient(rgba(200, 90, 91, 0.08) 1px, transparent 1px);
      background-size: 28px 28px, 56px 56px;
      background-position: 0 0, 14px 14px;
      font-family: var(--hand-font);
      color: var(--ink);
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #sceneCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
    }

    .hud-top {
      position: fixed;
      top: 16px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
      gap: 12px;
    }

    .badge {
      pointer-events: auto;
      background: var(--card-bg);
      border: 2.5px solid var(--ink);
      border-radius: 18px 22px 16px 24px / 22px 16px 24px 18px;
      padding: 8px 14px;
      box-shadow: 3px 4px 0 rgba(36, 32, 30, 0.14);
      font-size: clamp(13px, 1.8vw, 16px);
      line-height: 1.35;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill {
      pointer-events: auto;
      font-family: var(--hand-font);
      font-size: clamp(13px, 1.8vw, 16px);
      background: var(--card-bg);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      box-shadow: 3px 4px 0 rgba(36, 32, 30, 0.15);
      transition: transform 0.14s ease, background-color 0.14s ease;
    }

    .btn-pill:hover {
      background: #fff3dc;
      transform: translateY(-1px) rotate(-0.8deg);
    }

    .btn-pill:active {
      transform: translateY(2px);
      box-shadow: 1px 2px 0 rgba(36, 32, 30, 0.15);
    }

    .status-chip {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 2px solid var(--ink);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: clamp(13px, 1.7vw, 15px);
      box-shadow: 2px 3px 0 rgba(36, 32, 30, 0.12);
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div class="hud-top">
      <div class="badge">
        <span>🎨 手繪陣型秀時鐘</span>
        <span id="clockReadout">--:--:--</span>
      </div>
      <button id="toggleShowBtn" class="btn-pill" type="button">✨ 點擊中央冒號或按此啟動陣型秀</button>
    </div>

    <canvas id="sceneCanvas"></canvas>

    <div id="statusChip" class="status-chip">
      提示：點擊中央冒號啟動 5 秒陣型秀；陣型秀期間再次點擊可立刻跳回時間！
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("sceneCanvas");
      const ctx = canvas.getContext("2d");
      const clockReadout = document.getElementById("clockReadout");
      const statusChip = document.getElementById("statusChip");
      const toggleShowBtn = document.getElementById("toggleShowBtn");

      const SHOW_DURATION = 5000; // 需求2：6.5秒改為5秒
      const HELPER_COUNT = 36;    // 需求1：出動更多小幫手提高精細度
      const CHARACTERS = ["shinchan", "himawari", "shiro", "ashan", "buriburizaemon", "star"];

      const DIGIT_PATTERNS = {
        "0": [
          "01110",
          "10001",
          "10011",
          "10101",
          "11001",
          "10001",
          "01110"
        ],
        "1": [
          "00100",
          "01100",
          "10100",
          "00100",
          "00100",
          "00100",
          "11111"
        ],
        "2": [
          "01110",
          "10001",
          "00001",
          "00110",
          "01000",
          "10000",
          "11111"
        ],
        "3": [
          "11110",
          "00001",
          "00001",
          "01110",
          "00001",
          "00001",
          "11110"
        ],
        "4": [
          "00010",
          "00110",
          "01010",
          "10010",
          "11111",
          "00010",
          "00010"
        ],
        "5": [
          "11111",
          "10000",
          "11110",
          "00001",
          "00001",
          "10001",
          "01110"
        ],
        "6": [
          "01110",
          "10000",
          "11110",
          "10001",
          "10001",
          "10001",
          "01110"
        ],
        "7": [
          "11111",
          "00001",
          "00010",
          "00100",
          "01000",
          "01000",
          "01000"
        ],
        "8": [
          "01110",
          "10001",
          "10001",
          "01110",
          "10001",
          "10001",
          "01110"
        ],
        "9": [
          "01110",
          "10001",
          "10001",
          "01111",
          "00001",
          "00001",
          "01110"
        ]
      };

      let width = window.innerWidth;
      let height = window.innerHeight;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);

      // 陣型秀狀態：'idle' | 'showing' | 'exiting'
      let showState = "idle";
      let showStartTime = 0;
      let exitStartTime = 0;
      let exitType = null; // 'spin_jet' | 'spiral_burst' | 'wave_run' | 'shrink_pop'
      let colonHitbox = { x: 0, y: 0, r: 44 };
      let lastColonStr = "";

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resize);
      resize();

      function formatTimeStr(date) {
        const hh = String(date.getHours()).padStart(2, "0");
        const mm = String(date.getMinutes()).padStart(2, "0");
        const ss = String(date.getSeconds()).padStart(2, "0");
        return `${hh}:${mm}:${ss}`;
      }

      function computeClockTargets(timeStr) {
        const chars = timeStr.split(""); // H,H,:,M,M,:,S,S
        const cellSize = Math.max(11, Math.min(width / 54, height / 14, 24));
        const digitW = cellSize * 5;
        const digitH = cellSize * 7;
        const gapDigit = cellSize * 1.1;
        const gapColon = cellSize * 1.5;

        let totalW = 0;
        chars.forEach((ch) => {
          totalW += ch === ":" ? cellSize * 1.6 : digitW;
          totalW += ch === ":" ? gapColon : gapDigit;
        });
        totalW -= gapDigit;

        let curX = (width - totalW) * 0.5;
        const topY = (height - digitH) * 0.5;
        const points = [];
        let centerColonX = width * 0.5;
        let centerColonY = height * 0.5;

        chars.forEach((ch, idx) => {
          if (ch === ":") {
            const cx = curX + cellSize * 0.8;
            const cy1 = topY + cellSize * 2.2;
            const cy2 = topY + cellSize * 4.8;
            points.push({ x: cx, y: cy1, isColon: true });
            points.push({ x: cx, y: cy2, isColon: true });
            if (idx === 2) {
              centerColonX = cx;
              centerColonY = (cy1 + cy2) * 0.5;
            }
            curX += cellSize * 1.6 + gapColon;
          } else {
            const pat = DIGIT_PATTERNS[ch] || DIGIT_PATTERNS["0"];
            for (let r = 0; r < pat.length; r++) {
              for (let c = 0; c < pat[r].length; c++) {
                if (pat[r][c] === "1") {
                  points.push({
                    x: curX + (c + 0.5) * cellSize,
                    y: topY + (r + 0.5) * cellSize,
                    isColon: false
                  });
                }
              }
            }
            curX += digitW + gapDigit;
          }
        });

        colonHitbox = {
          x: centerColonX,
          y: centerColonY,
          r: Math.max(38, cellSize * 2.6)
        };

        return points;
      }

      // 精細化陣型生成器（支援多點取樣讓輪廓更飽滿）
      function sampleFormation(formationIndex, count, elapsedSec) {
        const cx = width * 0.5;
        const cy = height * 0.5;
        const scale = Math.min(width, height) * 0.28;
        const pts = [];

        if (formationIndex === 0) {
          // 陣型 1：立體手繪大愛心（雙層輪廓）
          for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const layer = i % 2 === 0 ? 1 : 0.72;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(
              13 * Math.cos(t) -
              5 * Math.cos(2 * t) -
              2 * Math.cos(3 * t) -
              Math.cos(4 * t)
            );
            pts.push({
              x: cx + (hx / 17) * scale * 1.15 * layer,
              y: cy + (hy / 17) * scale * 1.15 * layer - scale * 0.08
            });
          }
        } else if (formationIndex === 1) {
          // 陣型 2：雙心交錯陣型
          for (let i = 0; i < count; i++) {
            const isLeft = i % 2 === 0;
            const localIdx = Math.floor(i / 2);
            const localTotal = Math.max(1, Math.floor(count / 2));
            const t = (localIdx / localTotal) * Math.PI * 2;
            const subScale = scale * 0.62;
            const offsetX = isLeft ? -scale * 0.58 : scale * 0.58;
            const offsetY = isLeft ? -scale * 0.06 : scale * 0.08;
            const hx = 16 * Math.pow(Math.sin(t), 3);
            const hy = -(
              13 * Math.cos(t) -
              5 * Math.cos(2 * t) -
              2 * Math.cos(3 * t) -
              Math.cos(4 * t)
            );
            pts.push({
              x: cx + offsetX + (hx / 17) * subScale,
              y: cy + offsetY + (hy / 17) * subScale
            });
          }
        } else {
          // 陣型 3：歡樂波浪拱門＋星星環繞
          const archCount = Math.floor(count * 0.72);
          for (let i = 0; i < count; i++) {
            if (i < archCount) {
              const ratio = archCount === 1 ? 0.5 : i / (archCount - 1);
              const px = cx + (ratio - 0.5) * scale * 2.2;
              const wave = Math.sin(ratio * Math.PI) * scale * 0.75 + Math.sin(ratio * Math.PI * 3 + elapsedSec * 5) * 14;
              pts.push({
                x: px,
                y: cy + scale * 0.25 - wave
              });
            } else {
              const sIdx = i - archCount;
              const sTotal = Math.max(1, count - archCount);
              const angle = (sIdx / sTotal) * Math.PI * 2 + elapsedSec * 1.4;
              pts.push({
                x: cx + Math.cos(angle) * scale * 1.18,
                y: cy + Math.sin(angle) * scale * 0.72
              });
            }
          }
        }

        return pts;
      }

      class Helper {
        constructor(index) {
          this.index = index;
          this.charType = CHARACTERS[index % CHARACTERS.length];
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.vx = 0;
          this.vy = 0;
          this.rotation = 0;
          this.scale = 1;
          this.alpha = 1;
          this.wobblePhase = Math.random() * Math.PI * 2;
          this.size = Math.max(22, Math.min(width, height) * 0.036);

          // 退場專用暫存狀態
          this.exitInit = false;
          this.startX = this.x;
          this.startY = this.y;
          this.dirX = index % 2 === 0 ? -1 : 1;
          this.burstAngle = (index / HELPER_COUNT) * Math.PI * 2;
        }

        resetExitState() {
          this.exitInit = false;
          this.rotation = 0;
          this.scale = 1;
          this.alpha = 1;
        }

        update(now, targetPt, dt) {
          this.wobblePhase += dt * 7.5;

          if (showState === "idle") {
            const spring = 11;
            const damping = 0.82;
            const ax = (targetPt.x - this.x) * spring;
            const ay = (targetPt.y - this.y) * spring;
            this.vx = (this.vx + ax * dt) * damping;
            this.vy = (this.vy + ay * dt) * damping;
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.rotation = Math.sin(this.wobblePhase * 0.6) * 0.08;
            this.scale = 1 + Math.sin(this.wobblePhase * 0.5) * 0.03;
            this.alpha = 1;
          } else if (showState === "showing") {
            const spring = 9.5;
            const damping = 0.83;
            const jitterX = Math.cos(this.wobblePhase * 0.8) * 3.5;
            const jitterY = Math.sin(this.wobblePhase) * 4.5;
            const ax = (targetPt.x + jitterX - this.x) * spring;
            const ay = (targetPt.y + jitterY - this.y) * spring;
            this.vx = (this.vx + ax * dt) * damping;
            this.vy = (this.vy + ay * dt) * damping;
            this.x += this.vx * dt;
            this.y += this.vy * dt;
            this.rotation = Math.sin(this.wobblePhase) * 0.14;
            this.scale = 1.06 + Math.sin(this.wobblePhase * 0.9) * 0.05;
            this.alpha = 1;
          } else if (showState === "exiting") {
            this.updateExit(now - exitStartTime, dt);
          }
        }

        updateExit(elapsedMs, dt) {
          if (!this.exitInit) {
            this.exitInit = true;
            this.startX = this.x;
            this.startY = this.y;
            this.dirX = this.x < width * 0.5 ? -1 : 1;
          }

          // (4) 使用者中途點擊跳回時間：原地縮水變小消失／回鍋
          if (exitType === "shrink_pop") {
            const dur = 320;
            const p = Math.min(1, elapsedMs / dur);
            const easeIn = p * p;
            this.scale = Math.max(0.001, 1 - easeIn);
            this.alpha = Math.max(0, 1 - p);
            this.rotation += dt * 8;
            if (p >= 1) {
              finishExitToClock();
            }
            return;
          }

          // (1) 集體轉圈後向兩側噴射退場
          if (exitType === "spin_jet") {
            const spinDur = 450; // 0.45 秒內轉 360 度並微微放大
            const totalDur = 950;
            if (elapsedMs < spinDur) {
              const p = elapsedMs / spinDur;
              this.rotation = p * Math.PI * 2;
              this.scale = 1 + Math.sin(p * Math.PI) * 0.25;
            } else {
              const jetP = Math.min(1, (elapsedMs - spinDur) / (totalDur - spinDur));
              const accel = jetP * jetP * 1450;
              this.x += this.dirX * accel * dt;
              this.y += Math.sin(jetP * Math.PI) * this.dirX * 140 * dt;
              this.rotation = Math.PI * 2 + this.dirX * jetP * 1.4;
              this.scale = 1.08;
              this.alpha = Math.max(0, 1 - Math.pow(jetP, 2.2));
            }
            if (elapsedMs >= totalDur) {
              finishExitToClock();
            }
            return;
          }

          // (2) 螺旋擴散／炸開後分流離場
          if (exitType === "spiral_burst") {
            const burstDur = 360;
            const totalDur = 1000;
            const centerX = width * 0.5;
            const centerY = height * 0.5;
            if (elapsedMs < burstDur) {
              const p = elapsedMs / burstDur;
              const easeOut = 1 - Math.pow(1 - p, 2);
              const radius = 95 * easeOut;
              const angle = this.burstAngle + p * 0.9;
              this.x = this.startX + Math.cos(angle) * radius * 0.55 + (this.startX - centerX) * 0.14 * easeOut;
              this.y = this.startY + Math.sin(angle) * radius * 0.55 + (this.startY - centerY) * 0.14 * easeOut;
              this.rotation = p * 1.5;
              this.scale = 1 + easeOut * 0.18;
            } else {
              const slideP = Math.min(1, (elapsedMs - burstDur) / (totalDur - burstDur));
              this.x += this.dirX * (420 + slideP * 950) * dt;
              this.y += Math.cos(this.burstAngle + slideP * 3) * 180 * dt;
              this.rotation += this.dirX * dt * 6;
              this.alpha = Math.max(0, 1 - Math.pow(slideP, 1.8));
            }
            if (elapsedMs >= totalDur) {
              finishExitToClock();
            }
            return;
          }

          // (3) 排隊波浪跳躍後退場
          if (exitType === "wave_run") {
            const orderDelay = this.index * 24;
            const hopDur = 320;
            const runStart = orderDelay + hopDur;
            const totalDur = runStart + 560;
            const localT = elapsedMs - orderDelay;

            if (localT < 0) {
              this.rotation = Math.sin(this.wobblePhase) * 0.06;
            } else if (localT < hopDur) {
              const hp = localT / hopDur;
              const jump = Math.sin(hp * Math.PI) * 34;
              this.y = this.startY - jump;
              this.scale = 1 + Math.sin(hp * Math.PI) * 0.14;
              this.rotation = Math.sin(hp * Math.PI * 2) * 0.22;
            } else {
              const rp = Math.min(1, (elapsedMs - runStart) / 560);
              this.x += this.dirX * (520 + rp * 680) * dt;
              this.y = this.startY + Math.abs(Math.sin(rp * Math.PI * 5)) * -12;
              this.rotation = Math.sin(rp * Math.PI * 6) * 0.18;
              this.alpha = Math.max(0, 1 - Math.pow(rp, 2));
            }

            if (elapsedMs >= totalDur) {
              finishExitToClock();
            }
          }
        }

        draw() {
          if (this.alpha <= 0.01 || this.scale <= 0.01) return;
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation);
          ctx.scale(this.scale, this.scale);
          ctx.globalAlpha = this.alpha;

          const s = this.size;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = Math.max(2.2, s * 0.11);
          ctx.strokeStyle = "#24201e";

          if (this.charType === "shinchan") {
            // 小新：圓潤臉龐、粗濃眉毛、大圓眼、小嘴、耳朵
            ctx.fillStyle = "#fffdf8";
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 0.92, s * 0.76, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 耳朵
            ctx.beginPath();
            ctx.ellipse(s * 0.88, s * 0.06, s * 0.2, s * 0.28, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(s * 0.82, s * 0.05);
            ctx.lineTo(s * 0.94, s * 0.1);
            ctx.stroke();

            // 粗眉
            ctx.strokeStyle = "#24201e";
            ctx.lineWidth = Math.max(3, s * 0.15);
            ctx.beginPath();
            ctx.roundRect(-s * 0.56, -s * 0.44, s * 0.46, s * 0.2, s * 0.1);
            ctx.roundRect(s * 0.06, -s * 0.44, s * 0.46, s * 0.2, s * 0.1);
            ctx.stroke();

            // 眼睛與紅腮紅
            ctx.lineWidth = Math.max(2, s * 0.09);
            ctx.fillStyle = "#24201e";
            ctx.beginPath();
            ctx.arc(-s * 0.34, -s * 0.04, s * 0.11, 0, Math.PI * 2);
            ctx.arc(s * 0.28, -s * 0.04, s * 0.13, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "rgba(218, 96, 102, 0.45)";
            ctx.beginPath();
            ctx.ellipse(-s * 0.52, s * 0.14, s * 0.13, s * 0.08, 0, 0, Math.PI * 2);
            ctx.ellipse(s * 0.52, s * 0.14, s * 0.13, s * 0.08, 0, 0, Math.PI * 2);
            ctx.fill();

            // 嘟嘴
            ctx.strokeStyle = "#24201e";
            ctx.fillStyle = "#fffdf8";
            ctx.beginPath();
            ctx.arc(-s * 0.18, s * 0.38, s * 0.12, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
          } else if (this.charType === "himawari") {
            // 小葵：捲捲頭髮、紅潤圓眼、可愛小臉
            ctx.fillStyle = "#fffdf8";
            ctx.beginPath();
            ctx.ellipse(0, s * 0.08, s * 0.85, s * 0.7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 捲髮
            ctx.strokeStyle = "#24201e";
            ctx.lineWidth = Math.max(2.6, s * 0.12);
            ctx.beginPath();
            ctx.arc(-s * 0.42, -s * 0.48, s * 0.28, Math.PI * 0.4, Math.PI * 1.85);
            ctx.arc(-s * 0.05, -s * 0.44, s * 0.24, Math.PI * 0.6, Math.PI * 1.9);
            ctx.arc(s * 0.32, -s * 0.36, s * 0.22, Math.PI * 0.8, Math.PI * 1.95);
            ctx.stroke();

            // 紅棕圈眼
            ctx.strokeStyle = "#b85458";
            ctx.lineWidth = Math.max(2.4, s * 0.11);
            ctx.beginPath();
            ctx.arc(-s * 0.3, s * 0.02, s * 0.15, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(s * 0.24, s * 0.02, s * 0.17, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(224, 110, 120, 0.45)";
            ctx.beginPath();
            ctx.arc(-s * 0.48, s * 0.22, s * 0.11, 0, Math.PI * 2);
            ctx.arc(s * 0.46, s * 0.22, s * 0.11, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.charType === "shiro") {
            // 小白：蓬鬆白毛團、黑圓豆眼與黑鼻頭
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(-s * 0.32, -s * 0.15, s * 0.42, 0, Math.PI * 2);
            ctx.arc(s * 0.32, -s * 0.15, s * 0.42, 0, Math.PI * 2);
            ctx.ellipse(0, s * 0.08, s * 0.82, s * 0.64, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#24201e";
            ctx.beginPath();
            ctx.arc(-s * 0.26, -s * 0.04, s * 0.1, 0, Math.PI * 2);
            ctx.arc(s * 0.26, -s * 0.04, s * 0.1, 0, Math.PI * 2);
            ctx.ellipse(0, s * 0.16, s * 0.14, s * 0.1, 0, 0, Math.PI * 2);
            ctx.fill();
          } else if (this.charType === "ashan") {
            // 鱷魚山先生（阿山）：長吻、雙眼、整齊牙齒與紅眼線
            ctx.fillStyle = "#fffdf8";
            ctx.beginPath();
            ctx.moveTo(-s * 0.92, -s * 0.05);
            ctx.quadraticCurveTo(-s * 0.95, -s * 0.34, -s * 0.55, -s * 0.32);
            ctx.lineTo(-s * 0.15, -s * 0.32);
            ctx.arc(-s * 0.08, -s * 0.42, s * 0.25, Math.PI * 0.8, Math.PI * 2.15);
            ctx.arc(s * 0.32, -s * 0.42, s * 0.25, Math.PI * 0.85, Math.PI * 2.15);
            ctx.quadraticCurveTo(s * 0.92, -s * 0.32, s * 0.9, s * 0.18);
            ctx.quadraticCurveTo(s * 0.88, s * 0.55, s * 0.45, s * 0.55);
            ctx.lineTo(-s * 0.72, s * 0.55);
            ctx.quadraticCurveTo(-s * 0.92, s * 0.52, -s * 0.88, s * 0.3);
            ctx.lineTo(s * 0.35, s * 0.3);
            ctx.quadraticCurveTo(s * 0.52, s * 0.3, s * 0.52, s * 0.12);
            ctx.quadraticCurveTo(s * 0.52, -s * 0.05, s * 0.3, -s * 0.05);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 紅眼線與眼珠
            ctx.strokeStyle = "#b85458";
            ctx.fillStyle = "#b85458";
            ctx.lineWidth = Math.max(2, s * 0.09);
            ctx.beginPath();
            ctx.moveTo(-s * 0.25, -s * 0.42);
            ctx.lineTo(s * 0.48, -s * 0.36);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(-s * 0.08, -s * 0.33, s * 0.08, 0, Math.PI * 2);
            ctx.arc(s * 0.32, -s * 0.33, s * 0.08, 0, Math.PI * 2);
            ctx.fill();

            // 齒列
            ctx.strokeStyle = "#24201e";
            for (let tx = -s * 0.52; tx <= s * 0.28; tx += s * 0.2) {
              ctx.beginPath();
              ctx.moveTo(tx, s * 0.02);
              ctx.lineTo(tx, s * 0.52);
              ctx.stroke();
            }
          } else if (this.charType === "buriburizaemon") {
            // 肥嘟嘟左衛門：小豬耳朵、圓鼻、紅腮紅與眼圈
            ctx.fillStyle = "#fffdf8";
            ctx.beginPath();
            ctx.ellipse(0, 0, s * 0.85, s * 0.68, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 小豬耳
            ctx.beginPath();
            ctx.moveTo(-s * 0.62, -s * 0.42);
            ctx.lineTo(-s * 0.48, -s * 0.78);
            ctx.lineTo(-s * 0.22, -s * 0.56);
            ctx.moveTo(s * 0.62, -s * 0.42);
            ctx.lineTo(s * 0.48, -s * 0.78);
            ctx.lineTo(s * 0.22, -s * 0.56);
            ctx.fill();
            ctx.stroke();

            // 眼圈與腮紅
            ctx.strokeStyle = "#b85458";
            ctx.fillStyle = "#b85458";
            ctx.lineWidth = Math.max(2, s * 0.09);
            ctx.beginPath();
            ctx.ellipse(-s * 0.34, -s * 0.16, s * 0.22, s * 0.1, -0.1, 0, Math.PI * 2);
            ctx.ellipse(s * 0.34, -s * 0.16, s * 0.22, s * 0.1, 0.1, 0, Math.PI * 2);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(-s * 0.44, s * 0.08, s * 0.1, 0, Math.PI * 2);
            ctx.arc(s * 0.44, s * 0.08, s * 0.09, 0, Math.PI * 2);
            ctx.fill();

            // 大豬鼻
            ctx.strokeStyle = "#24201e";
            ctx.fillStyle = "#fffdf8";
            ctx.beginPath();
            ctx.roundRect(-s * 0.52, s * 0.14, s * 1.04, s * 0.44, s * 0.22);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#24201e";
            ctx.beginPath();
            ctx.arc(-s * 0.22, s * 0.36, s * 0.08, 0, Math.PI * 2);
            ctx.arc(s * 0.22, s * 0.36, s * 0.08, 0, Math.PI * 2);
            ctx.fill();
          } else {
            // 小幫手星形夥伴：為陣型增加亮點與精細度
            ctx.fillStyle = "#ffe699";
            const spikes = 5;
            const outerR = s * 0.75;
            const innerR = s * 0.36;
            ctx.beginPath();
            for (let i = 0; i < spikes * 2; i++) {
              const r = i % 2 === 0 ? outerR : innerR;
              const a = (i * Math.PI) / spikes - Math.PI / 2;
              const px = Math.cos(a) * r;
              const py = Math.sin(a) * r;
              if (i === 0) ctx.moveTo(px, py);
              else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = "#24201e";
            ctx.beginPath();
            ctx.arc(-s * 0.14, -s * 0.02, s * 0.07, 0, Math.PI * 2);
            ctx.arc(s * 0.14, -s * 0.02, s * 0.07, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      }

      const helpers = Array.from({ length: HELPER_COUNT }, (_, i) => new Helper(i));

      function updateStatusUI() {
        if (showState === "idle") {
          toggleShowBtn.textContent = "✨ 點擊中央冒號或按此啟動 5 秒陣型秀";
          statusChip.textContent = "提示：點擊中央冒號啟動 5 秒陣型秀；秀進行中點擊可立刻跳回時間！";
        } else if (showState === "showing") {
          toggleShowBtn.textContent = "⏱️ 陣型秀進行中（5秒）— 點擊可立刻跳回時間";
          statusChip.textContent = "陣型秀演出中（5 秒）！再次點擊畫面或冒號即可立刻跳回時間顯示。";
        } else if (showState === "exiting") {
          const labels = {
            spin_jet: "退場橋段：集體轉圈後向兩側噴射退場！",
            spiral_burst: "退場橋段：螺旋擴散／炸開後分流離場！",
            wave_run: "退場橋段：排隊波浪跳躍後退場！",
            shrink_pop: "提前跳回時間：原地縮水變小消失／回鍋！"
          };
          toggleShowBtn.textContent = "🎬 退場橋段演出中...";
          statusChip.textContent = labels[exitType] || "退場中...";
        }
      }

      // 啟動 5 秒陣型秀
      function triggerHeartDuetShow() {
        if (showState === "showing") {
          // 再次點擊時，中途觸碰跳回時間顯示（使用縮水變小退場）
          interruptToClock();
          return;
        }
        showState = "showing";
        showStartTime = performance.now();
        exitType = null;
        helpers.forEach((h) => h.resetExitState());
        updateStatusUI();
      }

      // 中途點擊跳回時間顯示（橋段 4：原地縮水變小消失／回鍋）
      function interruptToClock() {
        if (showState === "idle") return;
        showState = "exiting";
        exitType = "shrink_pop";
        exitStartTime = performance.now();
        helpers.forEach((h) => {
          h.exitInit = false;
        });
        updateStatusUI();
      }

      // 5 秒自然結束後，從 (1)(2)(3) 隨機挑一種退場橋段
      function beginRandomNaturalExit() {
        const choices = ["spin_jet", "spiral_burst", "wave_run"];
        exitType = choices[Math.floor(Math.random() * choices.length)];
        showState = "exiting";
        exitStartTime = performance.now();
        helpers.forEach((h) => {
          h.exitInit = false;
        });
        updateStatusUI();
      }

      function finishExitToClock() {
        showState = "idle";
        exitType = null;
        helpers.forEach((h) => {
          h.resetExitState();
        });
        updateStatusUI();
      }

      canvas.addEventListener("pointerdown", (e) => {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;

        if (showState === "showing") {
          // 陣型秀期間任何點擊皆可中途跳回時間顯示
          interruptToClock();
          return;
        }

        if (showState === "idle") {
          const dx = px - colonHitbox.x;
          const dy = py - colonHitbox.y;
          const dist = Math.hypot(dx, dy);
          if (dist <= colonHitbox.r * 1.35) {
            triggerHeartDuetShow();
          } else {
            // 點擊其他位置也可輕快觸發陣型秀，方便操作
            triggerHeartDuetShow();
          }
        }
      });

      toggleShowBtn.addEventListener("click", () => {
        if (showState === "showing") {
          interruptToClock();
        } else if (showState === "idle") {
          triggerHeartDuetShow();
        }
      });

      function drawColonHighlight(now) {
        if (showState !== "idle") return;
        const pulse = 1 + Math.sin(now * 0.005) * 0.08;
        ctx.save();
        ctx.strokeStyle = "rgba(200, 90, 91, 0.35)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.arc(colonHitbox.x, colonHitbox.y, colonHitbox.r * 0.72 * pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function drawProgressBar(now) {
        if (showState !== "showing") return;
        const elapsed = now - showStartTime;
        const remainRatio = Math.max(0, 1 - elapsed / SHOW_DURATION);
        const barW = Math.min(260, width * 0.45);
        const barH = 10;
        const bx = (width - barW) * 0.5;
        const by = height - 56;

        ctx.save();
        ctx.fillStyle = "rgba(255, 252, 246, 0.9)";
        ctx.strokeStyle = "#24201e";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(bx, by, barW, barH, 6);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#c85a5b";
        ctx.beginPath();
        ctx.roundRect(bx + 2, by + 2, Math.max(0, (barW - 4) * remainRatio), barH - 4, 4);
        ctx.fill();
        ctx.restore();
      }

      let lastFrameTime = performance.now();

      function loop(now) {
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        const nowDate = new Date();
        const timeStr = formatTimeStr(nowDate);
        if (timeStr !== lastColonStr) {
          lastColonStr = timeStr;
          clockReadout.textContent = timeStr;
        }

        if (showState === "showing" && now - showStartTime >= SHOW_DURATION) {
          beginRandomNaturalExit();
        }

        const clockTargets = computeClockTargets(timeStr);
        let formationTargets = null;

        if (showState === "showing") {
          const elapsed = now - showStartTime;
          // 5 秒內切換 3 種陣型（約每 1.67 秒換一種）
          const formationIdx = Math.min(2, Math.floor((elapsed / SHOW_DURATION) * 3));
          formationTargets = sampleFormation(formationIdx, HELPER_COUNT, elapsed / 1000);
        }

        ctx.clearRect(0, 0, width, height);
        drawColonHighlight(now);

        for (let i = 0; i < helpers.length; i++) {
          const h = helpers[i];
          const target =
            showState === "showing" && formationTargets
              ? formationTargets[i % formationTargets.length]
              : clockTargets[i % clockTargets.length];

          h.update(now, target, dt);
          h.draw();
        }

        drawProgressBar(now);
        requestAnimationFrame(loop);
      }

      updateStatusUI();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
