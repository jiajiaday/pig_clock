<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FDF6EC" id="metaTheme" />
  <title>不理不理左衛門時鐘</title>
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preload" href="clock-pigs/jf-openhuninn-2.0.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* 1. 真正的瀨戶字體（SetoFont，含數字 0-9、標點與日文/基本漢字） */
    @font-face {
      font-family: "SetoFontReal";
      src:
        local("SetoFont"),
        local("SetoFont-SP"),
        local("瀬戸フォント"),
        url("clock-pigs/SetoFont.woff2") format("woff2"),
        url("clock-pigs/SetoFont.ttf") format("truetype"),
        url("https://cdn.leafscape.be/setofont/setofont_web.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* 2. 內海字體（基於瀨戶字體的繁體中文補字版，補齊「衛、豬」等常用字） */
    @font-face {
      font-family: "NaikaiSetoExt";
      src: url("https://cdn.jsdelivr.net/gh/max32002/naikaifont@1.89/webfont/NaikaiFont-Regular-Lite.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    /* 3. 本機粉圓體離線備援 */
    @font-face {
      font-family: "LocalRoundFallback";
      src: url("clock-pigs/jf-openhuninn-2.0.woff2") format("woff2");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg: #FDF6EC;
      --ink: #3B2318;
      --pill-bg: #FFFAF3;
      --pill-border: #3B2318;
      --modal-bg: #FDF6EC;
      --card-bg: #FFFFFF;
      --accent: #F4B89C;
      --font-round: "SetoFontReal", "NaikaiSetoExt", "SetoFont", "LocalRoundFallback", "jf open 粉圓 2.0", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body.night {
      --bg: #050505;
      --ink: #F5EDE4;
      --pill-bg: rgba(28, 28, 32, 0.94);
      --pill-border: rgba(245, 237, 228, 0.82);
      --modal-bg: #18181B;
      --card-bg: #242429;
      --accent: #D98A6C;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-round);
      letter-spacing: 0.04em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.25s ease, color 0.25s ease;
      touch-action: none;
    }

    #titleTrigger,
    .date-pill,
    .pill-btn,
    #btnShowBar,
    .modal-head h2,
    .section-title,
    .seg-btn,
    .chip,
    .size-btn,
    #modalPreview {
      font-family: var(--font-round);
      -webkit-text-stroke: 0.22px currentColor;
      paint-order: stroke fill;
    }

    #stageRoot {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
      touch-action: none;
    }

    body.force-landscape #stageRoot {
      width: 100vh;
      height: 100vw;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      transform-origin: center center;
    }

    #clockCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
      touch-action: none;
      opacity: 0;
      transition: opacity 0.16s ease-out;
    }

    #clockCanvas.ready {
      opacity: 1;
    }

    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 12px;
      pointer-events: none;
    }

    .top-bar-inner {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 9px;
      max-width: 96vw;
      pointer-events: none;
    }

    #titleTrigger {
      position: relative;
      pointer-events: auto;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 95vw;
      padding: 7px 17px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.5px 2px 2.8px 2.2px;
      border-radius: 26px 11px 24px 13px / 13px 25px 11px 23px;
      background: var(--pill-bg);
      color: var(--ink);
      font-size: 26px;
      font-weight: 700;
      line-height: 1.24;
      letter-spacing: 0.04em;
      cursor: pointer;
      transform: rotate(-0.9deg);
      box-shadow: 3px 4px 0 var(--pill-border);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    #titleTrigger::before {
      content: "";
      position: absolute;
      inset: -3px -2px -2px -3px;
      border: 1.4px solid var(--pill-border);
      border-radius: 13px 25px 12px 24px / 24px 12px 25px 13px;
      opacity: 0.45;
      transform: rotate(1.1deg);
      pointer-events: none;
    }

    #titleTrigger:hover {
      transform: rotate(-0.3deg) translateY(-1px);
      box-shadow: 3.5px 5px 0 var(--pill-border);
    }

    #titleTrigger:active {
      transform: rotate(0deg) translate(2px, 2.5px) scale(0.97);
      box-shadow: 1px 1.5px 0 var(--pill-border);
    }

    .date-pill {
      position: relative;
      pointer-events: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 5px 13px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.2px 1.8px 2.4px 2px;
      border-radius: 12px 23px 13px 21px / 21px 12px 22px 13px;
      background: var(--pill-bg);
      color: var(--ink);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.22;
      letter-spacing: 0.04em;
      cursor: pointer;
      white-space: nowrap;
      transform: rotate(1.15deg);
      box-shadow: 2.5px 3.2px 0 var(--pill-border);
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    .date-pill::before {
      content: "";
      position: absolute;
      inset: -2.5px -2px -2px -2.5px;
      border: 1.2px solid var(--pill-border);
      border-radius: 22px 11px 20px 12px / 11px 21px 12px 20px;
      opacity: 0.42;
      transform: rotate(-1.1deg);
      pointer-events: none;
    }

    .date-pill:hover {
      transform: rotate(0.4deg) translateY(-1px);
      box-shadow: 3px 4px 0 var(--pill-border);
    }

    .date-pill:active {
      transform: rotate(0deg) translate(1.5px, 2px) scale(0.97);
      box-shadow: 1px 1px 0 var(--pill-border);
    }

    #titleIcon,
    #dateIcon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #titleIconImg,
    #dateIconImg {
      display: none;
      width: 32px;
      height: 32px;
      object-fit: contain;
      vertical-align: middle;
    }

    .ctrl-btn-icon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ctrl-btn-img {
      display: inline-block;
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
    }

    .edit-badge {
      font-size: 0.6em;
      opacity: 0.65;
      margin-left: 2px;
      -webkit-text-stroke: 0;
    }

    #bottomBar {
      position: fixed;
      bottom: 10px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 8px;
      pointer-events: none;
    }

    .toolbar-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      max-width: 98vw;
    }

    .pill-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 12px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.3px 1.8px 2.5px 2px;
      border-radius: 21px 9px 19px 11px / 10px 20px 9px 19px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-size: 14.5px;
      line-height: 1.24;
      letter-spacing: 0.04em;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2.5px 3.2px 0 var(--pill-border);
      white-space: nowrap;
      transition: transform 0.12s ease, background-color 0.2s ease, box-shadow 0.12s ease;
    }

    .pill-btn::before {
      content: "";
      position: absolute;
      inset: -2.5px -2px -2px -2.5px;
      border: 1.25px solid var(--pill-border);
      border-radius: 10px 21px 11px 19px / 19px 10px 20px 11px;
      opacity: 0.42;
      transform: rotate(0.95deg);
      pointer-events: none;
    }

    .toolbar-row .pill-btn:nth-child(1) {
      border-radius: 22px 9px 20px 11px / 10px 21px 9px 19px;
      transform: rotate(-0.9deg);
    }

    .toolbar-row .pill-btn:nth-child(2) {
      border-radius: 10px 22px 11px 20px / 20px 10px 22px 11px;
      transform: rotate(0.85deg);
    }

    .toolbar-row .pill-btn:nth-child(3) {
      border-radius: 19px 12px 23px 9px / 11px 19px 10px 22px;
      transform: rotate(-0.65deg);
    }

    .toolbar-row .pill-btn:nth-child(4) {
      border-radius: 11px 20px 9px 22px / 21px 11px 19px 10px;
      transform: rotate(0.95deg);
    }

    .toolbar-row .pill-btn:nth-child(5) {
      border-radius: 23px 10px 18px 12px / 9px 22px 11px 18px;
      transform: rotate(-0.8deg);
    }

    .toolbar-row .pill-btn:nth-child(6) {
      border-radius: 9px 21px 12px 20px / 19px 9px 21px 12px;
      transform: rotate(0.75deg);
    }

    .pill-btn:hover {
      transform: rotate(0deg) translateY(-1px);
      box-shadow: 3px 4.2px 0 var(--pill-border);
    }

    .pill-btn:active {
      transform: rotate(0deg) translate(1.8px, 2.2px) scale(0.96);
      box-shadow: 0.8px 1px 0 var(--pill-border);
    }

    .pill-btn.primary {
      background-color: var(--accent);
      color: #2B1810;
    }

    .hidden {
      display: none !important;
    }

    #btnShowBar {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.3px 1.8px 2.5px 2px;
      border-radius: 21px 9px 19px 11px / 10px 20px 9px 19px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.24;
      letter-spacing: 0.04em;
      font-weight: 700;
      opacity: 0.95;
      cursor: pointer;
      transform: rotate(-1deg);
      box-shadow: 2.5px 3.2px 0 var(--pill-border), 0 4px 10px rgba(0, 0, 0, 0.16);
      transition: opacity 0.2s ease, transform 0.12s ease, box-shadow 0.12s ease;
    }

    #btnShowBar::before {
      content: "";
      position: absolute;
      inset: -2.5px -2px -2px -2.5px;
      border: 1.25px solid var(--pill-border);
      border-radius: 10px 21px 11px 19px / 19px 10px 20px 11px;
      opacity: 0.44;
      transform: rotate(1deg);
      pointer-events: none;
    }

    #btnShowBar:active {
      opacity: 1;
      transform: rotate(0deg) translate(1.5px, 2px) scale(0.96);
      box-shadow: 1px 1px 0 var(--pill-border);
    }

    #titleModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.54);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #titleModal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background-color: var(--modal-bg);
      color: var(--ink);
      font-family: var(--font-round);
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.5px 2px 2.8px 2.2px;
      border-radius: 26px 14px 28px 16px / 15px 26px 14px 25px;
      padding: 16px;
      box-shadow: 4px 5px 0 var(--pill-border), 0 14px 36px rgba(0, 0, 0, 0.3);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      position: relative;
      width: 33px;
      height: 33px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2px 1.6px 2.2px 1.8px;
      border-radius: 14px 8px 15px 9px / 9px 15px 8px 14px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-weight: 700;
      cursor: pointer;
      transform: rotate(1.4deg);
      box-shadow: 1.8px 2.2px 0 var(--pill-border);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .close-btn:active {
      transform: rotate(0deg) translate(1px, 1.5px);
      box-shadow: 0.5px 1px 0 var(--pill-border);
    }

    .section-card {
      margin-bottom: 13px;
      padding: 11px 12px;
      border-radius: 18px 11px 19px 12px / 12px 18px 11px 17px;
      background: rgba(128, 128, 128, 0.06);
      border: 1.4px solid rgba(128, 128, 128, 0.28);
    }

    .section-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .preview-panel {
      background: var(--card-bg);
      border: 1.8px dashed rgba(128, 128, 128, 0.48);
      border-radius: 20px 11px 21px 12px / 12px 20px 11px 19px;
      padding: 10px;
      margin-bottom: 11px;
      text-align: center;
    }

    .preview-tag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.65;
      margin-bottom: 4px;
    }

    #modalPreview {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.25;
      min-height: 36px;
    }

    #previewImg {
      display: inline-block;
      width: 30px;
      height: 30px;
      object-fit: contain;
    }

    #previewDatePill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      font-size: 13px;
      font-weight: 700;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.8px 1.4px 2px 1.5px;
      border-radius: 10px 18px 11px 17px / 17px 10px 18px 11px;
      background: var(--pill-bg);
      box-shadow: 1.6px 2px 0 var(--pill-border);
      margin-left: 4px;
    }

    #previewDateIcon {
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #previewDateImg {
      display: none;
      width: 22px;
      height: 22px;
      object-fit: contain;
      vertical-align: middle;
    }

    .preview-btns-bar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(128, 128, 128, 0.28);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 700;
    }

    .preview-mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.8px 1.4px 2px 1.5px;
      border-radius: 16px 8px 15px 9px / 9px 15px 8px 16px;
      background: var(--pill-bg);
      box-shadow: 1.8px 2.2px 0 var(--pill-border);
    }

    .preview-mini-img {
      display: inline-block;
      width: 19px;
      height: 19px;
      object-fit: contain;
    }

    .field-group {
      margin-bottom: 11px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.16);
    }

    .field-group:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .seg-btn {
      position: relative;
      padding: 8px 10px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2.1px 1.7px 2.3px 1.9px;
      border-radius: 19px 9px 18px 10px / 10px 18px 9px 19px;
      background: var(--card-bg);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 2px 2.8px 0 var(--pill-border);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.1s ease;
    }

    .seg-btn:nth-child(1) {
      transform: rotate(-0.75deg);
    }

    .seg-btn:nth-child(2) {
      border-radius: 9px 19px 10px 18px / 18px 10px 19px 9px;
      transform: rotate(0.75deg);
    }

    .seg-btn:active {
      transform: rotate(0deg) translate(1.2px, 1.8px);
      box-shadow: 0.6px 1px 0 var(--pill-border);
    }

    .seg-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .text-box {
      width: 100%;
      padding: 8px 12px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 2px 1.7px 2.2px 1.8px;
      border-radius: 16px 9px 17px 10px / 10px 16px 9px 15px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-round);
      font-size: 14px;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 7px;
    }

    .chip {
      position: relative;
      padding: 5px 11px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.9px 1.5px 2.1px 1.7px;
      border-radius: 16px 8px 15px 9px / 9px 16px 8px 15px;
      background: var(--card-bg);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1.8px 2.3px 0 var(--pill-border);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.1s ease;
    }

    .chip:nth-child(even) {
      border-radius: 8px 16px 9px 15px / 15px 8px 16px 9px;
    }

    .chip:active {
      transform: translate(1.2px, 1.5px);
      box-shadow: 0.5px 1px 0 var(--pill-border);
    }

    .chip.active {
      background: var(--accent);
      color: #2B1810;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }

    .size-btn {
      padding: 6px 2px;
      border-style: solid;
      border-color: var(--pill-border);
      border-width: 1.8px 1.5px 2px 1.6px;
      border-radius: 14px 8px 13px 9px / 9px 14px 8px 13px;
      background: var(--card-bg);
      color: var(--ink);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 1.4px 2px 0 var(--pill-border);
      transition: transform 0.1s ease, background-color 0.2s ease, box-shadow 0.1s ease;
    }

    .size-btn:nth-child(even) {
      border-radius: 8px 14px 9px 13px / 13px 8px 14px 9px;
    }

    .size-btn:active {
      transform: translate(1px, 1.2px);
      box-shadow: 0.5px 0.5px 0 var(--pill-border);
    }

    .size-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #D97757;
    }

    .sticker-grid {
      display: grid;

          var rx = cx + Math.cos(a) * r * wobble;
          var ry = cy + Math.sin(a) * r * (2 - wobble * 0.96);

            var bgR = 0, bgG = 0, bgB = 0, validCorners = 0;
            var darkCount = 0;
            for (var cIdx = 0; cIdx < corners.length; cIdx++) {
              var cx = corners[cIdx][0], cy = corners[cIdx][1];
              var ci = (cy * rawW + cx) * 4;
              var cr = d[ci], cg = d[ci + 1], cb = d[ci + 2], ca = d[ci + 3];
              if (ca > 20) {
                if (cr + cg + cb < 90) darkCount++;
                bgR += cr;
                bgG += cg;
                bgB += cb;
                validCorners++;
              }
            }

            if (darkCount >= 2) {
              isDarkBg = true;
            } else {
              bgR = validCorners ? bgR / validCorners : 240;
              bgG = validCorners ? bgG / validCorners : 242;
              bgB = validCorners ? bgB / validCorners : 246;

              var minX = rawW, minY = rawH, maxX = -1, maxY = -1;

              for (var y = 0; y < rawH; y++) {
                for (var x = 0; x < rawW; x++) {
                  var idx = (y * rawW + x) * 4;
                  var r = d[idx], g = d[idx + 1], b = d[idx + 2], a = d[idx + 3];
                  if (a === 0) continue;

                  var distBg = Math.sqrt(
                    (r - bgR) * (r - bgR) +
                    (g - bgG) * (g - bgG) +
                    (b - bgB) * (b - bgB)
                  );
                  var isNearWhite = (r > 234 && g > 234 && b > 234);

                  if (distBg < 26 || isNearWhite) {
                    d[idx + 3] = 0;
                  } else {
                    if (distBg < 44) {
                      var ratio = (distBg - 26) / 18;
                      d[idx + 3] = Math.round(a * Math.max(0.1, Math.min(0.85, ratio)));
                    }
                    if (d[idx + 3] > 20) {
                      if (x < minX) minX = x;
                      if (x > maxX) maxX = x;
                      if (y < minY) minY = y;
                      if (y > maxY) maxY = y;
                    }
                  }
                }
              }
              tc.putImageData(imgData, 0, 0);

              if (maxX >= minX && maxY >= minY) {
                cropX = minX;
                cropY = minY;
                cropW = maxX - minX + 1;
                cropH = maxY - minY + 1;
              }
            }
          } catch (pixErr) {}

          var off = document.createElement('canvas');
          off.width = outSize;
          off.height = outSize;
          var c = off.getContext('2d');
          var pad = Math.max(3, Math.round(outSize * 0.04));
          var scale = Math.min((outSize - pad * 2) / cropW, (outSize - pad * 2) / cropH);
          var dw = cropW * scale;
          var dh = cropH * scale;
          c.drawImage(tmp, cropX, cropY, cropW, cropH, (outSize - dw) / 2, (outSize - dh) / 2, dw, dh);
          off._isDarkBg = isDarkBg;

          callback(off);
        } catch (err) {
          callback(null);
        }

      function smoothSetoPolyline(pts, iterations) {
        var cur = pts.slice();
        for (var it = 0; it < iterations; it++) {
          if (cur.length < 3) break;
          var next = [cur[0]];
          for (var i = 0; i < cur.length - 1; i++) {
            var p0 = cur[i];
            var p1 = cur[i + 1];
            if (p0[2] === 1 || p1[2] === 1) {
              next.push(p1);
            } else {
              next.push([p0[0] * 0.75 + p1[0] * 0.25, p0[1] * 0.75 + p1[1] * 0.25, 0]);
              next.push([p0[0] * 0.25 + p1[0] * 0.75, p0[1] * 0.25 + p1[1] * 0.75, 0]);
            }
          }
          next.push(cur[cur.length - 1]);
          cur = next;
        }
        return cur;

      function samplePolyline(pts, count, smoothIter) {
        var workPts = smoothIter ? smoothSetoPolyline(pts, smoothIter) : pts;
        var segLengths = [];
        var totalLen = 0;
        for (var i = 0; i < workPts.length - 1; i++) {
          var dx = workPts[i + 1][0] - workPts[i][0];
          var dy = workPts[i + 1][1] - workPts[i][1];
          var len = Math.sqrt(dx * dx + dy * dy);
          segLengths.push(len);
          totalLen += len;
        }
        var out = [];
        if (totalLen <= 0 || count <= 1) {
          out.push({ x: workPts[0][0], y: workPts[0][1] });
          return out;
        }
        for (var k = 0; k < count; k++) {
          var targetDist = (k / (count - 1)) * totalLen;
          var acc = 0;
          var placed = false;
          for (var s = 0; s < segLengths.length; s++) {
            var sl = segLengths[s];
            if (acc + sl >= targetDist || s === segLengths.length - 1) {
              var t = sl > 0 ? Math.min(1, Math.max(0, (targetDist - acc) / sl)) : 0;
              out.push({
                x: workPts[s][0] + (workPts[s + 1][0] - workPts[s][0]) * t,
                y: workPts[s][1] + (workPts[s + 1][1] - workPts[s][1]) * t
              });
              placed = true;
              break;
            }
            acc += sl;
          }
          if (!placed) {
            var last = workPts[workPts.length - 1];
            out.push({ x: last[0], y: last[1] });
          }
        }
        return out;
      }

        var mode = (currentSettings && currentSettings.colonEggMode) ? currentSettings.colonEggMode : 'random5';
        if (mode !== 'random5') {
          state.activeEggShape = mode;
          state.lastDrawnEggShape = mode;
          return mode;
        }
        if (!state.eggDeck || state.eggDeck.length === 0) {
          var deck = RANDOM5_POOL.slice();
          for (var i = deck.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = deck[i];
            deck[i] = deck[j];
            deck[j] = tmp;
          }
          if (deck.length > 1 && deck[0] === state.lastDrawnEggShape) {
            var swap = deck[0];
            deck[0] = deck[deck.length - 1];
            deck[deck.length - 1] = swap;
          }
          state.eggDeck = deck;
        }
        var nextShape = state.eggDeck.shift();
        state.activeEggShape = nextShape;
        state.lastDrawnEggShape = nextShape;
        return nextShape;

      function assignOrderedPointsToPigs(rimPigs, slotList, cx, cy) {

          return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
        });

        for (var i = 0; i < slotList.length; i++) {
          indexedSlots.push({
            x: slotList[i].x,
            y: slotList[i].y,
            scale: slotList[i].scale,
            ang: Math.atan2(slotList[i].y - cy, slotList[i].x - cx)
          });
        }
        indexedSlots.sort(function (a, b) { return a.ang - b.ang; });

        var count = Math.min(sortedPigs.length, indexedSlots.length);
        for (var k = 0; k < count; k++) {
          sortedPigs[k].tx = indexedSlots[k].x;
          sortedPigs[k].ty = indexedSlots[k].y;
          sortedPigs[k].heartBaseX = indexedSlots[k].x;

          for (var s1 = 0; s1 < rimPigs.length; s1++) {
            slots.push({
              x: cx + sin1Pts[s1].x * figScale,
              y: cy + sin1Pts[s1].y * figScale,
              scale: rimScale
            });
          }
          assignOrderedPointsToPigs(rimPigs, slots, cx, cy);

          var sin1DetailScale = Math.max(0.13, Math.min(0.19, figScale * 0.0145));
          spawnDetailHelpers(cx, cy, figScale, [
            { x: 12.4, y: 1.6, scale: sin1DetailScale },
            { x: 12.0, y: 4.0, scale: sin1DetailScale },
            { x: -7.5, y: -5.8, scale: sin1DetailScale },
            { x: -5.2, y: -6.4, scale: sin1DetailScale },
            { x: -1.5, y: -6.2, scale: sin1DetailScale },
            { x: 1.0, y: -5.6, scale: sin1DetailScale }
          ]);

        } else if (shape === 's3') {
          var nostrilScale = Math.max(0.22, Math.min(0.34, figScale * 0.025));
          var headScale = Math.max(0.145, Math.min(0.215, figScale * 0.016));
          var snoutScale = Math.max(0.135, Math.min(0.20, figScale * 0.015));

          for (var c2 = 0; c2 < colonPigs.length; c2++) {
            var side2 = c2 === 0 ? -1 : 1;
            colonPigs[c2].tx = cx + side2 * figScale * 3.8;
            colonPigs[c2].ty = cy + figScale * 5.6;
            colonPigs[c2].heartBaseX = colonPigs[c2].tx;
            colonPigs[c2].heartBaseY = colonPigs[c2].ty;
            colonPigs[c2].scale = nostrilScale;
            colonPigs[c2].baseAlpha = 1;
            colonPigs[c2].flipX = side2 === -1 ? 1 : -1;
          }

          var snoutCount = 36;
          var headCount = rimPigs.length - snoutCount;
          var headPts = samplePolyline(S3_HEAD_OUTLINE, headCount + 1, 1);
          var snoutPts = samplePolyline(S3_SNOUT_OUTLINE, snoutCount + 1, 2);

          for (var h1 = 0; h1 < headCount; h1++) {
            slots.push({
              x: cx + headPts[h1].x * figScale,
              y: cy + headPts[h1].y * figScale,
              scale: headScale
            });
          }
          for (var sn = 0; sn < snoutCount; sn++) {
            slots.push({
              x: cx + snoutPts[sn].x * figScale,
              y: cy + snoutPts[sn].y * figScale,
              scale: snoutScale
            });
          }
          assignOrderedPointsToPigs(rimPigs, slots, cx, cy);

          var s3DetailScale = Math.max(0.135, Math.min(0.195, figScale * 0.0148));
          spawnDetailHelpers(cx, cy, figScale, [
            { x: -6.6, y: -2.4, scale: s3DetailScale },
            { x: -4.4, y: -2.4, scale: s3DetailScale },
            { x: 4.4, y: -2.4, scale: s3DetailScale },
            { x: 6.6, y: -2.4, scale: s3DetailScale },
            { x: -2.0, y: 11.8, scale: s3DetailScale },
            { x: 0.0, y: 11.2, scale: s3DetailScale },
            { x: 2.0, y: 11.8, scale: s3DetailScale }
          ]);

        } else if (shape === 'sin2') {
          var cheekScale = Math.max(0.22, Math.min(0.34, figScale * 0.025));
          var outlineScale = Math.max(0.135, Math.min(0.195, figScale * 0.0148));
          var featureScale = Math.max(0.155, Math.min(0.225, figScale * 0.017));

          for (var c3 = 0; c3 < colonPigs.length; c3++) {
            var side3 = c3 === 0 ? -1 : 1;
            colonPigs[c3].tx = cx + (side3 === -1 ? -6.8 : 2.0) * figScale;
            colonPigs[c3].ty = cy + figScale * 0.2;
            colonPigs[c3].heartBaseX = colonPigs[c3].tx;
            colonPigs[c3].heartBaseY = colonPigs[c3].ty;
            colonPigs[c3].scale = cheekScale;
            colonPigs[c3].baseAlpha = 1;
            colonPigs[c3].flipX = side3 === -1 ? 1 : -1;
          }

          var browLCount = 16;
          var browRCount = 16;
          var mouthCount = 14;
          var headSin2Count = rimPigs.length - browLCount - browRCount - mouthCount;

          var hSin2Pts = samplePolyline(SIN2_HEAD_OUTLINE, headSin2Count + 1, 1);
          var bLPts = samplePolyline(SIN2_BROW_LEFT, browLCount, 1);
          var bRPts = samplePolyline(SIN2_BROW_RIGHT, browRCount, 1);
          var mouthPts = samplePolyline(buildCirclePts(-5.8, 7.2, 2.3, 2.3, 48), mouthCount + 1, 0);

          for (var hs = 0; hs < headSin2Count; hs++) {
            slots.push({
              x: cx + hSin2Pts[hs].x * figScale,
              y: cy + hSin2Pts[hs].y * figScale,
              scale: outlineScale
            });
          }
          for (var bl = 0; bl < browLCount; bl++) {
            slots.push({
              x: cx + bLPts[bl].x * figScale,
              y: cy + bLPts[bl].y * figScale,
              scale: featureScale
            });
          }
          for (var br = 0; br < browRCount; br++) {
            slots.push({
              x: cx + bRPts[br].x * figScale,
              y: cy + bRPts[br].y * figScale,
              scale: featureScale
            });
          }
          for (var mo = 0; mo < mouthCount; mo++) {
            slots.push({
              x: cx + mouthPts[mo].x * figScale,
              y: cy + mouthPts[mo].y * figScale,
              scale: featureScale
            });
          }
          assignOrderedPointsToPigs(rimPigs, slots, cx, cy);

          spawnDetailHelpers(cx, cy, figScale, [
            { x: 12.2, y: 1.5, scale: outlineScale },
            { x: 11.8, y: 3.9, scale: outlineScale }
          ]);

        } else if (shape === 'sin4') {
          var pupilScale = Math.max(0.21, Math.min(0.32, figScale * 0.024));
          var crocScale = Math.max(0.145, Math.min(0.215, figScale * 0.016));

          for (var c4 = 0; c4 < colonPigs.length; c4++) {
            var eyeX = c4 === 0 ? -2.3 : 3.5;
            colonPigs[c4].tx = cx + eyeX * figScale;
            colonPigs[c4].ty = cy - 8.4 * figScale;
            colonPigs[c4].heartBaseX = colonPigs[c4].tx;
            colonPigs[c4].heartBaseY = colonPigs[c4].ty;
            colonPigs[c4].scale = pupilScale;
            colonPigs[c4].baseAlpha = 1;
            colonPigs[c4].flipX = -1;
          }

          var crocPts = samplePolyline(SIN4_BODY_OUTLINE, rimPigs.length, 1);
          for (var cr = 0; cr < rimPigs.length; cr++) {
            slots.push({
              x: cx + crocPts[cr].x * figScale,
              y: cy + crocPts[cr].y * figScale,
              scale: crocScale
            });
          }
          assignOrderedPointsToPigs(rimPigs, slots, cx, cy);

          var eyeL = samplePolyline(buildCirclePts(-2.3, -8.4, 2.7, 3.1, 36), 11, 0);
          var eyeR = samplePolyline(buildCirclePts(3.5, -8.4, 2.7, 3.1, 36), 11, 0);
          var eyeScale = Math.max(0.135, Math.min(0.195, figScale * 0.0148));
          var toothScale = Math.max(0.13, Math.min(0.19, figScale * 0.0142));
          var crocDetails = [];

          for (var e1 = 0; e1 < eyeL.length - 1; e1++) {
            crocDetails.push({ x: eyeL[e1].x, y: eyeL[e1].y, scale: eyeScale });
          }
          for (var e2 = 0; e2 < eyeR.length - 1; e2++) {
            crocDetails.push({ x: eyeR[e2].x, y: eyeR[e2].y, scale: eyeScale });
          }
          var toothX = [-7.8, -4.0, -0.2, 3.6];
          for (var t = 0; t < toothX.length; t++) {
            var tx = toothX[t];
            crocDetails.push({ x: tx, y: 1.0, scale: toothScale });
            crocDetails.push({ x: tx + 0.2, y: 2.8, scale: toothScale });
            crocDetails.push({ x: tx + 0.4, y: 4.5, scale: toothScale });
          }
          spawnDetailHelpers(cx, cy, figScale, crocDetails);

        } else {
          var heartDuetGap = Math.max(24, Math.min(48, figScale * 3.4));
          var heartDuetScale = Math.max(0.42, Math.min(0.68, figScale * 0.048));
          var heartRimScale = Math.max(0.20, Math.min(0.32, figScale * 0.024));

          for (var c5 = 0; c5 < colonPigs.length; c5++) {
            var side5 = c5 === 0 ? -1 : 1;
            colonPigs[c5].tx = cx + side5 * heartDuetGap;
            colonPigs[c5].ty = cy + figScale * 1.4;
            colonPigs[c5].heartBaseX = colonPigs[c5].tx;
            colonPigs[c5].heartBaseY = colonPigs[c5].ty;
            colonPigs[c5].scale = heartDuetScale;
            colonPigs[c5].baseAlpha = 1;
            colonPigs[c5].flipX = side5 === -1 ? 1 : -1;
          }

          var rawPts = [];
          var STEPS = 720;
          for (var s = 0; s <= STEPS; s++) {
            var t = (s / STEPS) * Math.PI * 2;
            var hx = 16 * Math.pow(Math.sin(t), 3);
            var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            rawPts.push([hx, hy]);
          }
          var heartSamples = samplePolyline(rawPts, rimPigs.length + 1, 0);
          for (var k = 0; k < rimPigs.length; k++) {
            slots.push({
              x: cx + heartSamples[k].x * figScale,
              y: cy + heartSamples[k].y * figScale,
              scale: heartRimScale
            });
          }
          assignOrderedPointsToPigs(rimPigs, slots, cx, cy);
        }
      }

      function triggerHeartDuetShow() {
        if (!state.gathered) return;
        state.exitMode = '';
        state.exitElapsed = 0;
        dismissEggHelpers(true);
        state.heartShowTimer = 5.0;
        state.waveActive = false;
        var chosenShape = pickNextColonEggShape();
        layoutColonEggShape(chosenShape);
      }

      function computeClockTargets() {
        if (state.heartShowTimer > 0) return;

        var now = new Date();
        var curMin = now.getMinutes();
        var curHour = now.getHours();
        if (curMin === 0 && now.getSeconds() === 0 && curHour !== state.lastHourTriggered) {
          state.lastHourTriggered = curHour;
          triggerGuestParade();
        }
        state.lastMinute = curMin;

        var hh = String(curHour).padStart(2, '0');
        var mm = String(curMin).padStart(2, '0');
        var digits = [hh[0], hh[1], mm[0], mm[1]];

        var isExtraLarge = currentSettings ? currentSettings.extraLarge : true;
        var isLandscape = W > H;

        var bounds = getSafeBounds();
        var topBottom = bounds.topBottom;
        var bottomTop = bounds.bottomTop;

        var safeTop = topBottom + 6;
        var safeBottom = Math.max(safeTop + 170, bottomTop - 6);
        var safeH = safeBottom - safeTop;

        var outerRowMargin = 38;
        var rowToClockGap = Math.max(32, Math.min(44, safeH * 0.075));

        var digitZoneTop = safeTop + outerRowMargin + rowToClockGap * 0.55;
        var digitZoneBot = safeBottom - outerRowMargin - rowToClockGap * 0.55;
        var digitZoneH = Math.max(96, digitZoneBot - digitZoneTop);

        var clockW = W * (isExtraLarge ? (isLandscape ? 0.84 : 0.91) : (isLandscape ? 0.72 : 0.79));
        var colonW = clockW * 0.095;
        var digitGap = clockW * 0.045;
        var digitW = (clockW - colonW - digitGap * 2) / 4;
        var ratioCap = isLandscape ? 1.38 : 1.92;
        var digitH = Math.min(digitZoneH * (isExtraLarge ? 0.94 : 0.78), digitW * ratioCap);

        var startX = (W - clockW) / 2;
        var centerY = (digitZoneTop + digitZoneBot) / 2;
        var topY = centerY - digitH / 2;
        var bottomY = topY + digitH;

        var topRowY = Math.max(safeTop + outerRowMargin, topY - rowToClockGap);
        var botRowY = Math.min(safeBottom - outerRowMargin, bottomY + rowToClockGap);

        state.clockBox = {
          left: startX - 18,
          right: startX + clockW + 18,
          top: topY - 18,
          bottom: bottomY + 18
        };

        var xOffsets = [
          startX,
          startX + digitW + digitGap,
          startX + digitW * 2 + digitGap + colonW,
          startX + digitW * 3 + digitGap * 2 + colonW
        ];

        var targets = [];
        var ptsPerDigit = 20;

        for (var d = 0; d < 4; d++) {
          var poly = SETO_DIGIT_POLYLINES[digits[d]] || SETO_DIGIT_POLYLINES['0'];
          var samples = samplePolyline(poly, ptsPerDigit, 2);
          for (var s = 0; s < samples.length; s++) {
            targets.push({
              x: xOffsets[d] + samples[s].x * digitW,
              y: topY + samples[s].y * digitH,
              role: 'digit',
              colonIndex: -1
            });
          }
        }

        var colonX = startX + digitW * 2 + digitGap + colonW * 0.5;
        targets.push({ x: colonX, y: topY + digitH * 0.34, role: 'colon', colonIndex: 0 });
        targets.push({ x: colonX, y: topY + digitH * 0.68, role: 'colon', colonIndex: 1 });

        for (var i = 0; i < pigs.length; i++) {
          pigs[i].role = 'roamer';
          pigs[i].colonIndex = -1;
          pigs[i].slotIndex = -1;
          pigs[i].baseAlpha = 1;
        }

        var used = new Array(pigs.length);
        var pigScale = Math.max(0.21, Math.min(0.32, (digitW / 96) * 0.45));

        for (var t = 0; t < targets.length; t++) {
          var bestIdx = -1;
          var bestDist = Infinity;
          for (var p = 0; p < pigs.length; p++) {
            if (used[p]) continue;
            var dx = pigs[p].x - targets[t].x;
            var dy = pigs[p].y - targets[t].y;
            var dist = dx * dx + dy * dy;
            if (dist < bestDist) {
              bestDist = dist;
              bestIdx = p;
            }
          }
          if (bestIdx !== -1) {
            used[bestIdx] = true;
            pigs[bestIdx].role = targets[t].role;
            pigs[bestIdx].colonIndex = targets[t].colonIndex;
            pigs[bestIdx].tx = targets[t].x;
            pigs[bestIdx].ty = targets[t].y;
            pigs[bestIdx].scale = pigScale;
            pigs[bestIdx].baseAlpha = 1;
          }
        }

        var roamers = [];
        for (var r = 0; r < pigs.length; r++) {
          if (pigs[r].role === 'roamer') {
            roamers.push(pigs[r]);
          }
        }

        roamers.sort(function (a, b) { return a.y - b.y; });
        var halfCount = Math.floor(roamers.length / 2);
        var topRoamers = roamers.slice(0, halfCount);
        var botRoamers = roamers.slice(halfCount);

        var isAM = curHour < 12;
        var topRowScale = pigScale * (isAM ? 0.90 : 0.64);
        var botRowScale = pigScale * (isAM ? 0.64 : 0.90);
        var topRowAlpha = isAM ? 1.0 : 0.58;
        var botRowAlpha = isAM ? 0.58 : 1.0;

        var rowLeft = Math.max(20, startX - 6);
        var rowRight = Math.min(W - 20, startX + clockW + 6);
        var rowSpan = Math.max(40, rowRight - rowLeft);

        function alignPigRow(list, rowY, rScale, rAlpha, baseSlot) {
          if (list.length === 0) return;
          list.sort(function (a, b) { return a.x - b.x; });
          for (var k = 0; k < list.length; k++) {
            list[k].slotIndex = baseSlot + k;
            list[k].tx = list.length === 1 ? (W * 0.5) : (rowLeft + (k / (list.length - 1)) * rowSpan);
            list[k].ty = rowY;
            list[k].scale = rScale;
            list[k].baseAlpha = rAlpha;
            list[k].vx = 0;
            list[k].vy = 0;
          }
        }

        alignPigRow(topRoamers, topRowY, topRowScale, topRowAlpha, 0);
        alignPigRow(botRoamers, botRowY, botRowScale, botRowAlpha, halfCount);
      }

      function applyWeirdoMix(enable) {
        var wPool = getWeirdoPool();
        for (var i = 0; i < pigs.length; i++) {
          pigs[i].isWeirdo = false;
          if (pigs[i].eggTimer <= 0) pigs[i].overrideSprite = null;
          if (enable && wPool.length > 0 && i % 6 === 0) {
            pigs[i].isWeirdo = true;
            pigs[i].overrideSprite = wPool[(i / 6) % wPool.length];
            pigs[i].scale = 0.56;
            pigs[i].baseAlpha = 1;
            var ang = Math.random() * Math.PI * 2;
            var spd = 55 + Math.random() * 45;
            pigs[i].vx = Math.cos(ang) * spd;
            pigs[i].vy = Math.sin(ang) * spd;
          }
        }
      }

      function setGathered(val, snapImmediate) {
        state.gathered = !!val;
        state.heartShowTimer = 0;
        state.exitMode = '';
        state.exitElapsed = 0;
        dismissEggHelpers(false);
        var btn = document.getElementById('btnToggleGather');
        if (btn) {
          btn.textContent = state.gathered ? '自己玩 / 幾點了（時鐘)' : '自己玩 / 幾點了（玩耍中)';
        }
        if (state.gathered) {
          applyWeirdoMix(false);
          computeClockTargets();
          if (snapImmediate) {
            snapClockPigsToTargets();
          }
        } else {
          state.waveActive = false;
          applyWeirdoMix(true);
          for (var i = 0; i < pigs.length; i++) {
            pigs[i].role = 'roamer';
            pigs[i].slotIndex = -1;
            pigs[i].baseAlpha = 1;
            if (!pigs[i].isWeirdo) pigs[i].scale = 0.44;
            var angle = Math.random() * Math.PI * 2;
            var spd = 45 + Math.random() * 55;
            pigs[i].vx = Math.cos(angle) * spd;
            pigs[i].vy = Math.sin(angle) * spd;
          }
        }
      }

      function triggerPigEgg(pig, cycleNext) {
        var nextAction = cycleNext ? ((pig.eggAction + 1) % 4) : Math.floor(Math.random() * 4);
        pig.eggAction = nextAction;
        pig.eggTimer = 3.6;
        pig.clickFlip *= -1;
        pig.overrideSprite = null;

        if (nextAction === 0) {
          pig.vy = -150;
        } else if (nextAction === 2) {
          var pool = getClickEggPool();
          if (pool.length > 0) {
            pig.overrideSprite = pool[Math.floor(Math.random() * pool.length)];
          }
        } else if (nextAction === 3) {
          pig.wiggleFreq = 16;
        }
      }

      /* 放大冒號點擊判定範圍：支援點擊上下兩顆冒號或兩者之間的中央帶狀區 */
      function findPigAt(px, py) {
        var colons = [];
        for (var c = 0; c < pigs.length; c++) {
          if (pigs[c].role === 'colon') {
            colons.push(pigs[c]);
            var cRadius = Math.max(48, 96 * Math.max(pigs[c].scale, pigs[c].currentScale) * 1.65);
            if (Math.hypot(px - pigs[c].x, py - pigs[c].y) <= cRadius) {
              return pigs[c];
            }
          }
        }
        if (colons.length >= 2) {
          var midX = (colons[0].x + colons[1].x) * 0.5;
          var minY = Math.min(colons[0].y, colons[1].y) - 44;
          var maxY = Math.max(colons[0].y, colons[1].y) + 44;
          if (Math.abs(px - midX) <= 46 && py >= minY && py <= maxY) {
            return colons[0];
          }
        }
        for (var i = pigs.length - 1; i >= 0; i--) {
          var p = pigs[i];
          var hitRadius = Math.max(26, 96 * p.scale * 0.72);
          if (Math.hypot(px - p.x, py - p.y) <= hitRadius) {
            return p;
          }
        }
        return null;
      }

      function toStageCoords(clientX, clientY) {
        var vw = window.innerWidth || document.documentElement.clientWidth || 320;
        var vh = window.innerHeight || document.documentElement.clientHeight || 480;
        if (currentSettings && currentSettings.forceLandscape) {
          return {
            x: clientY,
            y: vw - clientX
          };
        }
        return {
          x: clientX,
          y: clientY
        };
      }

      function handlePointerDown(clientX, clientY) {
        var pt = toStageCoords(clientX, clientY);
        var px = pt.x;
        var py = pt.y;
        pointerDownPos = { x: px, y: py };
        pointerMoved = false;
        pointerDownHitColon = false;

        for (var vIdx = paradeVisitors.length - 1; vIdx >= 0; vIdx--) {
          var vis = paradeVisitors[vIdx];
          if (Math.hypot(px - vis.x, py - vis.y) <= vis.size * 0.85) {
            vis.vx = -vis.vx;
            vis.facing *= -1;
            vis.pauseTimer = 1.2;
            return;
          }
        }

        if (!state.gathered) {
          return;
        }

        if (state.heartShowTimer > 0) {
          return;
        }

        var hit = findPigAt(px, py);
        if (hit) {
          if (hit.role === 'colon') {
            pointerDownHitColon = true;
            return;
          }
          if (!state.exitMode) {
            draggingPig = hit;
            hit.eggTimer = Math.max(hit.eggTimer, 3.6);
          }
        }
      }

      function handlePointerMove(clientX, clientY) {
        if (!draggingPig || !state.gathered || state.heartShowTimer > 0) return;
        var pt = toStageCoords(clientX, clientY);
        var px = pt.x;
        var py = pt.y;
        if (Math.hypot(px - pointerDownPos.x, py - pointerDownPos.y) > 8) {
          pointerMoved = true;
        }
        if (pointerMoved) {
          draggingPig.x = Math.min(Math.max(px, 24), W - 24);
          draggingPig.y = Math.min(Math.max(py, 56), H - 36);
          draggingPig.vx = 0;
          draggingPig.vy = 0;
        }
      }

      function handlePointerUp(clientX, clientY) {
        var pt = toStageCoords(clientX, clientY);
        var isTap = Math.hypot(pt.x - pointerDownPos.x, pt.y - pointerDownPos.y) <= 18;

        if (!state.gathered) {
          if (isTap) {
            setGathered(true);
          }
          return;
        }

        /* 冒號點擊陣型秀進行中：輕點畫布提前跳回時間顯示（原地縮水回鍋） */
        if (state.heartShowTimer > 0) {
          if (isTap) {
            beginEggExitSequence(true);
          }
          return;
        }

        if (pointerDownHitColon && isTap) {
          pointerDownHitColon = false;
          triggerHeartDuetShow();
          return;
        }
        pointerDownHitColon = false;

        if (draggingPig) {
          var targetPig = draggingPig;
          draggingPig = null;
          if (!pointerMoved) {
            triggerPigEgg(targetPig, targetPig.eggTimer > 0.2);
          }
          return;
        }

        if (isTap) {
          var hit = findPigAt(pt.x, pt.y);
          if (hit) {
            if (hit.role === 'colon') {
              triggerHeartDuetShow();
            } else if (!state.exitMode) {
              triggerPigEgg(hit, hit.eggTimer > 0.2);
            }
          } else if (!state.exitMode) {
            setGathered(false);
          }
        }
      }

      function updateDateBadgeText() {
        var label = formatTodayBadge();
        var dateTextEl = document.getElementById('dateText');
        var prevDateTextEl = document.getElementById('previewDateText');
        if (dateTextEl && dateTextEl.textContent !== label) dateTextEl.textContent = label;
        if (prevDateTextEl && prevDateTextEl.textContent !== label) prevDateTextEl.textContent = label;
      }

      var lastTime = 0;
      function animate(now) {
        requestAnimationFrame(animate);
        if (!lastTime) lastTime = now;
        var dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        var sec = now / 1000;

        var wallNow = new Date();
        var curHour = wallNow.getHours();
        var curMin = wallNow.getMinutes();
        var curSec = wallNow.getSeconds();
        var secFrac = curSec + wallNow.getMilliseconds() / 1000;

        if (state.heartShowTimer > 0) {
          state.heartShowTimer -= dt;
          if (state.heartShowTimer <= 0) {
            state.heartShowTimer = 0;
            beginEggExitSequence(false);
          }
        }

        if (state.exitMode) {
          state.exitElapsed += dt;
          var maxExitDur = state.exitMode === 'shrink' ? 0.36 : 1.15;
          if (state.exitElapsed >= maxExitDur) {
            state.exitMode = '';
            state.exitElapsed = 0;
            if (state.gathered) {
              computeClockTargets();
              for (var rIdx = 0; rIdx < pigs.length; rIdx++) {
                pigs[rIdx].currentScale = pigs[rIdx].scale * 0.45;
              }
            }
          }
        }

        if (state.gathered && state.heartShowTimer <= 0 && !state.exitMode && curMin !== state.lastMinute) {
          updateDateBadgeText();
          computeClockTargets();
        }

        var chimeKey = curHour + ':' + curMin;
        if (state.gathered && state.heartShowTimer <= 0 && !state.exitMode && curSec === 0 && state.lastChimeKey !== chimeKey) {
          state.lastChimeKey = chimeKey;
          if (curMin === 0) {
            state.waveActive = true;
            state.waveStartTime = now;
            state.waveCycles = 99;
            state.waveContinuousEnd = now + 6500;
          } else {
            var cycles = curMin <= 15 ? 1 : (curMin <= 30 ? 2 : (curMin <= 45 ? 3 : 4));
            state.waveActive = true;
            state.waveStartTime = now;
            state.waveCycles = cycles;
            state.waveContinuousEnd = 0;
          }
        }

        var waveElapsed = 0;
        var PASS_DUR = 1.62;
        if (state.waveActive) {
          waveElapsed = (now - state.waveStartTime) / 1000;
          if (state.waveContinuousEnd > 0) {
            if (now > state.waveContinuousEnd) state.waveActive = false;
          } else if (waveElapsed > state.waveCycles * PASS_DUR + 0.35) {
            state.waveActive = false;
          }
        }

        var colonBeat = 0.5 + 0.5 * Math.cos(secFrac * Math.PI * 2);
        var colonPulseScale = 0.88 + 0.30 * colonBeat;
        var colonPulseAlpha = 0.35 + 0.65 * colonBeat;

        var shapePulse = 1 + 0.042 * Math.sin(sec * 5.8);

        ctx.fillStyle = state.nightMode ? '#050505' : '#FDF6EC';
        ctx.fillRect(0, 0, W, H);

        if (!state.nightMode) {
          ctx.fillStyle = 'rgba(59, 35, 24, 0.05)';
          for (var gx = 16; gx < W; gx += 28) {
            for (var gy = 16; gy < H; gy += 28) {
              ctx.fillRect(gx, gy, 1.5, 1.5);
            }
          }
        }

        var box = state.clockBox;
        var hasTopContent = currentSettings && (currentSettings.visible || currentSettings.showDateBadge);
        var minTopY = hasTopContent ? Math.max(58, state.safeTopBottom + 12) : 26;
        var pool = getCurrentRoamerPool();
        var activeSecPig = null;

        for (var i = 0; i < pigs.length; i++) {
          var p = pigs[i];
          p.wigglePhase += dt * p.wiggleFreq;

          var isFocusedEgg = p.eggTimer > 0 && state.heartShowTimer <= 0 && !state.exitMode;
          if (isFocusedEgg) {
            p.eggTimer -= dt;
            if (p.eggTimer <= 0) {
              p.eggTimer = 0;
              p.wiggleFreq = 3.6 + (i % 5) * 0.45;
              if (!p.isWeirdo) p.overrideSprite = null;
            }
          }

          var exitSpinAngle = 0;
          var exitScaleMult = 1;
          var exitAlphaMult = 1;
          var exitBobY = 0;

          if (state.exitMode) {
            var eT = Math.max(0, state.exitElapsed - p.exitStagger);
            if (state.exitMode === 'jet') {
              var spinDur = 0.45;
              if (eT < spinDur) {
                var spProg = Math.min(1, eT / spinDur);
                exitSpinAngle = spProg * spProg * Math.PI * 2;
                exitScaleMult = 1 + 0.22 * Math.sin(spProg * Math.PI);
                p.x = p.exitStartX;
                p.y = p.exitStartY;
              } else {
                var jetT = eT - spinDur;
                var accel = jetT * jetT * 2600 + jetT * 420;
                p.x = p.exitStartX + p.exitDirX * accel;
                p.y = p.exitStartY + Math.sin(jetT * 18 + p.id) * 6;
                p.flipX = p.exitDirX;
                exitScaleMult = 1.08;
              }
            } else if (state.exitMode === 'spiral') {
              var burstDur = 0.36;
              var dx0 = p.exitStartX - state.heartCenter.x;
              var dy0 = p.exitStartY - state.heartCenter.y;
              var baseDist = Math.hypot(dx0, dy0);
              var baseAng = Math.atan2(dy0, dx0);
              if (eT < burstDur) {
                var bProg = Math.min(1, eT / burstDur);
                var easeOut = 1 - Math.pow(1 - bProg, 2);
                var curAng = baseAng + bProg * 1.15;
                var curDist = baseDist + easeOut * 44;
                p.x = state.heartCenter.x + Math.cos(curAng) * curDist;
                p.y = state.heartCenter.y + Math.sin(curAng) * curDist;
                exitScaleMult = 1 + 0.14 * Math.sin(bProg * Math.PI);
              } else {
                var slideT = eT - burstDur;
                var bDist = baseDist + 44;
                var bAng = baseAng + 1.15;
                var burstX = state.heartCenter.x + Math.cos(bAng) * bDist;
                var burstY = state.heartCenter.y + Math.sin(bAng) * bDist;
                var slideDist = slideT * slideT * 1400 + slideT * 360;
                p.x = burstX + p.exitDirX * slideDist;
                p.y = burstY + Math.sin(slideT * 9 + p.id) * 14;
                p.flipX = p.exitDirX;
              }
            } else if (state.exitMode === 'wave') {
              var hopDur = 0.34;
              if (eT < hopDur) {
                var hProg = Math.min(1, eT / hopDur);
                exitBobY = -Math.sin(hProg * Math.PI) * 24;
                exitScaleMult = 1 + 0.15 * Math.sin(hProg * Math.PI);
                p.x = p.exitStartX;
                p.y = p.exitStartY;
              } else {
                var jogT = eT - hopDur;
                var jogDist = jogT * 340 + jogT * jogT * 780;
                p.x = p.exitStartX + p.exitDirX * jogDist;
                p.y = p.exitStartY;
                exitBobY = -Math.abs(Math.sin(jogT * 16 + p.id)) * 9;
                p.flipX = p.exitDirX;
              }
            } else if (state.exitMode === 'shrink') {
              var shProg = Math.min(1, state.exitElapsed / 0.28);
              exitScaleMult = Math.max(0.01, 1 - shProg * 0.96);
              exitAlphaMult = Math.max(0, 1 - shProg * 0.92);
              p.x = p.exitStartX;
              p.y = p.exitStartY;
            }
          } else if (state.gathered && state.heartShowTimer > 0) {
            if (p.role === 'colon') {
              var sideDir = p.colonIndex === 0 ? -1 : 1;
              if (state.activeEggShape === 'sin4') {
                p.tx = p.heartBaseX + Math.sin(sec * 4.5) * 3.5;
                p.ty = p.heartBaseY + Math.cos(sec * 4.5) * 1.8;
                p.flipX = -1;
              } else {
                var duetSway = Math.sin(sec * 5.2) * 5;
                p.tx = p.heartBaseX + duetSway;
                p.ty = p.heartBaseY - Math.abs(Math.sin(sec * 7.5 + p.colonIndex * 1.4)) * 7;
                p.flipX = sideDir === -1 ? 1 : -1;
              }
            } else {
              var relX = p.heartBaseX - state.heartCenter.x;
              var relY = p.heartBaseY - state.heartCenter.y;
              p.tx = state.heartCenter.x + relX * shapePulse;
              p.ty = state.heartCenter.y + relY * shapePulse;
            }
          }

          if (state.exitMode) {
            // 退場動畫由上方 exitMode 控制
          } else if (p === draggingPig) {
            // 拖曳中
          } else if (isFocusedEgg && p.eggAction === 1) {
            p.y += Math.sin(sec * 8 + p.id) * 0.4;
          } else if (state.gathered && !isFocusedEgg) {
            var dx = p.tx - p.x;
            var dy = p.ty - p.y;
            if (Math.abs(dx) > 0.35 || Math.abs(dy) > 0.35) {
              p.x += dx * Math.min(1, dt * 8.2);
              p.y += dy * Math.min(1, dt * 8.2);
              if (state.heartShowTimer <= 0 && Math.abs(dx) > 1.5) {
                p.flipX = dx >= 0 ? 1 : -1;
              }
            } else {
              p.x = p.tx;
              p.y = p.ty;
            }
          } else {
            p.poseTimer -= dt;
            if (p.poseTimer <= 0) {
              if (!p.isWeirdo && !isFocusedEgg) {
                p.pose = Math.floor(Math.random() * pool.length);
              }
              p.poseTimer = 2 + Math.random() * 4;
              var ang = Math.random() * Math.PI * 2;
              var speed = p.isWeirdo ? (55 + Math.random() * 45) : (35 + Math.random() * 55);
              p.vx = Math.cos(ang) * speed;
              p.vy = Math.sin(ang) * speed;
            }

            p.x += p.vx * dt;
            p.y += p.vy * dt;
            if (Math.abs(p.vx) > 2) p.flipX = p.vx >= 0 ? 1 : -1;

            var margin = 24;
            if (p.x < margin) { p.x = margin; p.vx = Math.abs(p.vx); }
            if (p.x > W - margin) { p.x = W - margin; p.vx = -Math.abs(p.vx); }
            if (p.y < minTopY) { p.y = minTopY; p.vy = Math.abs(p.vy); }
            if (p.y > H - 36) { p.y = H - 36; p.vy = -Math.abs(p.vy); }

            if (state.gathered && !isFocusedEgg && p.x > box.left && p.x < box.right && p.y > box.top && p.y < box.bottom) {
              var dLeft = p.x - box.left;
              var dRight = box.right - p.x;
              var dTop = p.y - box.top;
              var dBot = box.bottom - p.y;
              var minD = Math.min(dLeft, dRight, dTop, dBot);
              if (minD === dLeft) { p.x = box.left; p.vx = -Math.abs(p.vx); }
              else if (minD === dRight) { p.x = box.right; p.vx = Math.abs(p.vx); }
              else if (minD === dTop) { p.y = box.top; p.vy = -Math.abs(p.vy); }
              else { p.y = box.bottom; p.vy = Math.abs(p.vy); }
            }
          }

          var sprite = p.overrideSprite || pool[p.pose % pool.length] || fallbackSprites[0];
          if (!sprite) continue;

          var isActiveSec = state.gathered && state.heartShowTimer <= 0 && !state.exitMode && p.role === 'roamer' && p.slotIndex === curSec;
          if (isActiveSec) activeSecPig = p;

          var targetScale = p.scale;
          if (isActiveSec) {
            targetScale = Math.max(p.scale * 1.48, 0.34);
          }

          p.currentScale += (targetScale - p.currentScale) * Math.min(1, dt * 10);
          var drawScale = p.currentScale * (isFocusedEgg ? 1.45 : 1) * exitScaleMult;
          var drawAlpha = ((state.gathered && state.heartShowTimer <= 0 && !state.exitMode) ? (isActiveSec ? 1 : p.baseAlpha) : 1) * exitAlphaMult;

          if (state.gathered && state.heartShowTimer <= 0 && !state.exitMode && p.role === 'colon') {
            drawScale *= colonPulseScale;
            drawAlpha = colonPulseAlpha;
          }

          var waveJump = 0;
          if (state.waveActive && state.gathered && state.heartShowTimer <= 0 && !state.exitMode && p.role === 'roamer' && p.slotIndex >= 0) {
            var maxC = state.waveContinuousEnd > 0 ? Math.ceil((waveElapsed + 2) / PASS_DUR) : state.waveCycles;
            for (var wc = 0; wc < maxC; wc++) {
              var localT = waveElapsed - wc * PASS_DUR - p.slotIndex * 0.022;
              if (localT >= 0 && localT <= 0.32) {
                waveJump = -Math.sin((localT / 0.32) * Math.PI) * 19;
                break;
              }
            }
          }

          var secPopOffset = 0;
          if (isActiveSec) {
            var secBounce = Math.sin(Math.min(1, (secFrac % 1) * 3.5) * Math.PI) * 4;
            secPopOffset = (p.slotIndex < 30 ? -1 : 1) * (5 + secBounce);
          }

          var jumpOffset = waveJump + secPopOffset + exitBobY;
          if (isFocusedEgg && p.eggAction === 0) {
            jumpOffset -= Math.abs(Math.sin(sec * 9 + p.id)) * 18;
          }

          var bobY = Math.sin(p.wigglePhase * 0.7) * (isFocusedEgg ? 4 : 1.7) + jumpOffset;
          var wiggleAngle = Math.sin(p.wigglePhase) * (isFocusedEgg ? 0.25 : 0.08) + exitSpinAngle;
          if (!state.exitMode && state.gathered && state.heartShowTimer > 0 && p.role === 'colon') {
            var sideTilt = p.colonIndex === 0 ? 1 : -1;
            wiggleAngle = Math.sin(sec * 7.5) * 0.22 * sideTilt;
          }

          ctx.save();
          ctx.globalAlpha = drawAlpha;

          if (state.gathered && state.heartShowTimer <= 0 && !state.exitMode && p.role === 'colon') {
            var ringRadius = Math.max(13, 96 * drawScale * 0.62);
            if (state.nightMode) {
              ctx.shadowColor = 'rgba(255, 240, 210, 0.85)';
              ctx.shadowBlur = 10;
            }
            drawHandDrawnCircle(ctx, p.x, p.y + bobY, ringRadius, state.nightMode);
            ctx.shadowBlur = 0;
          }

          ctx.translate(p.x, p.y + bobY);
          ctx.rotate(wiggleAngle);
          ctx.scale(p.flipX * p.clickFlip * drawScale, drawScale);

          if (sprite._isDarkBg) {
            ctx.fillStyle = 'rgba(20, 18, 22, 0.85)';
            drawRoundRect(ctx, -50, -50, 100, 100, 14);
            ctx.fill();
          }

          if (isActiveSec) {
            ctx.shadowColor = state.nightMode ? 'rgba(255, 224, 150, 0.95)' : 'rgba(244, 155, 110, 0.88)';
            ctx.shadowBlur = 13;
          } else if (state.nightMode) {
            ctx.shadowColor = 'rgba(255, 245, 225, 0.62)';
            ctx.shadowBlur = 9;
          }

          ctx.drawImage(sprite, -48, -48, 96, 96);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        for (var eh = eggHelpers.length - 1; eh >= 0; eh--) {
          var helper = eggHelpers[eh];
          if (!helper.leaving && state.heartShowTimer > 0) {
            var hRelX = helper.heartBaseX - state.heartCenter.x;
            var hRelY = helper.heartBaseY - state.heartCenter.y;
            helper.tx = state.heartCenter.x + hRelX * shapePulse;
            helper.ty = state.heartCenter.y + hRelY * shapePulse;
          }
          var hSpeed = helper.leaving ? 6.5 : 9.2;
          helper.x += (helper.tx - helper.x) * Math.min(1, dt * hSpeed);
          helper.y += (helper.ty - helper.y) * Math.min(1, dt * hSpeed);

          var hBob = Math.sin(sec * 5 + helper.phase) * 1.4;
          var hWiggle = Math.sin(sec * 6 + helper.phase) * 0.08;

          ctx.save();
          ctx.translate(helper.x, helper.y + hBob);
          ctx.rotate(hWiggle);
          ctx.scale(helper.flipX * helper.scale, helper.scale);
          if (helper.sprite._isDarkBg) {
            ctx.fillStyle = 'rgba(20, 18, 22, 0.85)';
            drawRoundRect(ctx, -50, -50, 100, 100, 14);
            ctx.fill();
          }
          if (state.nightMode) {
            ctx.shadowColor = 'rgba(255, 245, 225, 0.62)';
            ctx.shadowBlur = 8;
          }
          ctx.drawImage(helper.sprite, -48, -48, 96, 96);
          ctx.shadowBlur = 0;
          ctx.restore();

          if (helper.leaving && (helper.x < -45 || helper.x > W + 45)) {
            eggHelpers.splice(eh, 1);
          }
        }

        if (state.gathered && state.heartShowTimer > 0 && state.activeEggShape === 'heart') {
          var pulseMiniHeart = 10 + Math.sin(sec * 9) * 2.2;
          drawMiniHeart(
            ctx,
            state.heartCenter.x + Math.sin(sec * 5.2) * 5,
            state.heartCenter.y - state.heartScale * 1.6 + Math.cos(sec * 7.5) * 3,
            pulseMiniHeart,
            '#F26B83'
          );
        }

        if (activeSecPig && state.gathered && state.heartShowTimer <= 0 && !state.exitMode) {
          var isTopHalf = activeSecPig.slotIndex < 30;
          var pigHalfH = 48 * activeSecPig.currentScale;
          var labelOffset = pigHalfH + 12;
          var bx = Math.min(Math.max(activeSecPig.x, 22), W - 22);
          var by = isTopHalf ? (activeSecPig.y - labelOffset - 2) : (activeSecPig.y + labelOffset + 2);
          var secLabel = String(curSec).padStart(2, '0');

          ctx.save();
          ctx.font = '700 13px "SetoFontReal", "NaikaiSetoExt", "SetoFont", "LocalRoundFallback", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          var pillW = 26;
          var pillH = 18;
          ctx.fillStyle = state.nightMode ? 'rgba(34, 30, 28, 0.94)' : '#FFF9F0';
          ctx.strokeStyle = state.nightMode ? '#F5EDE4' : '#3B2318';
          ctx.lineWidth = 1.6;
          drawRoundRect(ctx, bx - pillW / 2, by - pillH / 2, pillW, pillH, 7);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = state.nightMode ? '#FFD89C' : '#3B2318';
          ctx.fillText(secLabel, bx, by + 0.5);
          ctx.restore();
        }

        for (var v = paradeVisitors.length - 1; v >= 0; v--) {
          var vis = paradeVisitors[v];
          if (vis.pauseTimer > 0) {
            vis.pauseTimer -= dt;
          } else {
            vis.x += vis.vx * dt;
            var midX = W * 0.5;
            if (!vis.hasPausedAtMid && ((vis.vx > 0 && vis.x >= midX - 20 && vis.x <= midX + 20) || (vis.vx < 0 && vis.x <= midX + 20 && vis.x >= midX - 20))) {
              vis.hasPausedAtMid = true;
              vis.pauseTimer = 1.1;
            }
          }

          vis.y = vis.baseY + Math.sin(sec * 4.2 + vis.phase) * 14;
          var vAng = Math.sin(sec * 6.5 + vis.phase) * 0.16;
          var vScale = vis.size / 96;

          ctx.save();
          ctx.translate(vis.x, vis.y);
          ctx.rotate(vAng);
          ctx.scale(vis.facing * vScale, vScale);
          if (vis.sprite._isDarkBg) {
            ctx.fillStyle = 'rgba(20, 18, 22, 0.85)';
            drawRoundRect(ctx, -50, -50, 100, 100, 14);
            ctx.fill();
          }
          ctx.drawImage(vis.sprite, -48, -48, 96, 96);
          ctx.restore();

          if (vis.x < -vis.size * 2.5 || vis.x > W + vis.size * 2.5) {
            paradeVisitors.splice(v, 1);
          }
        }
      }

      function loadSettings() {
        currentSettings = getDefaultSettings();
        var raw = safeGet(STORAGE_KEY, '');
        if (!raw) return;
        try {
          var parsed = JSON.parse(raw);
          if (parsed && typeof parsed === 'object') {
            currentSettings = cloneSettings(parsed);
          }
        } catch (e) {}
      }

      function saveSettings() {
        try {
          safeSet(STORAGE_KEY, JSON.stringify(currentSettings));
        } catch (e) {}
      }

      function syncButtonIconDisplay(iconEl, imgEl, iconType, iconText, imgData) {
        if (!iconEl || !imgEl) return;
        if ((iconType === 'preset' || iconType === 'image') && imgData) {
          iconEl.style.display = 'none';
          imgEl.src = imgData;
          imgEl.style.display = 'inline-block';
        } else {
          imgEl.style.display = 'none';
          iconEl.textContent = iconText || '🐷';
          iconEl.style.display = 'inline-flex';
        }
      }

      function applyOrientationClass(forceLand) {
        document.body.classList.toggle('force-landscape', !!forceLand);
        if (forceLand && screen && screen.orientation && typeof screen.orientation.lock === 'function') {
          try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
        } else if (!forceLand && screen && screen.orientation && typeof screen.orientation.unlock === 'function') {
          try { screen.orientation.unlock(); } catch (e) {}
        }
      }

      function applySettingsToScreen() {
        var s = currentSettings;
        applyOrientationClass(s.forceLandscape);
        updateDateBadgeText();

        var topBarEl = document.getElementById('topBar');
        var trigger = document.getElementById('titleTrigger');

      function resize() {
        var vw = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0, 320);
        var vh = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0, 480);
        if (currentSettings && currentSettings.forceLandscape) {
          W = Math.max(vh, 320);
          H = Math.max(vw, 320);
        } else {
          W = vw;
          H = vh;
        }
        DPR = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        getSafeBounds();

        for (var i = 0; i < pigs.length; i++) {
          pigs[i].x = Math.min(Math.max(pigs[i].x, 24), W - 24);
          pigs[i].y = Math.min(Math.max(pigs[i].y, 26), H - 36);
        }

        if (state.gathered && pigs.length > 0) {
          if (state.heartShowTimer > 0) {
            dismissEggHelpers(true);
            layoutColonEggShape(state.activeEggShape);
          } else if (!state.exitMode) {
            computeClockTargets();
          }
        }
      }

      function processMultiImageUpload(files, onDone) {
        if (!files || !files.length) return;
        var loadedSprites = [];
        var loadedUrls = [];
        var pending = Math.min(files.length, 16);

        for (var i = 0; i < pending; i++) {
          (function (file) {
            var reader = new FileReader();
            reader.onload = function (ev) {
              var img = new Image();
              img.onload = function () {
                removeBackgroundAndTrim(img, 180, function (spr) {
                  if (spr) {
                    loadedSprites.push(spr);
                    try {
                      loadedUrls.push(spr.toDataURL('image/png'));
                    } catch (e) {}
                  }
                  pending--;
                  if (pending <= 0) onDone(loadedSprites, loadedUrls);
                });
              };
              img.onerror = function () {
                pending--;
                if (pending <= 0) onDone(loadedSprites, loadedUrls);
              };
              img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          })(files[i]);
        }
      }

      function bindUI() {
        var activePointerId = null;

        canvas.addEventListener('pointerdown', function (e) {
          if (activePointerId !== null) return;
          activePointerId = e.pointerId;
          try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
          handlePointerDown(e.clientX, e.clientY);
        });
        canvas.addEventListener('pointermove', function (e) {
          if (e.pointerId !== activePointerId) return;
          handlePointerMove(e.clientX, e.clientY);
        });
        canvas.addEventListener('pointerup', function (e) {
          if (e.pointerId !== activePointerId) return;
          activePointerId = null;
          try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
          handlePointerUp(e.clientX, e.clientY);
        });
        canvas.addEventListener('pointercancel', function (e) {
          if (e.pointerId === activePointerId) {
            activePointerId = null;
            draggingPig = null;
            pointerDownHitColon = false;
          }
        });

        document.getElementById('titleTrigger').addEventListener('click', function (e) {
          e.stopPropagation();
          openTitleModal();
        });
