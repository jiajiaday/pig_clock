<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手繪小豬報時鐘 · 冒號陣型彩蛋版</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Darumadrop+One&family=Hachi+Maru+Pop&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #fff9ee;
      --bg-blush: #ffeef2;
      --ink: #3d2c2e;
      --pig-pink: #ff9eb5;
      --pig-deep: #ff6f94;
      --pig-ear: #ff82a1;
      --accent-mint: #79d7be;
      --accent-gold: #ffd166;
      --accent-sky: #8ecae6;
      --card-bg: rgba(255, 255, 255, 0.86);
      --shadow-soft: 0 14px 34px rgba(133, 76, 89, 0.14);
      --hand-font: 'Hachi Maru Pop', 'Zen Maru Gothic', cursive, sans-serif;
      --display-font: 'Darumadrop One', 'Hachi Maru Pop', 'Zen Maru Gothic', cursive, sans-serif;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--hand-font);
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 18%, #ffe4ec 0%, transparent 34%),
        radial-gradient(circle at 86% 20%, #fff0c2 0%, transparent 36%),
        radial-gradient(circle at 22% 84%, #dff7f0 0%, transparent 38%),
        radial-gradient(circle at 82% 82%, #e3f2fd 0%, transparent 38%),
        linear-gradient(155deg, var(--bg-cream) 0%, var(--bg-blush) 100%);
    }

    /* 手繪紙感底紋與輕微浮動裝飾 */
    .paper-doodles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .doodle-item {
      position: absolute;
      opacity: 0.28;
      animation: floatDoodle 7s ease-in-out infinite;
    }

    @keyframes floatDoodle {
      0%, 100% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-10px) rotate(4deg); }
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: clamp(12px, 2.4vh, 26px) clamp(14px, 3vw, 36px);
    }

    /* 頂部標題與狀態列 */
    .top-bar {
      width: 100%;
      max-width: 980px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 20;
    }

    .title-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: var(--card-bg);
      border: 3px solid var(--ink);
      border-radius: 999px 990px 995px 988px / 990px 996px 986px 994px;
      box-shadow: 4px 5px 0 var(--ink);
      font-weight: 700;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: #fffdf7;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      box-shadow: 3px 4px 0 var(--ink);
      font-size: clamp(0.82rem, 1.4vw, 1rem);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .status-pill.is-show {
      background: #fff0f5;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-mint);
      border: 2px solid var(--ink);
    }

    .status-pill.is-show .status-dot {
      background: var(--pig-deep);
      animation: pulseDot 0.65s infinite alternate;
    }

    @keyframes pulseDot {
      from { transform: scale(0.9); }
      to { transform: scale(1.3); }
    }

    /* 中央時鐘舞台 */
    .clock-stage {
      position: relative;
      width: 100%;
      flex: 1;
      max-width: 1060px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 6px 0;
    }

    .clock-card {
      position: relative;
      width: 100%;
      max-width: 920px;
      min-height: clamp(230px, 42vh, 380px);
      background: rgba(255, 253, 249, 0.84);
      backdrop-filter: blur(8px);
      border: 4px solid var(--ink);
      border-radius: 36px 42px 34px 40px / 40px 34px 42px 36px;
      box-shadow: 9px 11px 0 var(--ink), var(--shadow-soft);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 36px;
      overflow: visible;
    }

    /* 小豬報時主角（左上方/側邊互動小豬） */
    .pig-mascot-wrap {
      position: absolute;
      top: -34px;
      right: 26px;
      width: clamp(74px, 11vw, 108px);
      height: clamp(74px, 11vw, 108px);
      cursor: pointer;
      z-index: 15;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(3px 4px 0 rgba(61, 44, 46, 0.22));
    }

    .pig-mascot-wrap:hover {
      transform: scale(1.08) rotate(-4deg);
    }

    .pig-mascot-wrap:active {
      transform: scale(0.95);
    }

    .pig-mascot-wrap.chime-jump {
      animation: pigWaveJump 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes pigWaveJump {
      0% { transform: translateY(0) scale(1, 1); }
      22% { transform: translateY(6px) scale(1.12, 0.86); }
      52% { transform: translateY(-26px) scale(0.94, 1.1) rotate(6deg); }
      78% { transform: translateY(3px) scale(1.05, 0.94) rotate(-3deg); }
      100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
    }

    /* 數字時間顯示區 */
    .time-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(6px, 1.6vw, 18px);
      font-family: var(--display-font);
      font-size: clamp(3.4rem, 11.5vw, 8.2rem);
      line-height: 1;
      letter-spacing: 0.02em;
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 6;
    }

    .time-display.is-hidden {
      opacity: 0;
      transform: scale(0.84);
      pointer-events: none;
    }

    .time-display.is-returning {
      animation: timePopIn 0.36s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes timePopIn {
      0% { opacity: 0; transform: scale(0.76) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .digit-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 0.62em;
      padding: 0.06em 0.08em;
      border-radius: 22px;
      background: #fff;
      border: 3.5px solid var(--ink);
      box-shadow: 4px 5px 0 var(--ink);
      color: var(--ink);
      text-shadow: 2px 2px 0 rgba(255, 158, 181, 0.45);
    }

    /* 可點擊的中央冒號 */
    .colon-btn {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.2vh, 22px);
      padding: 10px 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 12;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .colon-btn:hover {
      transform: scale(1.15);
    }

    .colon-btn:active {
      transform: scale(0.92);
    }

    .colon-dot {
      width: clamp(14px, 2.6vw, 24px);
      height: clamp(14px, 2.6vw, 24px);
      border-radius: 50%;
      background: var(--pig-deep);
      border: 3px solid var(--ink);
      box-shadow: 2px 3px 0 var(--ink);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .colon-btn.blink-off .colon-dot {
      opacity: 0.28;
      transform: scale(0.82);
    }

    .colon-tip {
      position: absolute;
      bottom: -24px;
      white-space: nowrap;
      font-family: var(--hand-font);
      font-size: clamp(0.72rem, 1.2vw, 0.88rem);
      font-weight: 700;
      color: var(--pig-deep);
      background: #fff;
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 2px 9px;
      box-shadow: 2px 2px 0 var(--ink);
      pointer-events: none;
    }

    /* 60秒手繪進度條 */
    .progress-track {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 14px;
      height: 12px;
      background: #f5ecee;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--pig-pink), var(--accent-gold), var(--accent-mint));
      border-radius: 999px;
      transition: width 0.25s linear;
    }

    /* 陣型秀小幫手層（覆蓋整個舞台，支援中途點擊跳回時間） */
    .formation-layer {
      position: fixed;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      overflow: hidden;
    }

    .formation-layer.is-active {
      pointer-events: auto;
      cursor: pointer;
    }

    .formation-hud {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: 4px 5px 0 var(--ink);
      font-size: clamp(0.88rem, 1.6vw, 1.05rem);
      font-weight: 700;
      pointer-events: none;
    }

    .formation-layer.is-active + .formation-hud {
      display: inline-flex;
    }

    .helper-unit {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(40px, 5.2vw, 62px);
      height: clamp(40px, 5.2vw, 62px);
      margin-left: calc(clamp(40px, 5.2vw, 62px) / -2);
      margin-top: calc(clamp(40px, 5.2vw, 62px) / -2);
      transform: translate3d(0, 0, 0) scale(0);
      opacity: 0;
      filter: drop-shadow(2px 3px 0 rgba(61, 44, 46, 0.25));
      will-change: transform, opacity;
    }

    /* 底部手繪控制列 */
    .bottom-controls {
      width: 100%;
      max-width: 920px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      z-index: 20;
    }

    .hand-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      font-family: var(--hand-font);
      font-size: clamp(0.86rem, 1.45vw, 1.02rem);
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 18px 22px 17px 21px / 21px 17px 22px 18px;
      box-shadow: 3px 4px 0 var(--ink);
      cursor: pointer;
      transition: transform 0.16s ease, background-color 0.16s ease;
    }

    .hand-btn:hover {
      transform: translateY(-2px);
      background: #fff6f8;
    }

    .hand-btn:active {
      transform: translateY(1px);
      box-shadow: 1px 2px 0 var(--ink);
    }

    .hand-btn.primary {
      background: var(--pig-pink);
    }

    .hand-btn.primary:hover {
      background: #ff8aa8;
    }

    .date-sub {
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      opacity: 0.85;
      padding: 6px 12px;
    }

    @media (max-width: 600px) {
      .clock-card {
        min-height: 210px;
        border-radius: 26px;
        padding: 18px 12px 32px;
      }
      .pig-mascot-wrap {
        top: -28px;
        right: 14px;
      }
      .colon-tip {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- 手繪背景塗鴉 -->
  <div class="paper-doodles" aria-hidden="true">
    <svg class="doodle-item" style="top: 12%; left: 6%; width: 54px;" viewBox="0 0 64 64">
      <path d="M32 54 C14 40, 8 24, 18 15 C25 9, 31 15, 32 21 C33 15, 39 9, 46 15 C56 24, 50 40, 32 54 Z" fill="none" stroke="#3d2c2e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <svg class="doodle-item" style="top: 18%; right: 9%; width: 52px; animation-delay: -1.8s;" viewBox="0 0 64 64">
      <path d="M32 8 L38 24 L55 25 L42 36 L46 53 L32 43 L18 53 L22 36 L9 25 L26 24 Z" fill="none" stroke="#3d2c2e" stroke-width="3" stroke-linejoin="round"/>
    </svg>
    <svg class="doodle-item" style="bottom: 16%; left: 10%; width: 64px; animation-delay: -3.2s;" viewBox="0 0 80 40">
      <path d="M6 22 Q 20 8, 34 22 T 62 22 T 76 22" fill="none" stroke="#3d2c2e" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <svg class="doodle-item" style="bottom: 20%; right: 7%; width: 50px; animation-delay: -4.5s;" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="18" fill="none" stroke="#3d2c2e" stroke-width="3" stroke-dasharray="8 6"/>
    </svg>
  </div>

  <div class="app-shell">
    <!-- 頂部列 -->
    <header class="top-bar">
      <div class="title-badge">
        <span>🐷</span>
        <span>手繪小豬報時鐘</span>
      </div>
      <div id="statusPill" class="status-pill">
        <span class="status-dot"></span>
        <span id="statusText">正常報時中 · 點擊中央「:」看 5 秒陣型秀</span>
      </div>
    </header>

    <!-- 中央時鐘舞台 -->
    <main class="clock-stage">
      <section class="clock-card" aria-label="數位時鐘">
        <!-- 報時小豬角色 -->
        <div id="pigMascot" class="pig-mascot-wrap" title="點我試試報時波浪跳！">
          <svg viewBox="0 0 120 120" width="100%" height="100%">
            <!-- 左耳與右耳 -->
            <path d="M26 42 L18 14 L46 28 Z" fill="#ff82a1" stroke="#3d2c2e" stroke-width="4" stroke-linejoin="round"/>
            <path d="M94 42 L102 14 L74 28 Z" fill="#ff82a1" stroke="#3d2c2e" stroke-width="4" stroke-linejoin="round"/>
            <!-- 頭部 -->
            <ellipse cx="60" cy="64" rx="42" ry="38" fill="#ff9eb5" stroke="#3d2c2e" stroke-width="4"/>
            <!-- 腮紅 -->
            <ellipse cx="33" cy="70" rx="8" ry="5" fill="#ff6f94" opacity="0.55"/>
            <ellipse cx="87" cy="70" rx="8" ry="5" fill="#ff6f94" opacity="0.55"/>
            <!-- 眼睛 -->
            <circle cx="44" cy="56" r="5.5" fill="#3d2c2e"/>
            <circle cx="42.3" cy="54.2" r="1.8" fill="#fff"/>
            <circle cx="76" cy="56" r="5.5" fill="#3d2c2e"/>
            <circle cx="74.3" cy="54.2" r="1.8" fill="#fff"/>
            <!-- 豬鼻子 -->
            <ellipse cx="60" cy="69" rx="14" ry="10.5" fill="#ff7d9e" stroke="#3d2c2e" stroke-width="3.5"/>
            <circle cx="55.5" cy="69" r="2.7" fill="#3d2c2e"/>
            <circle cx="64.5" cy="69" r="2.7" fill="#3d2c2e"/>
            <!-- 微笑嘴巴 -->
            <path d="M51 82 Q 60 89, 69 82" fill="none" stroke="#3d2c2e" stroke-width="3.5" stroke-linecap="round"/>
          </svg>
        </div>

        <!-- 時間數字 -->
        <div id="timeDisplay" class="time-display">
          <span id="h1" class="digit-box">0</span>
          <span id="h2" class="digit-box">0</span>
          <button id="colonBtn" class="colon-btn" type="button" aria-label="觸發 5 秒冒號陣型秀">
            <span class="colon-dot"></span>
            <span class="colon-dot"></span>
            <span class="colon-tip">點我 5s 陣型秀</span>
          </button>
          <span id="m1" class="digit-box">0</span>
          <span id="m2" class="digit-box">0</span>
        </div>

        <!-- 秒數進度條 -->
        <div class="progress-track" title="本分鐘秒數進度">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </section>
    </main>

    <!-- 底部控制列 -->
    <footer class="bottom-controls">
      <button id="btnHeart" class="hand-btn primary" type="button">💖 愛心陣型（5s）</button>
      <button id="btnDuet" class="hand-btn" type="button">🐷🐰 雙人陣型（5s）</button>
      <button id="btnShiro" class="hand-btn" type="button">🐶 小白陣型（5s）</button>
      <button id="btnChime" class="hand-btn" type="button">🔔 報時跳一下</button>
      <span id="dateSub" class="date-sub"></span>
    </footer>
  </div>

  <!-- 陣型秀小幫手畫布（點擊任意處可提前跳回時間顯示） -->
  <div id="formationLayer" class="formation-layer" aria-hidden="true"></div>
  <div id="formationHud" class="formation-hud">
    <span id="formationLabel">陣型秀進行中（5秒）</span>
    <span>·</span>
    <span>點擊畫面立即跳回時間</span>
  </div>

  <script>
    (() => {
      // ===== 常數與狀態 =====
      const SHOW_DURATION_MS = 5000;       // 需求 3：陣型變換總時長改為 5 秒
      const PATTERN_STEP_MS = 1250;        // 5 秒內切換陣型節奏
      const HELPER_COUNT = 28;             // 需求 2：擴充小幫手數量至 28 位，提升圖案精細度

      const h1El = document.getElementById('h1');
      const h2El = document.getElementById('h2');
      const m1El = document.getElementById('m1');
      const m2El = document.getElementById('m2');
      const colonBtn = document.getElementById('colonBtn');
      const timeDisplay = document.getElementById('timeDisplay');
      const progressFill = document.getElementById('progressFill');
      const statusPill = document.getElementById('statusPill');
      const statusText = document.getElementById('statusText');
      const dateSub = document.getElementById('dateSub');
      const pigMascot = document.getElementById('pigMascot');
      const formationLayer = document.getElementById('formationLayer');
      const formationLabel = document.getElementById('formationLabel');

      let isShowActive = false;
      let isExiting = false;
      let showEndTimer = null;
      let patternTimer = null;
      let stepTimer = null;
      let exitFinishTimer = null;
      let lastMinute = -1;
      let currentMode = 'auto'; // 'auto' | 'heart' | 'duet' | 'shiro'

      // ===== 小幫手 SVG 模板（精緻手繪風格） =====
      const HELPER_SVGS = [
        // 粉紅小豬小幫手
        `<svg viewBox="0 0 64 64" width="100%" height="100%">
          <path d="M15 24 L10 9 L25 16 Z" fill="#ff82a1" stroke="#3d2c2e" stroke-width="3" stroke-linejoin="round"/>
          <path d="M49 24 L54 9 L39 16 Z" fill="#ff82a1" stroke="#3d2c2e" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="32" cy="35" rx="22" ry="19" fill="#ff9eb5" stroke="#3d2c2e" stroke-width="3"/>
          <circle cx="24" cy="31" r="2.8" fill="#3d2c2e"/>
          <circle cx="40" cy="31" r="2.8" fill="#3d2c2e"/>
          <ellipse cx="32" cy="38" rx="7.5" ry="5.5" fill="#ff6f94" stroke="#3d2c2e" stroke-width="2.5"/>
          <circle cx="29.8" cy="38" r="1.4" fill="#3d2c2e"/>
          <circle cx="34.2" cy="38" r="1.4" fill="#3d2c2e"/>
        </svg>`,
        // 奶油星星/愛心小精靈
        `<svg viewBox="0 0 64 64" width="100%" height="100%">
          <path d="M32 52 C14 39, 9 23, 19 15 C25 10, 31 15, 32 21 C33 15, 39 10, 45 15 C55 23, 50 39, 32 52 Z" fill="#ffd166" stroke="#3d2c2e" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="26" cy="28" r="2.3" fill="#3d2c2e"/>
          <circle cx="38" cy="28" r="2.3" fill="#3d2c2e"/>
          <path d="M29 34 Q 32 37, 35 34" fill="none" stroke="#3d2c2e" stroke-width="2.5" stroke-linecap="round"/>
        </svg>`,
        // 小白風格小汪汪小幫手
        `<svg viewBox="0 0 64 64" width="100%" height="100%">
          <path d="M16 24 L11 10 L25 18 Z" fill="#ffffff" stroke="#3d2c2e" stroke-width="3" stroke-linejoin="round"/>
          <path d="M48 24 L53 10 L39 18 Z" fill="#ffffff" stroke="#3d2c2e" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="32" cy="36" rx="22" ry="18.5" fill="#ffffff" stroke="#3d2c2e" stroke-width="3"/>
          <circle cx="23.5" cy="33" r="4.2" fill="#3d2c2e"/>
          <circle cx="40.5" cy="33" r="4.2" fill="#3d2c2e"/>
          <circle cx="22.5" cy="31.8" r="1.3" fill="#fff"/>
          <circle cx="39.5" cy="31.8" r="1.3" fill="#fff"/>
          <ellipse cx="32" cy="39" rx="3.6" ry="2.6" fill="#3d2c2e"/>
          <path d="M27 43 Q 32 47, 37 43" fill="none" stroke="#3d2c2e" stroke-width="2.5" stroke-linecap="round"/>
        </svg>`
      ];

      // 建立小幫手 DOM 節點池
      const helpers = [];
      for (let i = 0; i < HELPER_COUNT; i++) {
        const el = document.createElement('div');
        el.className = 'helper-unit';
        el.innerHTML = HELPER_SVGS[i % HELPER_SVGS.length];
        formationLayer.appendChild(el);
        helpers.push({
          el,
          x: 0,
          y: 0,
          scale: 0,
          rot: 0,
          opacity: 0
        });
      }

      // ===== 陣型座標產生器（28 點高精細輪廓） =====
      function getHeartPoints(count, radiusX, radiusY, offsetX = 0, offsetY = 0) {
        const pts = [];
        for (let i = 0; i < count; i++) {
          const t = (Math.PI * 2 * i) / count;
          const x = 16 * Math.pow(Math.sin(t), 3);
          const y = -(
            13 * Math.cos(t) -
            5 * Math.cos(2 * t) -
            2 * Math.cos(3 * t) -
            Math.cos(4 * t)
          );
          pts.push({
            x: offsetX + (x / 16) * radiusX,
            y: offsetY + (y / 14) * radiusY
          });
        }
        return pts;
      }

      function getDuetPoints(count, spreadX, radiusY) {
        // 左右雙心＋中央甜蜜連線，呈現雙人陣型
        const half = Math.floor(count / 2);
        const leftPts = getHeartPoints(half, spreadX * 0.62, radiusY * 0.78, -spreadX * 0.56, -8);
        const rightPts = getHeartPoints(count - half, spreadX * 0.62, radiusY * 0.78, spreadX * 0.56, 8);
        return [...leftPts, ...rightPts];
      }

      // 需求 1：小白冒號點擊彩蛋陣型（蓬鬆圓臉 + 左右立耳 + 黑眼圈/耳朵細節 + 微笑弧線）
      function getShiroPoints(count, rx, ry) {
        const pts = [];
        // 分配點位：14 點勾勒小白蓬鬆圓臉與微笑，7 點左耳，7 點右耳
        const earCount = 7;
        const faceCount = Math.max(8, count - earCount * 2);

        // 左耳（左上立耳）
        for (let i = 0; i < earCount; i++) {
          const ratio = i / Math.max(1, earCount - 1);
          pts.push({
            x: -rx * (0.48 + ratio * 0.24),
            y: -ry * (0.78 + Math.sin(ratio * Math.PI) * 0.42)
          });
        }

        // 右耳（右上立耳）
        for (let i = 0; i < earCount; i++) {
          const ratio = i / Math.max(1, earCount - 1);
          pts.push({
            x: rx * (0.48 + ratio * 0.24),
            y: -ry * (0.78 + Math.sin(ratio * Math.PI) * 0.42)
          });
        }

        // 小白圓潤臉龐與下方微笑輪廓
        for (let i = 0; i < faceCount; i++) {
          const t = (Math.PI * 2 * i) / faceCount;
          // 稍微加入小白臉頰的軟萌鼓感
          const puff = 1 + 0.08 * Math.sin(t * 2);
          pts.push({
            x: Math.cos(t) * rx * puff,
            y: Math.sin(t) * ry * puff + ry * 0.12
          });
        }

        return pts.slice(0, count);
      }

      function buildFormationCoordinates(type) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const base = Math.min(vw, vh);
        const rx = Math.max(120, Math.min(250, base * 0.34));
        const ry = Math.max(110, Math.min(220, base * 0.30));

        if (type === 'heart') {
          return getHeartPoints(HELPER_COUNT, rx * 1.15, ry * 1.12, 0, -10);
        }
        if (type === 'duet') {
          return getDuetPoints(HELPER_COUNT, rx * 1.15, ry * 1.05);
        }
        // 'shiro' 小白陣型
        return getShiroPoints(HELPER_COUNT, rx * 1.05, ry * 0.96);
      }

      function applyHelperTransform(h, x, y, scale, rot, opacity, transition = 'transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease') {
        h.x = x;
        h.y = y;
        h.scale = scale;
        h.rot = rot;
        h.opacity = opacity;
        h.el.style.transition = transition;
        h.el.style.opacity = String(opacity);
        h.el.style.transform = `translate3d(${x.toFixed(1)}px, ${y.toFixed(1)}px, 0) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
      }

      function renderPattern(type, labelText) {
        formationLabel.textContent = labelText;
        const coords = buildFormationCoordinates(type);
        helpers.forEach((h, idx) => {
          const target = coords[idx] || { x: 0, y: 0 };
          const tilt = (idx % 2 === 0 ? 1 : -1) * 7;
          applyHelperTransform(h, target.x, target.y, 1, tilt, 1);
        });
      }

      // ===== 清除計時器輔助函式 =====
      function clearShowTimers() {
        if (showEndTimer) { clearTimeout(showEndTimer); showEndTimer = null; }
        if (patternTimer) { clearInterval(patternTimer); patternTimer = null; }
        if (stepTimer) { clearTimeout(stepTimer); stepTimer = null; }
        if (exitFinishTimer) { clearTimeout(exitFinishTimer); exitFinishTimer = null; }
      }

      // ===== 需求 4：退場橋段實作 =====
      function runExitSequence(isManualInterrupt, onComplete) {
        isExiting = true;
        formationLayer.classList.remove('is-active');
        clearShowTimers();

        const vw = window.innerWidth;
        const edgeX = vw * 0.68 + 120;

        if (isManualInterrupt) {
          // (4) 使用者中途點擊跳回時間：原地縮水變小消失／回鍋，讓退場更快、不干擾時間數字快速成形
          statusText.textContent = '已提前跳回時間 · 小幫手快速回鍋中';
          helpers.forEach((h, idx) => {
            const delay = idx * 8;
            setTimeout(() => {
              applyHelperTransform(
                h,
                h.x * 0.35,
                h.y * 0.35,
                0.05,
                h.rot + 25,
                0,
                'transform 0.22s cubic-bezier(0.55, 0.06, 0.68, 0.53), opacity 0.18s ease-out'
              );
            }, delay);
          });

          exitFinishTimer = setTimeout(() => {
            isExiting = false;
            if (onComplete) onComplete();
          }, 260);
          return;
        }

        // 正常 5 秒結束時：從 (1) (2) (3) 三種退場橋段中隨機挑一種
        const exitChoice = Math.floor(Math.random() * 3);

        if (exitChoice === 0) {
          // (1) 集體轉圈後向兩側噴射退場：先原地 0.45s 內轉 360 度並微微放大，再往左或往右加速衝出畫面邊緣
          statusText.textContent = '退場橋段：集體轉圈後咻——向兩側噴射！';
          helpers.forEach((h, idx) => {
            const dir = h.x >= 0 ? 1 : -1;
            const stagger = (idx % 6) * 25;
            setTimeout(() => {
              // 階段 A：原地加速旋轉 360 度並微微放大
              applyHelperTransform(
                h,
                h.x,
                h.y,
                1.22,
                h.rot + 360,
                1,
                'transform 0.42s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s ease'
              );
            }, stagger);

            setTimeout(() => {
              // 階段 B：依所在位置往左或往右加速噴射出畫面
              const dy = (idx % 2 === 0 ? -1 : 1) * 28;
              applyHelperTransform(
                h,
                dir * edgeX,
                h.y + dy,
                0.92,
                h.rot + 360 + dir * 35,
                0,
                'transform 0.44s cubic-bezier(0.4, 0, 1, 0.6), opacity 0.35s ease-in'
              );
            }, 420 + stagger);
          });

          exitFinishTimer = setTimeout(() => {
            isExiting = false;
            if (onComplete) onComplete();
          }, 980);

        } else if (exitChoice === 1) {
          // (2) 螺旋擴散／炸開後分流離場：先以彩蛋中心為圓心向外擴散一小圈，再各自轉向左側或右側滑出螢幕
          statusText.textContent = '退場橋段：螺旋擴散綻放後分流離場！';
          helpers.forEach((h, idx) => {
            const angle = Math.atan2(h.y, h.x) + 0.55;
            const expandR = 72 + (idx % 4) * 18;
            const burstX = h.x + Math.cos(angle) * expandR;
            const burstY = h.y + Math.sin(angle) * expandR;
            const dir = burstX >= 0 ? 1 : -1;

            setTimeout(() => {
              applyHelperTransform(
                h,
                burstX,
                burstY,
                1.16,
                h.rot + 95,
                1,
                'transform 0.34s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease'
              );
            }, idx * 12);

            setTimeout(() => {
              applyHelperTransform(
                h,
                dir * edgeX,
                burstY + (dir > 0 ? 36 : -36),
                0.85,
                h.rot + 210 + dir * 30,
                0,
                'transform 0.48s cubic-bezier(0.32, 0, 0.67, 1), opacity 0.4s ease-in'
              );
            }, 340 + idx * 12);
          });

          exitFinishTimer = setTimeout(() => {
            isExiting = false;
            if (onComplete) onComplete();
          }, 1150);

        } else {
          // (3) 排隊波浪跳躍後退場：依左右順序輪流跳一下（類似報時波浪），再往左右兩側小跑步離開
          statusText.textContent = '退場橋段：排隊波浪跳躍打招呼，再往兩側小跑步離開！';
          const sortedIndices = helpers
            .map((h, idx) => ({ idx, x: h.x }))
            .sort((a, b) => a.x - b.x)
            .map((item) => item.idx);

          sortedIndices.forEach((idx, order) => {
            const h = helpers[idx];
            const dir = h.x >= 0 ? 1 : -1;
            const hopDelay = order * 24;

            // 跳一下
            setTimeout(() => {
              applyHelperTransform(
                h,
                h.x,
                h.y - 34,
                1.12,
                dir * 12,
                1,
                'transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease'
              );
            }, hopDelay);

            // 落地並往左右兩側小跑步離開
            setTimeout(() => {
              applyHelperTransform(
                h,
                dir * edgeX,
                h.y + ((order % 2 === 0) ? -10 : 12),
                0.9,
                dir * 18,
                0,
                'transform 0.46s ease-in, opacity 0.38s ease-in'
              );
            }, hopDelay + 230);
          });

          exitFinishTimer = setTimeout(() => {
            isExiting = false;
            if (onComplete) onComplete();
          }, 1360);
        }
      }

      // ===== 啟動 5 秒陣型秀（triggerHeartDuetShow） =====
      function triggerHeartDuetShow(forcedMode = 'auto') {
        if (isExiting) return;

        clearShowTimers();
        isShowActive = true;
        currentMode = forcedMode;

        // 隱藏時間數字，啟動陣型層
        timeDisplay.classList.remove('is-returning');
        timeDisplay.classList.add('is-hidden');
        formationLayer.classList.add('is-active');
        formationLayer.setAttribute('aria-hidden', 'false');
        statusPill.classList.add('is-show');

        // 定義 5 秒內的陣型序列
        const sequence =
          forcedMode === 'shiro'
            ? [
                { type: 'shiro', label: '🐶 小白蓬鬆萌臉陣型（5s）' },
                { type: 'heart', label: '💖 小白＆愛心暖呼呼陣型（5s）' },
                { type: 'shiro', label: '🐶 小白立耳打招呼陣型（5s）' },
                { type: 'duet', label: '🐷🐶 小豬＆小白雙人陣型（5s）' }
              ]
            : forcedMode === 'heart'
            ? [
                { type: 'heart', label: '💖 手繪愛心陣型秀（5s）' },
                { type: 'shiro', label: '🐶 小白驚喜客串陣型（5s）' },
                { type: 'heart', label: '💖 閃亮愛心放大陣型（5s）' },
                { type: 'duet', label: '🐷🐰 雙人甜蜜陣型（5s）' }
              ]
            : forcedMode === 'duet'
            ? [
                { type: 'duet', label: '🐷🐰 雙人陣型秀（5s）' },
                { type: 'shiro', label: '🐶 小白加入雙人派對（5s）' },
                { type: 'heart', label: '💖 雙人愛心連線（5s）' },
                { type: 'duet', label: '🐷🐰 雙人歡樂陣型（5s）' }
              ]
            : [
                { type: 'heart', label: '💖 冒號陣型秀 · 愛心登場（5s）' },
                { type: 'duet', label: '🐷🐰 冒號陣型秀 · 雙人登場（5s）' },
                { type: 'shiro', label: '🐶 冒號陣型秀 · 小白登場（5s）' },
                { type: 'heart', label: '💖 冒號陣型秀 · 愛心收尾（5s）' }
              ];

        let stepIdx = 0;
        const runStep = () => {
          if (!isShowActive || isExiting) return;
          const item = sequence[stepIdx % sequence.length];
          statusText.textContent = item.label;
          renderPattern(item.type, item.label);
          stepIdx++;
        };

        runStep();
        patternTimer = setInterval(runStep, PATTERN_STEP_MS);

        // 總時長嚴格設定為 5000ms（5 秒）
        showEndTimer = setTimeout(() => {
          finishShow(false);
        }, SHOW_DURATION_MS);
      }

      // 結束陣型秀並跳回時間顯示
      function finishShow(isManualInterrupt) {
        if (!isShowActive || isExiting) return;
        isShowActive = false;

        runExitSequence(isManualInterrupt, () => {
          formationLayer.setAttribute('aria-hidden', 'true');
          statusPill.classList.remove('is-show');
          statusText.textContent = '正常報時中 · 點擊中央「:」看 5 秒陣型秀';

          // 讓時間數字快速成形並跳回
          timeDisplay.classList.remove('is-hidden');
          timeDisplay.classList.remove('is-returning');
          void timeDisplay.offsetWidth;
          timeDisplay.classList.add('is-returning');
        });
      }

      // ===== 報時與時鐘更新 =====
      function triggerChimeWave() {
        pigMascot.classList.remove('chime-jump');
        void pigMascot.offsetWidth;
        pigMascot.classList.add('chime-jump');
      }

      function updateClock() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();

        const hStr = String(hours).padStart(2, '0');
        const mStr = String(minutes).padStart(2, '0');

        h1El.textContent = hStr[0];
        h2El.textContent = hStr[1];
        m1El.textContent = mStr[0];
        m2El.textContent = mStr[1];

        // 冒號每秒呼吸閃爍
        colonBtn.classList.toggle('blink-off', seconds % 2 === 1);

        // 60 秒進度條
        const pct = ((seconds + now.getMilliseconds() / 1000) / 60) * 100;
        progressFill.style.width = `${pct.toFixed(2)}%`;

        // 整點／每分鐘報時小豬跳躍
        if (lastMinute !== -1 && lastMinute !== minutes) {
          triggerChimeWave();
        }
        lastMinute = minutes;

        // 繁體中文日期顯示
        const weekNames = ['日', '一', '二', '三', '四', '五', '六'];
        dateSub.textContent = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日（週${weekNames[now.getDay()]}）`;
      }

      // ===== 事件繫結 =====
      // 點擊中央冒號觸發 5 秒陣型秀
      colonBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isShowActive) {
          finishShow(true);
        } else {
          triggerHeartDuetShow('auto');
        }
      });

      // 陣型秀進行中，觸碰/點擊畫面任意處立即跳回時間顯示
      formationLayer.addEventListener('pointerdown', (e) => {
        if (isShowActive && !isExiting) {
          e.preventDefault();
          finishShow(true);
        }
      });

      // 底部快速測試按鈕
      document.getElementById('btnHeart').addEventListener('click', () => triggerHeartDuetShow('heart'));
      document.getElementById('btnDuet').addEventListener('click', () => triggerHeartDuetShow('duet'));
      document.getElementById('btnShiro').addEventListener('click', () => triggerHeartDuetShow('shiro'));
      document.getElementById('btnChime').addEventListener('click', triggerChimeWave);
      pigMascot.addEventListener('click', triggerChimeWave);

      // 視窗大小改變時，若正在顯示陣型則即時重算座標
      window.addEventListener('resize', () => {
        if (isShowActive && !isExiting) {
          const stepIdx = 0;
          renderPattern(currentMode === 'auto' ? 'heart' : currentMode, formationLabel.textContent);
        }
      });

      // 啟動時鐘迴圈
      updateClock();
      setInterval(updateClock, 100);
    })();
  </script>
</body>
