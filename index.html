<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#FDF6EC" id="metaTheme" />
  <title>不理不理左衛門時鐘</title>
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Yomogi&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FDF6EC;
      --ink: #3B2318;
      --pill-bg: #FFFAF3;
      --pill-border: #3B2318;
      --modal-bg: #FDF6EC;
      --card-bg: #FFFFFF;
      --accent: #F4B89C;
      --font-hand: "Zen Maru Gothic", "Yomogi", "Comic Sans MS", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body.night {
      --bg: #050505;
      --ink: #F5EDE4;
      --pill-bg: rgba(28, 28, 32, 0.92);
      --pill-border: rgba(245, 237, 228, 0.72);
      --modal-bg: #18181B;
      --card-bg: #242429;
      --accent: #D98A6C;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-hand);
      transition: background-color 0.25s ease, color 0.25s ease;
      touch-action: manipulation;
    }

    #clockCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* 頂部可自訂標題列 */
    #topBar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px 14px;
      pointer-events: none;
    }

    #titleTrigger {
      pointer-events: auto;
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 94vw;
      padding: 6px 14px;
      border: 1.5px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
    }

    #titleTrigger:hover {
      background-color: rgba(128, 128, 128, 0.1);
      border-color: rgba(128, 128, 128, 0.25);
    }

    #titleTrigger:active {
      transform: scale(0.96);
    }

    #titleIcon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    #titleIconImg {
      display: none;
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
      vertical-align: middle;
    }

    .ctrl-btn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .ctrl-btn-img {
      display: none;
      width: 16px;
      height: 16px;
      object-fit: contain;
      border-radius: 4px;
    }

    .edit-badge {
      font-size: 0.62em;
      opacity: 0.55;
      margin-left: 2px;
    }

    /* 底部控制工具列 */
    #bottomBar {
      position: fixed;
      bottom: 12px;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 10px;
      pointer-events: none;
    }

    .toolbar-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px;
      max-width: 96vw;
    }

    .pill-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 14px;
      border: 2px solid var(--pill-border);
      border-radius: 22px 16px 24px 18px / 18px 24px 16px 22px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.02em;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--pill-border);
      white-space: nowrap;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .pill-btn:active {
      transform: translateY(1px) scale(0.96);
    }

    .pill-btn.primary {
      background-color: var(--accent);
      color: #2B1810;
    }

    .hint-line {
      margin-top: 7px;
      font-family: var(--font-hand);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      opacity: 0.75;
      text-align: center;
    }

    .hidden {
      display: none !important;
    }

    /* 隱藏底部工具列後的右下角半透明恢復按鈕 */
    #btnShowBar {
      position: fixed;
      right: 14px;
      bottom: 14px;
      z-index: 25;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      border: 1.5px solid var(--pill-border);
      border-radius: 999px;
      background-color: var(--pill-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 12px;
      font-weight: 800;
      opacity: 0.65;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.16);
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    #btnShowBar:hover,
    #btnShowBar:active {
      opacity: 0.96;
      transform: scale(0.96);
    }

    /* 輕量提示氣泡 */
    #toast {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 40;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(35, 24, 18, 0.92);
      color: #FFFDF9;
      font-family: var(--font-hand);
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* 標題與圖示設定彈窗 */
    #titleModal {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, 0.54);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    #titleModal.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      background-color: var(--modal-bg);
      color: var(--ink);
      border: 2px solid var(--pill-border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
      font-family: var(--font-hand);
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1.5px solid var(--pill-border);
      background: var(--card-bg);
      color: var(--ink);
      font-weight: 900;
      cursor: pointer;
    }

    .preview-panel {
      background: var(--card-bg);
      border: 1.5px dashed rgba(128, 128, 128, 0.42);
      border-radius: 14px;
      padding: 10px;
      margin-bottom: 12px;
      text-align: center;
    }

    .preview-tag {
      display: block;
      font-size: 11px;
      font-weight: 700;
      opacity: 0.62;
      margin-bottom: 4px;
    }

    #modalPreview {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.25;
      min-height: 34px;
    }

    #previewImg {
      display: none;
      width: 28px;
      height: 28px;
      object-fit: contain;
      border-radius: 6px;
    }

    .preview-btns-bar {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(128, 128, 128, 0.28);
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 12px;
      font-weight: 800;
    }

    .preview-mini-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid rgba(128, 128, 128, 0.35);
    }

    .preview-mini-img {
      display: none;
      width: 15px;
      height: 15px;
      object-fit: contain;
      border-radius: 3px;
    }

    .field-group {
      margin-bottom: 13px;
      padding-bottom: 11px;
      border-bottom: 1px solid rgba(128, 128, 128, 0.18);
    }

    .field-group:last-of-type {
      border-bottom: none;
      margin-bottom: 6px;
    }

    .field-label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .segmented-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .seg-btn {
      padding: 8px 10px;
      border: 1.6px solid var(--pill-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .seg-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .text-box {
      width: 100%;
      padding: 8px 12px;
      border: 1.6px solid var(--pill-border);
      border-radius: 12px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 14px;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    .chip-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .chip {
      padding: 5px 10px;
      border: 1.4px solid var(--pill-border);
      border-radius: 999px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent);
      color: #2B1810;
    }

    .size-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .size-btn {
      padding: 6px 2px;
      border: 1.4px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }

    .size-btn.active {
      background: var(--accent);
      color: #2B1810;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: #D97757;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .emoji-item {
      aspect-ratio: 1;
      border: 1.4px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      background: var(--card-bg);
      font-size: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      touch-action: manipulation;
    }

    .emoji-item.active {
      border-color: var(--pill-border);
      background: var(--accent);
    }

    .icon-pick-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .mini-icon-btn {
      width: 34px;
      height: 34px;
      border: 1.4px solid rgba(128, 128, 128, 0.35);
      border-radius: 10px;
      background: var(--card-bg);
      font-size: 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
    }

    .mini-icon-btn.active {
      border-color: var(--pill-border);
      background: var(--accent);
    }

    .mini-icon-input {
      width: 68px;
      padding: 6px 8px;
      border: 1.5px solid var(--pill-border);
      border-radius: 10px;
      background: var(--card-bg);
      color: var(--ink);
      font-family: var(--font-hand);
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      user-select: text;
      -webkit-user-select: text;
    }

    .btn-icon-upload-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 7px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1.2px dashed rgba(128, 128, 128, 0.35);
      font-size: 12px;
      font-weight: 700;
    }

    .btn-icon-upload-left {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .btn-icon-thumb {
      display: none;
      width: 24px;
      height: 24px;
      object-fit: contain;
      border-radius: 5px;
      border: 1px solid rgba(128, 128, 128, 0.3);
      background: #FFFFFF;
    }

    .btn-icon-actions {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .modal-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }
  </style>
</head>
<body>
  <!-- 主互動小豬時鐘畫布 -->
  <canvas id="clockCanvas"></canvas>

  <!-- 頂部可自訂標題列 -->
  <header id="topBar">
    <button id="titleTrigger" type="button" title="點擊修改標題、顯示狀態與後方小圖示">
      <span id="titleText">不理不理左衛門時鐘</span>
      <span id="titleIcon">🐷</span>
      <img id="titleIconImg" alt="標題小圖示" />
      <span class="edit-badge">✎</span>
    </button>
  </header>

  <!-- 輕量操作提示氣泡 -->
  <div id="toast"></div>

  <!-- 底部控制工具列 -->
  <footer id="bottomBar">
    <div class="toolbar-row">
      <button id="btnToggleGather" type="button" class="pill-btn">散開 / 集合</button>
      <button id="btnToggleSize" type="button" class="pill-btn">時間：特大</button>
      <button id="btnToggleNight" type="button" class="pill-btn">夜間模式</button>
      <button id="btnWakeLock" type="button" class="pill-btn">螢幕常亮</button>
      <button id="btnCustomSticker" type="button" class="pill-btn">自訂小豬貼圖</button>
      <button id="btnResetSticker" type="button" class="pill-btn hidden">恢復預設小豬</button>
      <button id="btnOpenSettings" type="button" class="pill-btn">✎ 標題與圖示</button>
      <button id="btnHideBar" type="button" class="pill-btn">
        <span id="hideBtnIcon" class="ctrl-btn-icon">🙈</span>
        <img id="hideBtnImg" class="ctrl-btn-img" alt="隱藏選項圖示" />
        <span>隱藏選項</span>
      </button>
    </div>
    <div class="hint-line">點擊螢幕即可讓小豬散開或集合報時！</div>
    <input id="fileStickerInput" type="file" accept="image/*" multiple class="hidden" />
  </footer>

  <!-- 隱藏選項後的右下角半透明恢復按鈕 -->
  <button id="btnShowBar" type="button" class="hidden" title="顯示底部控制列">
    <span id="showBtnIcon" class="ctrl-btn-icon">👁️</span>
    <img id="showBtnImg" class="ctrl-btn-img" alt="顯示選項圖示" />
    <span>顯示選項</span>
  </button>

  <!-- 標題與圖示自訂設定彈窗 -->
  <div id="titleModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2>✎ 標題與按鈕圖示設定</h2>
        <button id="btnCloseModal" type="button" class="close-btn">✕</button>
      </div>

      <!-- 即時預覽區 -->
      <div class="preview-panel">
        <span class="preview-tag">頂部標題與按鈕即時預覽</span>
        <div id="modalPreview">
          <span id="previewText">不理不理左衛門時鐘</span>
          <span id="previewIcon">🐷</span>
          <img id="previewImg" alt="預覽圖示" />
        </div>
        <div class="preview-btns-bar">
          <span class="preview-mini-pill">
            <span id="prevHideEmoji">🙈</span>
            <img id="prevHideImg" class="preview-mini-img" alt="" />
            <span>隱藏選項</span>
          </span>
          <span class="preview-mini-pill">
            <span id="prevShowEmoji">👁️</span>
            <img id="prevShowImg" class="preview-mini-img" alt="" />
            <span>顯示選項</span>
          </span>
        </div>
      </div>

      <!-- 1. 頂部標題顯示狀態 -->
      <div class="field-group">
        <div class="field-label-row">
          <span>1. 頂部標題顯示狀態</span>
        </div>
        <div class="segmented-row">
          <button type="button" id="btnTitleVisibleOn" class="seg-btn active">顯示標題</button>
          <button type="button" id="btnTitleVisibleOff" class="seg-btn">隱藏標題</button>
        </div>
      </div>

      <!-- 2. 標題文字內容 -->
      <div class="field-group">
        <div class="field-label-row">
          <label for="inputTitle">2. 標題文字內容</label>
          <button id="btnClearTitle" type="button" class="chip">清空文字</button>
        </div>
        <input id="inputTitle" type="text" maxlength="24" class="text-box" placeholder="輸入標題文字（可留空只顯示圖示）" />
        <div class="chip-wrap">
          <button type="button" class="chip preset-title" data-val="不理不理左衛門時鐘">不理不理左衛門時鐘</button>
          <button type="button" class="chip preset-title" data-val="豬豬時鐘">豬豬時鐘</button>
          <button type="button" class="chip preset-title" data-val="午休時間">午休時間</button>
          <button type="button" class="chip preset-title" data-val="起床囉！">起床囉！</button>
        </div>
      </div>

      <!-- 3. 標題字型大小 -->
      <div class="field-group">
        <div class="field-label-row">
          <label for="inputFontSize">3. 標題字型大小</label>
          <span id="fontSizeBadge" class="chip">24px</span>
        </div>
        <div class="size-row">
          <button type="button" class="size-btn" data-size="16">小 16px</button>
          <button type="button" class="size-btn" data-size="20">適中 20px</button>
          <button type="button" class="size-btn" data-size="24">標準 24px</button>
          <button type="button" class="size-btn" data-size="30">大 30px</button>
          <button type="button" class="size-btn" data-size="38">特大 38px</button>
        </div>
        <div class="slider-row">
          <span style="font-size:12px;font-weight:900;opacity:0.65;">A</span>
          <input id="inputFontSize" type="range" min="14" max="42" step="1" value="24" />
          <span style="font-size:18px;font-weight:900;">A</span>
        </div>
      </div>

      <!-- 4. 標題後方小圖示 -->
      <div class="field-group">
        <div class="field-label-row">
          <span>4. 標題後方小圖示</span>
          <button id="btnNoIcon" type="button" class="chip">無圖示 (隱藏)</button>
        </div>
        <div class="emoji-grid" id="emojiGrid">
          <button type="button" class="emoji-item" data-emoji="🐷">🐷</button>
          <button type="button" class="emoji-item" data-emoji="🐽">🐽</button>
          <button type="button" class="emoji-item" data-emoji="⏰">⏰</button>
          <button type="button" class="emoji-item" data-emoji="✨">✨</button>
          <button type="button" class="emoji-item" data-emoji="💖">💖</button>
          <button type="button" class="emoji-item" data-emoji="👑">👑</button>
